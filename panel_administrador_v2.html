const PASOS_CLIENTE = [
  {k:'recibida', l:'Solicitud recibida', estados:['recibida','en_triaje','esperando_info']},
  {k:'visita', l:'Visita técnica', estados:['visita_propuesta','visita_confirmada','en_visita']},
  {k:'propuesta', l:'Presupuesto', estados:['propuesta_enviada']},
  {k:'aceptada', l:'Aceptación', estados:['aceptada']},
  {k:'obra', l:'Obra', estados:['en_obra','en_remates']},
  {k:'cierre', l:'Entrega', estados:['terminada','cerrada']},
];
const ORDEN_FLUJO = ['recibida','en_triaje','esperando_info','visita_propuesta','visita_confirmada','en_visita','propuesta_enviada','aceptada','en_obra','terminada','en_remates','cerrada'];
function vistaCliente(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const cli = clienteDe(c); const v = versionVigente(c); const tv = totalVigente(c);
  const idxActual = ORDEN_FLUJO.indexOf(c.estado);
  let pasos = PASOS_CLIENTE.map(p=>{
    const minIdx = Math.min(...p.estados.map(e=>ORDEN_FLUJO.indexOf(e)).filter(i=>i>=0));
    const esAhora = p.estados.includes(c.estado);
    const hecho = minIdx>=0 && idxActual>minIdx && !esAhora;
    return '<div class="cv-step"><div class="cv-step-dot ' + (esAhora?'now':hecho?'done':'') + '">' + (hecho?'✓':esAhora?'●':'○') + '</div>' + p.l + '</div>';
  }).join('');

  // Acción pedida al cliente
  let accionHtml = '';
  if (c.estado==='esperando_info') accionHtml = '<div class="cv-action"><b>Necesitamos algo más</b><p style="font-size:13px;color:var(--muted);margin:6px 0">Sube las fotos o datos que te hemos pedido.</p><button class="cv-btn" onclick="accCliente(\'' + id + '\',\'responder\')">Enviar información y fotos</button></div>';
  else if (c.estado==='visita_propuesta') accionHtml = '<div class="cv-action"><b>Elige el día de la visita</b>' + (c.visita.franjasOfrecidas||[]).map((f,i)=>'<button class="cv-btn ' + (i>0?'ghost':'') + '" onclick="accCliente(\'' + id + '\',\'elegir_franja\',' + i + ')">' + fmtFecha(f.fecha) + ' · ' + f.franja + '</button>').join('') + '</div>';
  else if (c.estado==='propuesta_enviada') accionHtml = '<div class="cv-action"><b>Tu presupuesto: ' + fmtEur(v?.totales?.total||0) + '</b>' +
      (v?.clausulaAjuste?'<p style="font-size:11px;color:var(--amber);margin:6px 0">Orientativo sin visita; puede ajustarse.</p>':'') +
      '<button class="cv-btn" onclick="accCliente(\'' + id + '\',\'aceptar\')">Aceptar presupuesto</button>' +
      '<button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'pedir_cambios\')">Pedir cambios</button>' +
      '<button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'rechazar\')">No me interesa</button></div>';
  else if (c.estado==='en_pausa') accionHtml = '<div class="cv-action"><b>Caso en pausa</b><button class="cv-btn" onclick="accCliente(\'' + id + '\',\'reactivar\')">Reactivar mi solicitud</button></div>';
  else if (c.estado==='caducada') accionHtml = '<div class="cv-action"><b>Tu presupuesto ha caducado</b><button class="cv-btn" onclick="accCliente(\'' + id + '\',\'renovar\')">Pedir presupuesto actualizado</button></div>';
  else if (c.estado==='en_obra') {
    const pend = (c.obra.cambios||[]).filter(x=>x.estado==='registrado');
    accionHtml = '<div class="cv-action"><b>Tu obra en marcha</b>' +
      pend.map(ch=>'<div style="font-size:12px;padding:4px 0">Cambio: ' + escH(ch.concepto) + ' (' + fmtEur(ch.importe) + ') <button class="abtn abtn-ghost abtn-sm" onclick="accClienteCambio(\'' + id + '\',\'' + ch.id + '\')">No estoy de acuerdo</button></div>').join('') +
      '<button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'pedir_cambios\')">Pedir un cambio</button></div>';
  }
  else if (c.estado==='en_remates') accionHtml = '<div class="cv-action"><b>Obra terminada</b><p style="font-size:13px;color:var(--muted);margin:6px 0">Revisa los remates y danos tu conformidad.</p><button class="cv-btn" onclick="toast(\'Conformidad simulada — Fase D\')">Dar conformidad</button></div>';

  const desglose = '<div class="section-card" style="background:#fff"><div class="section-card-title">Tu presupuesto</div>' +
    (v?'<div class="kv"><span class="k">Versión vigente</span>' + v.id + ' · ' + fmtFecha(v.enviadaAt||v.creadaAt) + '</div>':'') +
    (['aceptada','en_obra','en_remates','terminada','cerrada'].includes(c.estado)?
      '<div class="kv"><span class="k">Firmado</span>' + fmtEur(tv.firmado) + '</div>' + (tv.provisional?'<div class="kv"><span class="k">Provisional</span>' + fmtEur(tv.provisional) + '</div>':'') + '<div class="kv"><span class="k">Total vigente</span><b>' + fmtEur(tv.total) + '</b></div>'
      :'<div class="kv"><span class="k">Total</span><b>' + fmtEur(v?.totales?.total||0) + '</b></div>') + '</div>';

  openModal('<div class="modal-title">Tu reforma con ' + escH(DB.cfg.empresa.nombre) + '</div>' +
    '<p style="font-size:12px;color:var(--muted);margin-bottom:10px">Esto es lo que vería ' + escH(cli.nombre.split(' ')[0]) + ' en su enlace privado.</p>' +
    '<div class="cliente-view">' + pasos + accionHtml + desglose + '</div>' +

}
function accCliente(id, accion, franjaIdx){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const datos = {};
  if (accion==='elegir_franja' && franjaIdx!=null) datos.franja = c.visita.franjasOfrecidas[franjaIdx];
  if (accion==='pedir_cambios') datos.texto = 'Me gustaría revisar algún acabado';
  if (accion==='rechazar') datos.motivo = 'Encontré otra oferta';
  try{ aplicarAccionCliente(c, accion, datos); }catch(e){ toast(e.message,'err'); return; }
  toast('Acción del cliente aplicada');
  renderPaginaActual();
  vistaCliente(id);
}
function accClienteCambio(id, cambioId){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const ch = (c.obra.cambios||[]).find(x=>x.id===cambioId); if(ch){ ch.estado='en_desacuerdo'; (c.eventos).push({fecha:hoy(),tipo:'cliente',texto:'El cliente NO está de acuerdo con el cambio: ' + ch.concepto,autor:'cliente'}); }
  toast('Desacuerdo registrado · avisado el reformista'); renderPaginaActual(); vistaCliente(id);
}

function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (email === DB.cfg.empresa.email && pass === 'admin1234'){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-shell').style.display = 'block';
    document.getElementById('demo-panel').classList.add('visible');
    actualizarDemoFecha();
    navegarA('resumen', document.getElementById('nb-resumen'));
  } else {
    document.getElementById('l-err').style.display = 'block';
  }
}
function doLogout(){
  document.getElementById('admin-shell').style.display = 'none';
  document.getElementById('demo-panel').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  closeAllModals();
}
function actualizarDemoFecha(){
  const txt = fmtFecha(hoy()) + (_hoyOffset ? ' (+' + _hoyOffset + 'd)' : '');
  document.getElementById('demo-fecha-txt').textContent = txt;
}
function aplicarRelojesAutomaticos(){
  DB.casos.forEach(c => {
    evaluarRelojes(c, DB.cfg, hoy()).forEach(acc => {
      try {
        if (acc.accion === 'transitar_a_pausa' && c.estado !== 'en_pausa' && puedeTransitar(c, 'en_pausa'))
          transitar(c, 'en_pausa', {autor:'sistema', texto:'Pausado automáticamente (sin respuesta)'});
        if (acc.accion === 'marcar_caducada' && c.estado === 'propuesta_enviada' && puedeTransitar(c, 'caducada')){
          transitar(c, 'caducada', {autor:'sistema', texto:'Propuesta caducada automáticamente'});
          const v = c.versiones.find(x => x.estado === 'vigente'); if (v) v.estado = 'caducada';
        }
      } catch(e){}
    });
  });
}
function avanzarTiempo(dias){
  _hoyOffset += dias; DB.meta.hoyOffsetDias = _hoyOffset;
  aplicarRelojesAutomaticos();
  actualizarDemoFecha();
  renderPaginaActual();
  toast('Avanzado ' + dias + ' día' + (dias>1?'s':'') + ' · ' + fmtFecha(hoy()));
}
function volverHoy(){
  _hoyOffset = 0; DB = crearDBInicial();
  actualizarDemoFecha(); renderPaginaActual();
  toast('Fecha restablecida a hoy');
}
function restablecerDatos(){
  _hoyOffset = 0; DB = crearDBInicial();
  catFiltroCat = 'todos'; bandejaFiltro = 'activos';
  actualizarDemoFecha(); renderPaginaActual();
  toast('Datos de demostración restablecidos');
}

// Arranque
(function init(){
  actualizarDemoFecha();
  const res = window.__tests();
  console.log('%cPanel del reformista v2 — Fase A cargada. Ejecuta __tests() en consola para ver el detalle.', 'color:#c96f28');
  if (res.fails && res.fails.length) console.warn('Tests con fallos:', res.fails);
})();
</script>
