      '<span class="caso-ref">' + caso.id + '</span>' + badgeEstado(caso.estado) +
      '<span class="caso-nombre">' + escH(cli.nombre) + '</span>' +
      prioChip(prio.nivel) +
      '<button class="accion-btn" onclick="event.stopPropagation();toast(\'Acción: ' + escH(ac.label) + '\')">' + escH(ac.label) + '</button>' +
    '</div>' +
    '<div class="caso-card-mid">' +
      '<span class="caso-tipo">' + nombreTipoObra(caso.solicitud.tipoObra) + ' · ' + escH(cli.zona||'') + '</span>' +
      '<span class="caso-importe">' + (lo&&hi ? fmtEur0(lo) + '–' + fmtEur0(hi) : fmtEur(total)) + '</span>' +
      scoreBar(sc.total) +
      '<span class="caso-dias">' + prio.horasEspera + 'h espera</span>' +
    '</div>' +
    (sc.etiquetas.length ? '<div style="margin-top:6px">' + etiqChips(sc.etiquetas.slice(0,4)) + '</div>' : '') +
    '</div>';
}

// ═══════════════════════════════════════════════════════
// SECCIÓN 9: PRESUPUESTOS (bandeja · seguimiento · por estado · archivo)
// ═══════════════════════════════════════════════════════
let presuTab = 'bandeja';
let bandejaSort = 'prioridad';
let bandejaF = { estado:'', zona:'', tipo:'', soloFotos:false, q:'' };
const porqueAbierto = {};

function esperaConRespuesta(caso){
  if (caso.estado !== 'esperando_info') return false;
  const ultTrans = [...(caso.eventos||[])].reverse().find(e=>e.tipo==='transicion' && /esperando/i.test(e.texto||''));
  const desde = ultTrans?.fecha || caso.creadoAt;
  return (caso.eventos||[]).some(e => e.autor==='cliente' && new Date(e.fecha) >= new Date(desde));
}
function enBandeja(caso){ return ['recibida','en_triaje','en_visita'].includes(caso.estado) || esperaConRespuesta(caso); }
function enSeguimiento(caso){ return ['esperando_info','visita_propuesta','visita_confirmada','propuesta_enviada'].includes(caso.estado) && !esperaConRespuesta(caso); }
function enArchivo(caso){ return ['descartada','rechazada','caducada','en_pausa','archivada'].includes(caso.estado); }

RENDERERS.presupuestos = function(){
  const nBandeja = DB.casos.filter(enBandeja).length;
  const nSeg = DB.casos.filter(enSeguimiento).length;
  const nArch = DB.casos.filter(enArchivo).length;
  const tab = (k,l,n) => '<button class="tab ' + (presuTab===k?'active':'') + '" onclick="presuTab=\'' + k + '\';RENDERERS.presupuestos()">' + l + (n!=null?'<span class="tab-n">' + n + '</span>':'') + '</button>';
  let cuerpo = '';
  if (presuTab==='bandeja') cuerpo = cuerpoBandeja();
  else if (presuTab==='seguimiento') cuerpo = cuerpoSeguimiento();
  else if (presuTab==='estado') cuerpo = cuerpoPorEstado();
  else if (presuTab==='archivo') cuerpo = cuerpoArchivo();
  document.getElementById('pg-presupuestos').innerHTML =
    '<div class="page-hdr"><div><div class="page-title">Presupuestos</div><div class="page-sub">Gestión de pedidos y propuestas</div></div></div>' +
    '<div class="tabs">' + tab('bandeja','Bandeja',nBandeja) + tab('seguimiento','Seguimiento',nSeg) + tab('estado','Por estado') + tab('archivo','Archivo',nArch) + '</div>' +
    cuerpo;
};

function cuerpoBandeja(){
  let items = DB.casos.filter(enBandeja).map(c => ({ caso:c, prio:scorePrioridad(c,DB.cfg,hoy()), cal:scoreCalidad(c,DB.cfg) }));
  // filtros
  if (bandejaF.estado) items = items.filter(x=>x.caso.estado===bandejaF.estado);
  if (bandejaF.zona) items = items.filter(x=>(x.caso.vivienda.zona||zonaDeCp(x.caso.vivienda.cp,DB.cfg))===bandejaF.zona);
  if (bandejaF.tipo) items = items.filter(x=>x.caso.solicitud.tipoObra===bandejaF.tipo);
  if (bandejaF.soloFotos) items = items.filter(x=>(x.caso.solicitud.fotosCliente||[]).length>0);
  if (bandejaF.q){ const q=bandejaF.q.toLowerCase(); items = items.filter(x=>{ const cl=clienteDe(x.caso); return (cl.nombre+' '+cl.zona+' '+x.caso.id+' '+(x.caso.vivienda.direccion||'')).toLowerCase().includes(q); }); }
  // orden
  const sorters = { prioridad:(a,b)=>b.prio.total-a.prio.total, calidad:(a,b)=>b.cal.total-a.cal.total, espera:(a,b)=>b.prio.horasEspera-a.prio.horasEspera, importe:(a,b)=>(b.caso.versiones[0]?.totales?.total||0)-(a.caso.versiones[0]?.totales?.total||0) };
  items.sort(sorters[bandejaSort]||sorters.prioridad);
  const porRevisar = DB.casos.filter(c=>['recibida'].includes(c.estado)).length;

  const selSort = '<select onchange="bandejaSort=this.value;RENDERERS.presupuestos()">' + [['prioridad','Prioridad'],['calidad','Calidad'],['espera','Espera'],['importe','Importe']].map(o=>'<option value="'+o[0]+'"'+(bandejaSort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('') + '</select>';
  const selEstado = '<select onchange="bandejaF.estado=this.value;RENDERERS.presupuestos()"><option value="">Todos los estados</option>' + ['recibida','en_triaje','esperando_info','en_visita'].map(e=>'<option value="'+e+'"'+(bandejaF.estado===e?' selected':'')+'>'+ESTADO_LABEL[e]+'</option>').join('') + '</select>';
  const selZona = '<select onchange="bandejaF.zona=this.value;RENDERERS.presupuestos()"><option value="">Toda zona</option>' + ['dentro','limite','fuera'].map(z=>'<option value="'+z+'"'+(bandejaF.zona===z?' selected':'')+'>'+z+'</option>').join('') + '</select>';
  const selTipo = '<select onchange="bandejaF.tipo=this.value;RENDERERS.presupuestos()"><option value="">Todo tipo</option>' + ['reforma_integral','reforma_bano','reforma_cocina','reforma_parcial'].map(t=>'<option value="'+t+'"'+(bandejaF.tipo===t?' selected':'')+'>'+nombreTipoObra(t)+'</option>').join('') + '</select>';

  return '<div class="ctrl-row">' +
      '<span class="ctrl-lbl">Ordenar</span>' + selSort + selEstado + selZona + selTipo +
      '<label class="ctrl-check"><input type="checkbox"' + (bandejaF.soloFotos?' checked':'') + ' onchange="bandejaF.soloFotos=this.checked;RENDERERS.presupuestos()"> Solo con fotos</label>' +
      '<input type="text" placeholder="Buscar…" value="' + escH(bandejaF.q) + '" oninput="bandejaF.q=this.value;clearTimeout(window._bq);window._bq=setTimeout(RENDERERS.presupuestos,250)">' +
      '<span class="bandeja-count">' + items.length + ' por revisar · ' + porRevisar + ' nuevos</span>' +
    '</div>' +
    (items.length ? items.map(x=>filaBandeja(x.caso, x.prio, x.cal)).join('') : '<div class="section-card" style="text-align:center;color:var(--muted)">Sin casos que coincidan.</div>');
}

function barra2(cal, prio){
  const plazo = DB.cfg.plazoRespuestaHoras;
  const esperaPct = clamp(prio.horasEspera/plazo*100, 0, 100);
  const colEsp = prio.horasEspera>=plazo?'var(--danger)':prio.horasEspera>=plazo*0.6?'var(--amber)':'var(--warm)';
  const colCal = cal.total>=66?'var(--ok)':cal.total>=40?'var(--accent)':'var(--muted)';
  return '<div class="bar2">' +
    '<div class="bar2-line"><span class="bar2-lbl">Calidad ' + cal.total + '</span><div class="bar2-track"><div class="bar2-fill" style="width:' + cal.total + '%;background:' + colCal + '"></div></div></div>' +
    '<div class="bar2-line"><span class="bar2-lbl">Espera ' + prio.horasEspera + 'h/' + plazo + 'h</span><div class="bar2-track"><div class="bar2-fill" style="width:' + esperaPct + '%;background:' + colEsp + '"></div></div></div>' +
  '</div>';
}
function porqueHtml(caso, cal, prio){
  const facs = cal.factores.map(f=>'<div class="pq-factor"><span class="pq-lbl">' + f.label + '</span><div class="pq-bar"><div style="width:' + (f.puntos/f.max*100) + '%"></div></div><span class="pq-pts">' + f.puntos + '/' + f.max + '</span></div>').join('');
  const comps = [['Espera',prio.espera,50],['Calidad (×0,3)',prio.calidad,30],['Actividad',prio.actividad,20]].map(c=>'<div class="pq-factor"><span class="pq-lbl">' + c[0] + '</span><div class="pq-bar"><div style="width:' + (c[1]/c[2]*100) + '%"></div></div><span class="pq-pts">' + c[1] + '/' + c[2] + '</span></div>').join('');
  return '<div class="porque"><div class="porque-grid">' +
    '<div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">Calidad · 7 factores</b>' + facs + '<div class="pq-total"><span>Total calidad</span><span>' + cal.total + '/100</span></div></div>' +
    '<div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">Prioridad · 3 componentes</b>' + comps + '<div class="pq-total"><span>Total prioridad</span><span>' + prio.total + '/100</span></div></div>' +
  '</div></div>';
}
function botonesTriaje(caso){
  if (caso.estado==='en_visita') return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" onclick="event.stopPropagation()"><button class="abtn abtn-sm abtn-primary" onclick="abrirModoVisita(\''+caso.id+'\')">★ '+(caso.visita.estado==='realizada'?'Reabrir Modo visita':'Continuar Modo visita')+'</button><button class="abtn abtn-sm abtn-ghost" onclick="abrirCaso(\''+caso.id+'\');_fichaTab=\'presupuesto\';renderFicha()">Revisar borrador y enviar</button></div>';
  const ac = accionSugerida(caso, DB.cfg);
  const mapa = { hacer_visita:'proponer', pedir_info_fotos:'pedir', enviar_presupuesto:'presupuesto', revisar_descarte:'descartar' };
  const sug = mapa[ac.id] || 'proponer';
  const exits = [['proponer','Proponer visita','exitProponerVisita'],['pedir','Pedir info/fotos','exitPedirInfo'],['presupuesto','Presupuesto sin visita','exitPresupuestoSinVisita'],['descartar','Descartar','exitDescartar']];
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" onclick="event.stopPropagation()">' +
    exits.map(e=>'<button class="abtn abtn-sm ' + (e[0]===sug?'abtn-primary':'abtn-ghost') + '" title="' + (e[0]===sug?escH(ac.motivo):'') + '" onclick="' + e[2] + '(\'' + caso.id + '\')">' + (e[0]===sug?'★ ':'') + e[1] + '</button>').join('') +
  '</div>';
}
function filaBandeja(caso, prio, cal){
  prio = prio||scorePrioridad(caso,DB.cfg,hoy()); cal = cal||scoreCalidad(caso,DB.cfg);
  const cli = clienteDe(caso); const v = caso.versiones[0];
  const resumen = nombreTipoObra(caso.solicitud.tipoObra) + ' · ' + (caso.solicitud.espacios||[]).reduce((s,e)=>s+(e.m2||0),0) + ' m²';
  const abierto = porqueAbierto[caso.id];
  return '<div class="caso-card">' +
    '<div class="caso-card-top" onclick="abrirCaso(\'' + caso.id + '\')" style="cursor:pointer">' +
      '<span class="caso-ref">' + caso.id + '</span>' + badgeEstado(caso.estado) +
      '<span class="caso-nombre">' + escH(cli.nombre) + '</span>' + prioChip(prio.nivel) +
      '<span class="caso-importe" style="margin-left:auto">' + (v?.totales?.lo?fmtEur0(v.totales.lo)+'–'+fmtEur0(v.totales.hi):'—') + '</span>' +
    '</div>' +
    '<div class="caso-card-mid">' +
      '<span class="caso-tipo">' + resumen + ' · ' + escH(cli.zona||'') + '</span>' +
      barra2(cal, prio) +
      '<button class="abtn abtn-ghost abtn-sm" onclick="porqueAbierto[\'' + caso.id + '\']=!porqueAbierto[\'' + caso.id + '\'];RENDERERS.presupuestos()">' + (abierto?'Ocultar':'Por qué') + '</button>' +
    '</div>' +
    (cal.etiquetas.length?'<div style="margin-top:6px">' + etiqChips(cal.etiquetas.slice(0,5)) + '</div>':'') +
    (abierto?porqueHtml(caso,cal,prio):'') +
    botonesTriaje(caso) +
  '</div>';
}

function cuerpoSeguimiento(){
  const items = DB.casos.filter(enSeguimiento).map(c=>({caso:c, relojes:evaluarRelojes(c,DB.cfg,hoy())}));
  if (!items.length) return '<div class="section-card" style="text-align:center;color:var(--muted)">Nada esperando al cliente.</div>';
  const rows = items.map(x=>{
    const c=x.caso, cli=clienteDe(c); const prio=scorePrioridad(c,DB.cfg,hoy());
    const debido = x.relojes.find(r=>['recordatorio','caducidad','pausa','aviso_caducidad','recordatorio_visita','visita_hoy'].includes(r.tipo));
    const accBtn = debido ? '<button class="abtn abtn-primary abtn-sm" onclick="event.stopPropagation();exitRecordatorio(\'' + c.id + '\')">Preparar recordatorio</button>' : '<span style="color:var(--muted);font-size:12px">—</span>';
    return '<tr onclick="abrirCaso(\'' + c.id + '\')" style="cursor:pointer"><td><b>' + escH(cli.nombre) + '</b><br><span style="font-size:11px;color:var(--muted)">' + c.id + '</span></td>' +
      '<td>' + badgeEstado(c.estado) + '</td>' +
      '<td>' + prio.horasEspera + ' h</td>' +
      '<td>' + (debido?'<span class="badge b-warn">' + debido.tipo.replace(/_/g,' ') + '</span>':'<span class="badge b-mute">al día</span>') + '</td>' +
      '<td onclick="event.stopPropagation()">' + accBtn + '</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Estado</th><th>En espera</th><th>Reloj</th><th>Acción</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function cuerpoPorEstado(){
  const orden = ['recibida','en_triaje','esperando_info','visita_propuesta','visita_confirmada','en_visita','propuesta_enviada','aceptada'];
  const cols = orden.map(est=>{
    const cs = DB.casos.filter(c=>c.estado===est);
    const cards = cs.map(c=>{ const cli=clienteDe(c); return '<div class="kan-card" onclick="abrirCaso(\'' + c.id + '\')"><div class="kan-card-nombre">' + escH(cli.nombre) + '</div><div style="color:var(--muted)">' + nombreTipoObra(c.solicitud.tipoObra) + '</div><div style="color:var(--muted);font-size:11px">' + c.id + '</div></div>'; }).join('') || '<div style="font-size:11px;color:var(--muted)">—</div>';
    return '<div class="kan-col"><div class="kan-col-hdr">' + ESTADO_LABEL[est] + '<span>' + cs.length + '</span></div>' + cards + '</div>';
  }).join('');
  return '<div class="kanban">' + cols + '</div><div style="font-size:12px;color:var(--muted);margin-top:8px">El cambio de estado se hace con las acciones del caso, no arrastrando tarjetas.</div>';
}

function cuerpoArchivo(){
  const cs = DB.casos.filter(enArchivo);
  if (!cs.length) return '<div class="section-card" style="text-align:center;color:var(--muted)">Archivo vacío.</div>';
  const rows = cs.map(c=>{
    const cli=clienteDe(c);
    const motivo = c.interno?.motivoDescarte || (c.estado==='caducada'?'Propuesta vencida':c.estado==='en_pausa'?'En pausa a petición del cliente':c.estado==='rechazada'?'Rechazada por el cliente':'—');
    let acciones='';
    if (c.estado==='caducada') acciones='<button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();accionArchivo(\'' + c.id + '\',\'renovar\')">Renovar</button>';
    else if (c.estado==='descartada') acciones='<button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();accionArchivo(\'' + c.id + '\',\'reabrir\')">Reabrir</button>';
    else if (c.estado==='en_pausa') acciones='<button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();accionArchivo(\'' + c.id + '\',\'reactivar\')">Reactivar</button>';
    else if (c.estado==='rechazada') acciones='<button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();accionArchivo(\'' + c.id + '\',\'renegociar\')">Renegociar</button>';
    return '<tr onclick="abrirCaso(\'' + c.id + '\')" style="cursor:pointer"><td><b>' + escH(cli.nombre) + '</b><br><span style="font-size:11px;color:var(--muted)">' + c.id + '</span></td><td>' + badgeEstado(c.estado) + '</td><td style="font-size:12px">' + escH(motivo) + '</td><td onclick="event.stopPropagation()">' + (acciones||'—') + '</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Estado</th><th>Motivo</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function accionArchivo(id, accion){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  try{
    if (accion==='renovar'){ aplicarAccionCliente(c,'renovar'); toast('Propuesta renovada'); }
    else if (accion==='reactivar'){ aplicarAccionCliente(c,'reactivar'); toast('Caso reactivado'); }
    else if (accion==='reabrir'){ if(puedeTransitar(c,'en_triaje')){transitar(c,'en_triaje',{autor:'reformista',texto:'Reabierto desde descarte'}); toast('Caso reabierto');} }
    else if (accion==='renegociar'){ if(puedeTransitar(c,'propuesta_enviada')){ const nv=nuevaVersionDesde(c,'renegociada'); enviarVersion(c,nv,'WhatsApp'); transitar(c,'propuesta_enviada',{autor:'reformista',texto:'Renegociación: nueva versión'}); toast('Nueva versión para renegociar');} }
  }catch(e){ toast(e.message,'err'); }
  RENDERERS.presupuestos();
}

// ── Las cuatro salidas del triaje ──────────────────────
let _triaje = { franjas:[], sel:[] };
function exitProponerVisita(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  _triaje = { franjas: franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14, id).slice(0,12), sel: [], casoId:id };
  renderExitProponer(c);
}
function renderExitProponer(c){
  const cli = clienteDe(c);
  const opts = _triaje.franjas.map((f,i)=>'<div class="franja-opt ' + (_triaje.sel.includes(i)?'sel':'') + '" onclick="toggleFranja(' + i + ')"><input type="checkbox" ' + (_triaje.sel.includes(i)?'checked':'') + ' ' + (!_triaje.sel.includes(i)&&_triaje.sel.length>=3?'disabled':'') + '> ' + fmtFecha(f.fecha) + ' · ' + f.franja + '</div>').join('');
  c.visita.franjasOfrecidas = _triaje.sel.map(i=>_triaje.franjas[i]);
  const msg = fillTpl(PLANTILLAS_MSG.proponer_visita, varsDe(c));
  openModal('<div class="modal-title">Proponer visita · ' + escH(cli.nombre) + '</div>' +
    '<p style="font-size:13px;color:var(--muted);margin-bottom:10px">Elige hasta 3 huecos de tu agenda. Se generará la versión V' + ((c.versiones.length)+1) + ' (revisable) y el caso pasará a «Visita propuesta».</p>' +
    opts +
    '<div class="modal-section"><b style="font-size:12px;text-transform:uppercase;color:var(--muted)">Vista previa del mensaje</b>' + (_triaje.sel.length?msgBloque(msg, cli.tel):'<p style="font-size:13px;color:var(--muted);margin-top:8px">Selecciona al menos una franja.</p>') + '</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="closeAllModals()">Cancelar</button>' +
    '<button class="abtn abtn-primary" ' + (_triaje.sel.length?'':'disabled style="opacity:.5"') + ' onclick="confirmarProponer(\'' + c.id + '\')">Proponer visita</button></div>');
}
function toggleFranja(i){ const p=_triaje.sel.indexOf(i); if(p>=0)_triaje.sel.splice(p,1); else if(_triaje.sel.length<3)_triaje.sel.push(i); renderExitProponer(DB.casos.find(x=>x.id===_triaje.casoId)); }
function confirmarProponer(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  c.visita.franjasOfrecidas = _triaje.sel.map(i=>_triaje.franjas[i]);
  c.visita.estado = 'propuesta'; c.visita.cobro = { importe:importeVisita(c,DB.cfg), politica:'reprogramable', estado:'pendiente' };
  const nv = nuevaVersionDesde(c,'revisada'); c.versiones.push(nv); // V2 borrador editable
  try{ if(c.estado!=='visita_propuesta' && puedeTransitar(c,'visita_propuesta')) transitar(c,'visita_propuesta',{autor:'reformista',texto:'Propuesta ' + c.visita.franjasOfrecidas.length + ' franjas de visita'}); }catch(e){ if(puedeTransitar(c,'visita_propuesta')===false && c.estado==='en_triaje'){} }
  (c.eventos).push({fecha:hoy(),tipo:'version',texto:'Generada ' + nv.id + ' (revisable antes de enviar)',autor:'reformista'});
  closeAllModals(); toast('Visita propuesta · ' + nv.id + ' creada'); RENDERERS.presupuestos();
}

function exitPedirInfo(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return; const cli=clienteDe(c);
  const chk = generarChecklist(c).filter(q=>q.tipo!=='foto');
  const vistos = new Set(); const uniq = chk.filter(q=>{ if(vistos.has(q.tplId)) return false; vistos.add(q.tplId); return true; }).slice(0,6);
  _pedir = { items: uniq.map(q=>({q:q.label.replace(/ \(m²\)| \(m\)| \(con foto\)/g,''), on:false})), fotos:true };
  renderPedir(c);
}
let _pedir = {items:[],fotos:true};
function renderPedir(c){
  const cli=clienteDe(c);
  const lista = _pedir.items.map((it,i)=>'<label class="check-q"><input type="checkbox" ' + (it.on?'checked':'') + ' onchange="_pedir.items[' + i + '].on=this.checked;renderPedir(DB.casos.find(x=>x.id===\'' + c.id + '\'))"> ' + escH(it.q) + '</label>').join('');
  const pedidos = _pedir.items.filter(x=>x.on).map(x=>x.q);
  if (_pedir.fotos) pedidos.push('fotos del estado actual');

function abrirCaso(id){ _fichaId = id; _fichaTab = 'resumen'; _fichaDiff = null; renderFicha(); }

    cuerpo;

    '<div class="inl-field"><label>Tipo / m²</label>' + inp('vivienda.tipo', c.vivienda.tipo) + inp('vivienda.m2', c.vivienda.m2, 'number') + '</div>' +
    '<div class="inl-field"><label>Antigüedad</label>' + selV('vivienda.antiguedad', c.vivienda.antiguedad, [['<1980','<1980'],['1980-2000','1980-2000'],['>2000','>2000'],['desconocida','desconocida']]) + '</div>' +
    '<div class="inl-field"><label>Propietario</label>' + selV('vivienda.propietario', c.vivienda.propietario, [[true,'Sí'],[false,'No']]) + '</div>' +
    '<div class="inl-field"><label>Comunidad</label>' + selV('vivienda.comunidad', c.vivienda.comunidad, [['no_aplica','No aplica'],['resuelta','Resuelta'],['pendiente','Pendiente'],['no','No']]) + '</div>' +
    '<div class="inl-field"><label>Humedades</label>' + selV('vivienda.humedades', c.vivienda.humedades, [[true,'Sí'],[false,'No']]) + '</div>' +
    '<div class="inl-field"><label>Tope presupuesto</label>' + inp('vivienda.topePresupuesto', c.vivienda.topePresupuesto, 'number') + '</div>' +
    '<div class="inl-field"><label>Inicio deseado</label>' + inp('vivienda.fechaInicioDeseada', c.vivienda.fechaInicioDeseada, 'date') + '</div></div>';
  // Solicitud
  h += '<div class="section-card"><div class="section-card-title">Solicitud (editable)</div>' +
    '<div class="inl-field"><label>Tipo de obra</label>' + selV('solicitud.tipoObra', c.solicitud.tipoObra, [['reforma_integral','Reforma integral'],['reforma_bano','Reforma de baño'],['reforma_cocina','Reforma de cocina'],['reforma_parcial','Reforma parcial']]) + '</div>' +
    '<div class="inl-field"><label>Calidad</label>' + selV('solicitud.calidad', c.solicitud.calidad, [['basica','Básica'],['media','Media'],['premium','Premium']]) + '</div>' +
    '<div class="kv"><span class="k">Espacios</span>' + (c.solicitud.espacios||[]).map(e=>escH((e.nombre||e.tipo)+' '+e.m2+'m²')).join(' · ') + '</div>' +
    '<div class="kv"><span class="k">Fotos</span>' + ((c.solicitud.fotosCliente||[]).length||'sin') + ' fotos</div>' +
    (c.solicitud.notasCliente?'<div class="kv"><span class="k">Nota cliente</span><i>“' + escH(c.solicitud.notasCliente) + '”</i></div>':'') + '</div>';
  // Prioridad y calidad
  h += '<div class="section-card"><div class="section-card-title">Prioridad ' + prio.total + ' · Calidad ' + sc.total + ' · Incertidumbre ' + inc.nivel + '</div>' +

  // Relojes / recordatorios

  return h;
}
function editCampo(ruta, val){
  const c = DB.casos.find(x=>x.id===_fichaId); if(!c) return;
  const parts = ruta.split('.'); let o = c;
  for (let i=0;i<parts.length-1;i++) o = o[parts[i]] = o[parts[i]]||{};
  const key = parts[parts.length-1];
  if (val==='true') val=true; else if (val==='false') val=false;
  else if (val!=='' && !isNaN(val) && ['m2','topePresupuesto'].includes(key)) val=Number(val);
  o[key] = val===''?null:val;
  if (ruta==='vivienda.cp') c.vivienda.zona = zonaDeCp(val, DB.cfg);
  renderFicha();
}

function fichaHistorial(c){
  const evs = [...(c.eventos||[])].reverse();
  return '<div class="section-card"><div class="section-card-title">Línea de tiempo</div>' +
    (evs.length?evs.map(e=>'<div class="tl-item"><div class="tl-dot ' + (e.autor||'') + '"></div><div style="flex:1"><div>' + escH(e.texto) + '</div><div class="tl-autor">' + fmtFecha(e.fecha) + ' · ' + (e.autor||'') + '</div></div></div>').join(''):'<div style="color:var(--muted);font-size:12px">Sin eventos.</div>') + '</div>';
}

function versionVigente(c){ return c.versiones.find(v=>v.estado==='vigente') || c.versiones.find(v=>v.estado==='aceptada') || c.versiones[c.versiones.length-1]; }
function asegurarBorrador(c){ if(!c.borrador){ const v=versionVigente(c); c.borrador={ lineas:clonarLineas(v.lineas||[]), ivaPct:v.ivaPct||DB.cfg.iva, basadoEn:v.id }; } return c.borrador; }
function totalesBorrador(c){ const b=c.borrador; return calcularTotales(b.lineas, b.ivaPct, DB.cfg.margen, DB.cfg.minimo); }

function fichaPresupuesto(c){
  const vig = versionVigente(c);
  let h = '';
  // Versiones + comparador
  h += '<div class="section-card"><div class="section-card-title">Versiones</div>';
  h += c.versiones.map(v=>{
    const cls = v.estado==='vigente'?'vigente':v.estado==='aceptada'?'aceptada':'';
    return '<span class="ver-chip ' + cls + '" onclick="_fichaDiff=\'' + v.id + '\';renderFicha()">' + v.id + ' · ' + (v.tipo||'') + ' · ' + fmtEur0(v.totales.total) + (v.estado==='vigente'?' ✓':'') + '</span>';
  }).join('');
  if (_fichaDiff){
    const vIdx = c.versiones.findIndex(v=>v.id===_fichaDiff);
    const vA = c.versiones[vIdx-1], vB = c.versiones[vIdx];
    if (vB){
      if (vA){ const d = diffVersiones(vA,vB);
        h += '<div class="porque" style="margin-top:10px"><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">' + vB.id + ' vs ' + vA.id + '</b>' +
          d.anyadidas.map(l=>'<div class="diff-row diff-add">+ ' + escH(l.concepto) + ' (' + fmtEur(l.subtotal) + ')</div>').join('') +
          d.quitadas.map(l=>'<div class="diff-row diff-del">− ' + escH(l.concepto) + '</div>').join('') +
          d.cambiadas.map(x=>'<div class="diff-row diff-chg">~ ' + escH(x.a.concepto) + ': ' + fmtEur(x.de.subtotal) + ' → ' + fmtEur(x.a.subtotal) + '</div>').join('') +
          (d.anyadidas.length+d.quitadas.length+d.cambiadas.length===0?'<div class="diff-row" style="color:var(--muted)">Sin diferencias de líneas.</div>':'') + '</div>';
      } else h += '<div class="porque" style="margin-top:10px">' + vB.id + ' es la primera versión.</div>';
    }
  }
  h += '</div>';

  if (c.borrador){
    const b = c.borrador; const tot = totalesBorrador(c);
    h += '<div class="section-card" style="border-color:var(--accent)"><div class="section-card-title" style="color:var(--accent)">Borrador sin enviar (basado en ' + b.basadoEn + ')</div>';
    h += tablaLineas(c, b.lineas, true);
    h += '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<label style="font-size:12px;color:var(--muted)">IVA <select onchange="c_setIva(this.value)">' + [21,10,0].map(i=>'<option value="' + i + '"' + (b.ivaPct===i?' selected':'') + '>' + i + '%</option>').join('') + '</select></label>' +
      '<span style="font-size:11px;color:var(--amber)">Confirmar el criterio de IVA con el gestor</span>' +
      '<button class="abtn abtn-ghost abtn-sm" onclick="c_addLinea()">+ Añadir línea</button>' +
      '<button class="abtn abtn-ghost abtn-sm" onclick="c_recalcular()">Recalcular</button>' +
    '</div>';
    h += '<div class="totbar"><span>Subtotal <b>' + fmtEur(tot.subtotal) + '</b></span><span>Margen <b>' + fmtEur(tot.margen) + '</b></span><span>IVA <b>' + fmtEur(tot.iva) + '</b></span><span class="tot-final">' + fmtEur(tot.total) + '</span></div>';
    h += '<div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost abtn-sm" onclick="c_descartarBorrador()">Descartar borrador</button><button class="abtn abtn-primary abtn-sm" onclick="c_enviarVersion()">Enviar versión</button></div>';
    h += '</div>';
  } else {
    h += '<div class="section-card"><div class="section-card-title">Versión vigente · ' + (vig?.id||'—') + ' · IVA ' + (vig?.ivaPct||21) + '%</div>';
    h += tablaLineas(c, vig?.lineas||[], false);
    const tot = vig?.totales||{};
    h += '<div class="totbar"><span>Subtotal <b>' + fmtEur(tot.subtotal||0) + '</b></span><span>Margen <b>' + fmtEur(tot.margen||0) + '</b></span><span>IVA <b>' + fmtEur(tot.iva||0) + '</b></span><span class="tot-final">' + fmtEur(tot.total||0) + '</span></div>';
    h += '<div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost abtn-sm" onclick="c_editar()">Editar (crear borrador)</button>';
    if (c.estado==='propuesta_enviada') h += '<button class="abtn abtn-ghost abtn-sm" onclick="accionArchivo(\'' + c.id + '\',\'renovar\')">Renovar</button>';
    h += '</div></div>';
  }

function accCliente(id, accion, franjaIdx){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const datos = {};
  if (accion==='elegir_franja' && franjaIdx!=null) datos.franja = c.visita.franjasOfrecidas[franjaIdx];
  if (accion==='reprogramar' && franjaIdx!=null) datos.franja = franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14, id)[franjaIdx];
  if (accion==='pedir_cambios') datos.texto = 'Me gustaría revisar algún acabado';
  if (accion==='rechazar') datos.motivo = 'Encontré otra oferta';
  try{ aplicarAccionCliente(c, accion, datos); }catch(e){ toast(e.message,'err'); return; }
  toast('Acción del cliente aplicada');
  renderPaginaActual();
  vistaCliente(id);
}
function accClienteCambio(id, cambioId){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const ch = (c.obra.cambios||[]).find(x=>x.id===cambioId); if(ch){ ch.estado='en_desacuerdo'; (c.eventos).push({fecha:hoy(),tipo:'cliente',texto:'El cliente NO está de acuerdo con el cambio: ' + ch.concepto,autor:'cliente'}); }
  toast('Desacuerdo registrado · avisado el reformista'); renderPaginaActual(); vistaCliente(id);
}

    '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Zona</th><th>Contacto</th><th>Casos</th><th>Estado</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:12px;color:var(--muted)">La ficha de cliente con historial completo llega en la Fase F.</div>';
};

RENDERERS.cobros = function(){
  const conObra = DB.casos.filter(c => ['aceptada','en_obra','en_remates','terminada','cerrada'].includes(c.estado));
  let totalPorCobrar = 0, totalCobrado = 0;
  const rows = conObra.map(c => {
    const eco = estadoEconomico(c, DB.cobros); totalPorCobrar += Math.max(0, eco.saldo); totalCobrado += eco.cobrado;
    const cli = clienteDe(c);
    const badge = eco.estado === 'cobrado' ? 'b-ok' : eco.estado === 'parcial' ? 'b-warn' : 'b-err';
    return '<tr onclick="abrirCaso(\'' + c.id + '\')" style="cursor:pointer"><td><b>' + escH(cli.nombre) + '</b><br><span style="color:var(--muted);font-size:11px">' + c.id + '</span></td><td>' + badgeEstado(c.estado) + '</td><td>' + fmtEur(eco.total) + '</td><td>' + fmtEur(eco.cobrado) + '</td><td><b>' + fmtEur(eco.saldo) + '</b></td><td><span class="badge ' + badge + '">' + eco.estado + '</span></td></tr>';
  }).join('');
  document.getElementById('pg-cobros').innerHTML =
    '<div class="page-hdr"><div><div class="page-title">Cobros</div><div class="page-sub">Seguimiento económico de obras</div></div></div>' +
    '<div class="stat-grid">' + statCard(fmtEur0(totalCobrado),'Cobrado total','Obras en curso y cerradas','up') + statCard(fmtEur0(totalPorCobrar),'Pendiente de cobro', totalPorCobrar>0?'Saldo abierto':'Al día', totalPorCobrar>0?'dn':'up') + '</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Estado</th><th>Total vigente</th><th>Cobrado</th><th>Saldo</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:12px;color:var(--muted)">El plan de cobros detallado y los recibos llegan en la Fase E.</div>';
};

let catFiltroCat = 'todos';
RENDERERS.catalogo = function(){
  let lista = DB.catalogo.slice();
  if (catFiltroCat === 'alertas') lista = lista.filter(p => p.alerta);
  else if (catFiltroCat !== 'todos') lista = lista.filter(p => p.cat === catFiltroCat);
  const cats = [...new Set(DB.catalogo.map(p => p.cat))];
  const chip = (k,l) => '<button class="bandeja-filter" style="' + (catFiltroCat===k?'border-color:var(--accent);color:var(--accent);font-weight:600':'') + '" onclick="catFiltroCat=\'' + k + '\';RENDERERS.catalogo()">' + l + '</button>';
  const rows = lista.map(p => {
    const maxH = Math.max(...p.hist), spark = p.hist.map((v,i) => '<div class="spark-bar" style="display:inline-block;width:5px;margin-right:1px;vertical-align:bottom;background:' + (i===p.hist.length-1 && p.alerta ? 'var(--danger)':'var(--warm)') + ';height:' + Math.round(v/maxH*20) + 'px"></div>').join('');
    return '<tr style="' + (p.alerta?'background:#fffaf4':'') + '"><td><b>' + escH(p.nombre) + '</b><br><span style="color:var(--muted);font-size:11px">' + escH(p.marca) + ' · ' + escH(p.proveedor) + '</span></td>' +
      '<td><span class="badge b-mute">' + escH(p.cat) + '</span></td>' +
      '<td><b>' + p.precio.toFixed(2) + ' €/' + p.unidad + '</b>' + (p.alerta?'<br><span style="font-size:11px;color:var(--danger)">↑ variación</span>':'') + '</td>' +
      '<td>' + spark + '</td>' +
      '<td><span class="badge ' + (p.stock?'b-ok':'b-err') + '">' + (p.stock?'Stock':'Agotado') + '</span></td></tr>';
  }).join('');
  document.getElementById('pg-catalogo').innerHTML =
    '<div class="page-hdr"><div><div class="page-title">Catálogo</div><div class="page-sub">' + DB.catalogo.length + ' productos · precios de referencia</div></div></div>' +
    '<div class="bandeja-tools">' + chip('todos','Todos') + cats.map(c => chip(c, c)).join('') + chip('alertas','⚠ Alertas') + '</div>' +
    '<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Histórico</th><th>Stock</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:12px;color:var(--muted)">La edición de precios, el impacto en presupuestos y la lista de compra llegan en la Fase G.</div>';
};

// ═══════════════════════════════════════════════════════
// SECCIÓN 12B: AGENDA
// ═══════════════════════════════════════════════════════
let agendaTab = 'semana', agendaSemOff = 0, agendaRutaFecha = null;
const DIAS_LBL = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado',0:'Domingo'};
const DIAS_CORTO = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',0:'Dom'};
const ORDEN_DIAS = [1,2,3,4,5,6,0];

function direccionDe(c){ return c.vivienda.direccion || ((clienteDe(c).zona||'Madrid') + ', ' + c.vivienda.cp + ' Madrid'); }
function mapaLink(c){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(direccionDe(c)); }
function visitasConfirmadas(){ return DB.casos.filter(c => c.visita && c.visita.estado==='confirmada' && c.visita.elegida).sort((a,b)=> (a.visita.elegida.fecha+a.visita.elegida.franja).localeCompare(b.visita.elegida.fecha+b.visita.elegida.franja)); }
function visitasPropuestas(){ return DB.casos.filter(c => c.estado==='visita_propuesta' && (c.visita.franjasOfrecidas||[]).length); }

function eventosDelDia(ds){
  const ev = [];
  visitasConfirmadas().forEach(c => { if (c.visita.elegida.fecha===ds) ev.push({ tipo:'visita', hora:c.visita.elegida.franja, caso:c, texto:escH(clienteDe(c).nombre) }); });
  visitasPropuestas().forEach(c => c.visita.franjasOfrecidas.forEach(f => { if (f.fecha===ds) ev.push({ tipo:'prop', hora:f.franja, caso:c, texto:escH(clienteDe(c).nombre) + ' (propuesta)' }); }));
  DB.casos.filter(c => ['en_obra','en_remates'].includes(c.estado)).forEach(c => {
    (c.obra.hitos||[]).filter(h => h.estado!=='hecho' && h.fechaInicioPrevista<=ds && ds<=h.fechaFinPrevista).forEach(h => ev.push({ tipo:'hito', hora:'', caso:c, texto:'🏗 ' + escH(h.nombre) + ' · ' + escH(clienteDe(c).nombre) }));
    if (ds===hoy() && saludObra(c, DB.cfg, hoy())==='bloqueada') ev.push({ tipo:'alerta', hora:'', caso:c, texto:'⛔ Obra bloqueada · ' + escH(clienteDe(c).nombre) });
  });
  return ev.sort((a,b)=> String(a.hora).localeCompare(String(b.hora)));
}

RENDERERS.agenda = function(){
  const nConf = visitasConfirmadas().length, nProp = visitasPropuestas().length;
  const tab = (k,l,n) => '<button class="tab ' + (agendaTab===k?'active':'') + '" onclick="agendaTab=\'' + k + '\';RENDERERS.agenda()">' + l + (n!=null?'<span class="tab-n">' + n + '</span>':'') + '</button>';
  let cuerpo = '';
  if (agendaTab==='semana') cuerpo = agSemana();
  else if (agendaTab==='lista') cuerpo = agLista();
  else if (agendaTab==='ruta') cuerpo = agRuta();
  else cuerpo = agDisponibilidad();
  document.getElementById('pg-agenda').innerHTML =
    '<div class="page-hdr"><div><div class="page-title">Agenda</div><div class="page-sub">' + nConf + ' visita' + (nConf!==1?'s':'') + ' confirmada' + (nConf!==1?'s':'') + ' · ' + nProp + ' pendiente' + (nProp!==1?'s':'') + ' de elegir franja</div></div></div>' +
    '<div class="tabs">' + tab('semana','Semana') + tab('lista','Lista',nConf+nProp) + tab('ruta','Ruta del día') + tab('disp','Disponibilidad') + '</div>' + cuerpo;
};

function agSemana(){
  const dow = diaSemana(hoy());
  const lunes = fechaMasDias(hoy(), -((dow+6)%7) + 7*agendaSemOff);
  let cols = '';
  for (let i=0;i<7;i++){
    const ds = fechaMasDias(lunes, i), d = diaSemana(ds);
    const bq = diaBloqueado(ds, DB.cfg), cerrado = !(DB.cfg.agenda.semana[d]||[]).length;
    const evs = eventosDelDia(ds).map(e => '<div class="ag-ev ' + e.tipo + '" onclick="abrirCaso(\'' + e.caso.id + '\')">' + (e.hora?'<b>' + e.hora.split('-')[0] + '</b> ':'') + e.texto + '</div>').join('');
    cols += '<div class="ag-day ' + (ds===hoy()?'hoy ':'') + (bq?'bloq ':'') + (cerrado&&!bq?'cerrado':'') + '"><div class="ag-day-h"><span>' + DIAS_CORTO[d] + ' ' + ds.slice(8) + '/' + ds.slice(5,7) + '</span>' + (bq?'<span title="' + escH(bq.motivo||'') + '">🚫</span>':'') + '</div>' +
      (bq?'<div style="font-size:11px;color:var(--muted)">' + escH(bq.motivo||'Bloqueado') + '</div>':'') + (evs || (bq||cerrado?'':'<div style="font-size:11px;color:var(--muted)">Libre</div>')) + '</div>';
  }
  return '<div class="ag-nav"><button class="abtn abtn-ghost abtn-sm" onclick="agendaSemOff--;RENDERERS.agenda()">←</button><b style="font-size:13px">Semana del ' + fmtFecha(lunes) + '</b><button class="abtn abtn-ghost abtn-sm" onclick="agendaSemOff++;RENDERERS.agenda()">→</button><button class="abtn abtn-ghost abtn-sm" onclick="agendaSemOff=0;RENDERERS.agenda()">Hoy</button></div>' +
    '<div class="ag-week">' + cols + '</div>' +
    '<div class="ag-leyenda"><span><span class="etiq-chip etiq-warn">■</span> Visita confirmada</span><span>┄ Franja propuesta</span><span><span class="etiq-chip" style="background:#f3e5f5;color:#7b1fa2">■</span> Hito de obra</span><span><span class="etiq-chip etiq-bad">■</span> Bloqueo</span></div>';
}

function cobroVisitaHtml(c){
  const cb = c.visita.cobro || {estado:'no_aplica'};
  const imp = cb.importe != null ? cb.importe : importeVisita(c, DB.cfg);
  if (!DB.cfg.visita.cobra) return '<span class="badge b-mute">sin cobro</span>';
  const badge = cb.estado==='cobrada'?'b-ok':cb.estado==='eximida'?'b-info':'b-warn';
  const lbl = cb.estado==='cobrada'?'cobrada':cb.estado==='eximida'?'eximida':'pendiente';
  const btns = cb.estado==='pendiente' ? ' <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();registrarCobroVisita(\'' + c.id + '\')">Registrar cobro</button> <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();eximirVisitaModal(\'' + c.id + '\')">Eximir</button>' : '';
  return '<span class="badge ' + badge + '">' + fmtEur0(imp) + ' · ' + lbl + '</span>' + btns;
}

function agLista(){
  const filas = [];
  visitasConfirmadas().forEach(c => filas.push({ c, tipo:'conf', fecha:c.visita.elegida.fecha, franja:c.visita.elegida.franja }));
  visitasPropuestas().forEach(c => filas.push({ c, tipo:'prop', fecha:c.visita.franjasOfrecidas[0].fecha, franja:c.visita.franjasOfrecidas.map(f=>fmtFechaCorta(f.fecha)+' '+f.franja.split('-')[0]).join(' · ') }));
  if (!filas.length) return '<div class="section-card" style="text-align:center;color:var(--muted)">No hay visitas en agenda.</div>';
  filas.sort((a,b)=> a.fecha.localeCompare(b.fecha));
  const rows = filas.map(f => {
    const c = f.c, cli = clienteDe(c);
    let rec = '<span style="color:var(--muted);font-size:12px">—</span>', acc = '';
    if (f.tipo==='conf'){
      const d = diasEntre(hoy(), f.fecha);
      if (d>=0 && d<=1){ const msg = fillTpl(PLANTILLAS_MSG.confirmacion_visita, varsDe(c)); rec = '<span class="badge b-warn">24 h</span> <a class="abtn abtn-ghost abtn-sm" href="' + waLink(cli.tel,msg) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">WhatsApp</a>'; }
      acc = '<button class="abtn abtn-primary abtn-sm" onclick="event.stopPropagation();abrirModoVisita(\'' + c.id + '\')">Iniciar visita</button> <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();reprogramarModal(\'' + c.id + '\')">Reprogramar</button> <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();cancelarVisitaModal(\'' + c.id + '\')">Cancelar</button>';
    } else acc = '<span style="font-size:12px;color:var(--muted)">Esperando que el cliente elija</span>';
    return '<tr onclick="abrirCaso(\'' + c.id + '\')" style="cursor:pointer"><td><b>' + (f.tipo==='conf'?fmtFecha(f.fecha) + '<br>' + f.franja:escH(f.franja)) + '</b>' + (f.tipo==='prop'?'<br><span class="badge b-info">propuesta</span>':'') + '</td>' +
      '<td><b>' + escH(cli.nombre) + '</b><br><span style="font-size:11px;color:var(--muted)">' + c.id + '</span></td><td style="font-size:12px">' + escH(direccionDe(c)) + '</td><td onclick="event.stopPropagation()">' + cobroVisitaHtml(c) + '</td><td onclick="event.stopPropagation()">' + rec + '</td><td onclick="event.stopPropagation()">' + acc + '</td></tr>';
  }).join('');
  const pol = DB.cfg.visita.politica;
  return '<div class="table-wrap"><table><thead><tr><th>Cuándo</th><th>Cliente</th><th>Dirección</th><th>Cobro visita</th><th>Recordatorio</th><th>Acciones</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div style="font-size:12px;color:var(--muted)">Política: reprogramar sin coste hasta ' + pol.reprogramarGratisHoras + ' h antes; después, ' + (pol.tardia==='retiene'?'se retiene el cobro y se cobra la nueva visita':'sin cargo adicional') + '.</div>';
}

function agRuta(){
  const ds = agendaRutaFecha || hoy();
  const vis = visitasConfirmadas().filter(c => c.visita.elegida.fecha===ds);
  let h = '<div class="ctrl-row"><span class="ctrl-lbl">Día</span><input type="date" value="' + ds + '" onchange="agendaRutaFecha=this.value;RENDERERS.agenda()" class="disp-inp"><button class="abtn abtn-ghost abtn-sm" onclick="agendaRutaFecha=null;RENDERERS.agenda()">Hoy</button></div>';
  if (!vis.length) return h + '<div class="section-card" style="text-align:center;color:var(--muted)">Sin visitas confirmadas el ' + fmtFecha(ds) + '.</div>';
  vis.forEach((c,i) => {
    const cli = clienteDe(c), el = c.visita.elegida;
    if (i>0){ const prev = vis[i-1].visita.elegida; const hueco = franjaIni(el) - franjaFin(prev); h += '<div class="ruta-tras">🚗 Traslado estimado ' + DB.cfg.visita.trasladoMin + ' min · ' + (hueco>=DB.cfg.visita.trasladoMin?'margen ' + (hueco-DB.cfg.visita.trasladoMin) + ' min':'<b style="color:var(--danger)">no llegas a tiempo</b>') + '</div>'; }
    h += '<div class="ruta-item"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="ruta-hora">' + el.franja.split('-')[0] + '</div><div style="flex:1;min-width:180px"><b>' + escH(cli.nombre) + '</b> · ' + c.id + '<div style="font-size:12px;color:var(--muted)">' + escH(direccionDe(c)) + ' · ' + nombreTipoObra(c.solicitud.tipoObra) + '</div></div>' +
      '<a class="abtn abtn-ghost abtn-sm" href="' + mapaLink(c) + '" target="_blank" rel="noopener">Abrir en el mapa</a>' +
      '<a class="abtn abtn-ghost abtn-sm" href="tel:' + String(cli.tel).replace(/\s/g,'') + '">Llamar</a>' +
      '<button class="abtn abtn-primary abtn-sm" onclick="abrirModoVisita(\'' + c.id + '\')">Iniciar visita</button></div>' +
      '<div style="margin-top:8px;font-size:12px">' + cobroVisitaHtml(c) + '</div></div>';
  });
  return h;
}

function agDisponibilidad(){
  const sem = DB.cfg.agenda.semana, v = DB.cfg.visita;
  const dias = ORDEN_DIAS.map(d => {
    const frs = (sem[d]||[]).map((f,i) => '<div class="disp-fr"><input type="time" value="' + f[0] + '" onchange="dispFranja(' + d + ',' + i + ',0,this.value)"> – <input type="time" value="' + f[1] + '" onchange="dispFranja(' + d + ',' + i + ',1,this.value)"><span style="cursor:pointer;color:var(--danger)" onclick="dispDelFranja(' + d + ',' + i + ')">✕</span></div>').join('');
    return '<div class="disp-dia"><div class="dd-n">' + DIAS_LBL[d] + '</div><div style="flex:1">' + (frs || '<span style="color:var(--muted);font-size:12px">Sin atención</span>') + '<button class="abtn abtn-ghost abtn-sm" style="margin-top:4px" onclick="dispAddFranja(' + d + ')">+ Franja</button></div></div>';
  }).join('');
  const bloqs = (DB.cfg.agenda.bloqueos||[]).map((b,i) => '<div class="disp-fr">🚫 ' + fmtFecha(b.desde) + (b.hasta&&b.hasta!==b.desde?' → ' + fmtFecha(b.hasta):'') + ' · ' + escH(b.motivo||'') + ' <span style="cursor:pointer;color:var(--danger)" onclick="dispDelBloqueo(' + i + ')">✕</span></div>').join('') || '<div style="font-size:12px;color:var(--muted)">Sin bloqueos.</div>';
  const libres = franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14);
  const porDia = {}; libres.forEach(f => porDia[f.fecha] = (porDia[f.fecha]||0)+1);
  const prev = Object.keys(porDia).slice(0,10).map(ds => '<span class="etiq-chip etiq-info">' + DIAS_CORTO[diaSemana(ds)] + ' ' + ds.slice(8) + ': ' + porDia[ds] + '</span>').join('');
  return '<div class="section-card"><div class="section-card-title">Disponibilidad semanal (fuente de las franjas ofrecidas)</div>' + dias + '</div>' +
    '<div class="section-card"><div class="section-card-title">Bloqueos (vacaciones, festivos)</div>' + bloqs +
      '<div class="disp-fr" style="margin-top:8px"><input id="bq-desde" type="date" class="disp-inp"> → <input id="bq-hasta" type="date" class="disp-inp"> <input id="bq-motivo" class="disp-inp" placeholder="Motivo" style="flex:1"><button class="abtn abtn-primary abtn-sm" onclick="dispAddBloqueo()">Añadir</button></div></div>' +
    '<div class="section-card"><div class="section-card-title">Visita y política</div>' +
      '<div class="inl-field"><label>Duración de la visita (min)</label><input type="number" min="15" step="15" value="' + v.duracionMin + '" onchange="dispVisita(\'duracionMin\',this.value)"></div>' +
      '<div class="inl-field"><label>Margen de traslado (min)</label><input type="number" min="0" step="5" value="' + v.trasladoMin + '" onchange="dispVisita(\'trasladoMin\',this.value)"></div>' +
      '<div class="inl-field"><label>Reprogramar gratis hasta (h antes)</label><input type="number" min="0" value="' + v.politica.reprogramarGratisHoras + '" onchange="dispVisita(\'reprogramarGratisHoras\',this.value)"></div>' +
      '<div class="inl-field"><label>Reprogramación tardía</label><select onchange="dispVisita(\'tardia\',this.value)"><option value="retiene"' + (v.politica.tardia==='retiene'?' selected':'') + '>Retener cobro y cobrar de nuevo</option><option value="sin_cargo"' + (v.politica.tardia==='sin_cargo'?' selected':'') + '>Sin cargo adicional</option></select></div></div>' +
    '<div class="section-card"><div class="section-card-title">Franjas libres · próximos 14 días (' + libres.length + ')</div>' + (prev || '<span style="color:var(--muted);font-size:12px">Sin huecos: revisa la disponibilidad.</span>') + '</div>';
}
function dispFranja(d,i,w,val){ const f = DB.cfg.agenda.semana[d][i]; const nf = f.slice(); nf[w]=val; if (minDeHora(nf[1]) <= minDeHora(nf[0])){ toast('La hora de fin debe ser posterior al inicio','err'); } else f[w]=val; RENDERERS.agenda(); }
function dispAddFranja(d){ DB.cfg.agenda.semana[d] = DB.cfg.agenda.semana[d]||[]; DB.cfg.agenda.semana[d].push(['09:00','13:00']); RENDERERS.agenda(); }

function dispAddBloqueo(){ const d=document.getElementById('bq-desde').value, h=document.getElementById('bq-hasta').value||d, m=document.getElementById('bq-motivo').value; if(!d){ toast('Indica la fecha de inicio','err'); return; } if(h<d){ toast('La fecha final es anterior','err'); return; } DB.cfg.agenda.bloqueos.push({desde:d,hasta:h,motivo:m||'Bloqueo'}); RENDERERS.agenda(); }
function dispDelBloqueo(i){ DB.cfg.agenda.bloqueos.splice(i,1); RENDERERS.agenda(); }

function eximirVisita(id){

let _repro = { id:null, libres:[], sel:null };
function reprogramarModal(id){
  const c = DB.casos.find(x=>x.id===id); if(!c || !c.visita.elegida) return;
  _repro = { id, libres: franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14, id).slice(0,12), sel:null };
  renderRepro();
}
function renderRepro(){
  const c = DB.casos.find(x=>x.id===_repro.id); const pol = politicaReprogramar(c, DB.cfg, _hoyDate());
  const opts = _repro.libres.map((f,i)=>'<div class="franja-opt ' + (_repro.sel===i?'sel':'') + '" onclick="_repro.sel=' + i + ';renderRepro()">' + fmtFecha(f.fecha) + ' · ' + f.franja + '</div>').join('');
  openModal('<div class="modal-title">Reprogramar visita · ' + escH(clienteDe(c).nombre) + '</div>' +
    '<p style="font-size:13px;margin-bottom:6px">Actual: <b>' + fmtFecha(c.visita.elegida.fecha) + ' · ' + c.visita.elegida.franja + '</b> (en ' + pol.horas + ' h)</p>' +
    '<div class="porque" style="margin-bottom:12px"><b>' + (pol.gratis?'✓ Reprogramación gratuita':'⚠ Reprogramación tardía') + '</b> (límite ' + pol.limite + ' h)<br>' + escH(pol.efecto) + '</div>' + opts +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="closeAllModals()">Cancelar</button><button class="abtn abtn-primary" ' + (_repro.sel==null?'disabled style="opacity:.5"':'') + ' onclick="confirmarRepro()">Reprogramar</button></div>');
}
function confirmarRepro(){ const c = DB.casos.find(x=>x.id===_repro.id); if(!c||_repro.sel==null) return; reprogramarVisita(c, _repro.libres[_repro.sel], 'reformista'); closeAllModals(); toast('Visita reprogramada'); refrescar(); }
function reprogramarVisita(c, franja, autor){
  const pol = politicaReprogramar(c, DB.cfg, _hoyDate()); const prev = c.visita.elegida;
  c.visita.elegida = franja; c.visita.estado = 'confirmada'; c.visita.confirmadaCliente = false;
  let extra = '';
  if (pol && !pol.gratis && pol.tardia==='retiene' && c.visita.cobro && c.visita.cobro.estado==='cobrada'){ c.visita.cobro.estado = 'pendiente'; extra = ' · tardía: se retiene el cobro anterior y la nueva visita queda pendiente de cobro'; }
  (c.eventos = c.eventos||[]).push({ fecha:hoy(), tipo:'visita', texto:'Visita reprogramada de ' + (prev?fmtFechaCorta(prev.fecha) + ' ' + prev.franja:'—') + ' a ' + fmtFechaCorta(franja.fecha) + ' ' + franja.franja + extra, autor:autor||'reformista' });
  return pol;
}
function cancelarVisitaModal(id){
  const c = DB.casos.find(x=>x.id===id); if(!c || !c.visita.elegida) return; const pol = politicaReprogramar(c, DB.cfg, _hoyDate());
  openModal('<div class="modal-title">Cancelar visita · ' + escH(clienteDe(c).nombre) + '</div><p style="font-size:13px;margin-bottom:8px">' + fmtFecha(c.visita.elegida.fecha) + ' · ' + c.visita.elegida.franja + '</p>' +
    '<div class="porque"><b>' + (pol.gratis?'✓ Cancelación sin coste':'⚠ Cancelación tardía') + '</b><br>' + (pol.pagada ? (pol.gratis?'Se reembolsará el cobro de la visita.':'Se retiene el cobro de la visita.') : 'No hay cobro de visita registrado.') + '</div>' +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="closeAllModals()">Volver</button><button class="abtn abtn-primary" onclick="cancelarVisita(\'' + id + '\')">Cancelar visita</button></div>');
}
function cancelarVisita(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return; const pol = politicaReprogramar(c, DB.cfg, _hoyDate()); const prev = c.visita.elegida;
  let extra = '';
  if (pol && pol.pagada && pol.gratis){ DB.cobros.filter(m=>m.casoId===c.id && m.tipo==='visita' && m.estado==='cobrado').forEach(m=>m.estado='anulado'); c.visita.cobro.estado='pendiente'; extra = ' · cobro reembolsado'; }
  else if (pol && pol.pagada) extra = ' · cancelación tardía: se retiene el cobro';
  c.visita.estado = 'cancelada'; c.visita.elegida = null;
  if (c.estado==='visita_confirmada' && puedeTransitar(c,'visita_propuesta')) transitar(c,'visita_propuesta',{autor:'reformista',texto:'Visita cancelada; se vuelve a proponer'});
  c.eventos.push({ fecha:hoy(), tipo:'visita', texto:'Visita cancelada (' + fmtFechaCorta(prev.fecha) + ' ' + prev.franja + ')' + extra, autor:'reformista' });
  closeAllModals(); toast('Visita cancelada'); refrescar();
}

const MV = { id:null, i:0, cards:[], grab:false, fotoEsp:null, fotoEti:'General', notaEsp:null, savedT:null };
const MV_GRUPOS = ['Resumen','Checklist','Medidas','Fotos','Notas','Datos fiscales','Presupuesto','Cerrar visita'];
function mvCaso(){ return DB.casos.find(c => c.id === MV.id); }
function recalcularYGuardar(c){
  asegurarBorrador(c);
  const res = recalcularBorrador(c, DB.cfg);
  c.borrador.lineas = res.lineas; c.borrador.avisos = res.avisos;
  return res;
}
function mvCards(c){
  const cards = [{ t:'resumen', g:'Resumen' }];
  generarChecklist(c).forEach(it => cards.push({ t:'check', g:'Checklist', item:it }));
  cards.push({ t:'medidas', g:'Medidas' }, { t:'fotos', g:'Fotos' }, { t:'notas', g:'Notas' }, { t:'fiscal', g:'Datos fiscales' }, { t:'presupuesto', g:'Presupuesto' }, { t:'cerrar', g:'Cerrar visita' });
  return cards;
}
function abrirModoVisita(id){
  const c = DB.casos.find(x => x.id === id); if (!c) return;
  if (c.estado === 'visita_confirmada' && puedeTransitar(c, 'en_visita')) transitar(c, 'en_visita', { autor:'reformista', texto:'Visita iniciada (Modo visita)' });
  c.visita = Object.assign({ checks:{}, medidas:{}, fotos:[], notas:[] }, c.visita);
  recalcularYGuardar(c);
  MV.id = id; MV.i = 0; MV.cards = mvCards(c); MV.grab = false; MV.fotoEsp = (c.solicitud.espacios[0]||{}).id || null; MV.notaEsp = MV.fotoEsp;
  closeAllModals();
  document.getElementById('demo-panel').style.display = 'none';
  document.getElementById('mv-root').style.display = 'flex';
  renderMV();
}
function cerrarModoVisita(){
  document.getElementById('mv-root').style.display = 'none'; document.getElementById('mv-root').innerHTML = '';
  document.getElementById('demo-panel').style.display = '';
  MV.id = null; renderPaginaActual();
}
function mvGuardado(){
  const el = document.getElementById('mv-saved'); if (!el) return;
  el.textContent = 'Guardado ✓'; el.style.opacity = 1; clearTimeout(MV.savedT); MV.savedT = setTimeout(() => { const e2 = document.getElementById('mv-saved'); if (e2) e2.style.opacity = .35; }, 1400);
}
function mvTotal(){
  const c = mvCaso(); if (!c) return; const tot = totalesBorrador(c);
  const el = document.getElementById('mv-total'); if (el) el.textContent = fmtEur(tot.total);
  const sub = document.getElementById('mv-sub'); if (sub) sub.textContent = 'Subtotal ' + fmtEur(tot.subtotal) + ' · IVA ' + (c.borrador.ivaPct) + '%';
  mvGuardado();
}
function mvAvisosHtml(item){
  const c = mvCaso(); const av = (c.borrador.avisos||[]).filter(a => !item || a.checkId === item.id);
  return av.map(a => '<div class="mv-aviso">⚠ ' + escH(a.texto) + '</div>').join('');
}
function mvIr(d){ MV.i = clamp(MV.i + d, 0, MV.cards.length - 1); renderMV(); document.querySelector('.mv-body')?.scrollTo(0,0); }
function mvIrGrupo(g){ const k = MV.cards.findIndex(x => x.g === g); if (k >= 0){ MV.i = k; renderMV(); } }

function renderMV(){
  const c = mvCaso(); if (!c) return; const cli = clienteDe(c); const card = MV.cards[MV.i];
  const paso = MV_GRUPOS.indexOf(card.g) + 1; const pct = Math.round((MV.i + 1) / MV.cards.length * 100);
  let cuerpo = '';
  if (card.t === 'resumen') cuerpo = mvResumen(c);
  else if (card.t === 'check') cuerpo = mvCheck(c, card.item);
  else if (card.t === 'medidas') cuerpo = mvMedidas(c);
  else if (card.t === 'fotos') cuerpo = mvFotos(c);
  else if (card.t === 'notas') cuerpo = mvNotas(c);
  else if (card.t === 'fiscal') cuerpo = mvFiscal(c);
  else if (card.t === 'presupuesto') cuerpo = mvPresupuesto(c);
  else if (card.t === 'cerrar') cuerpo = mvCerrar(c);
  const tot = totalesBorrador(c);
  document.getElementById('mv-root').innerHTML =
    '<div class="mv-head"><button class="mv-back" onclick="cerrarModoVisita()">← Volver</button><div class="mv-head-t"><b>' + escH(cli.nombre) + '</b><span>' + escH(direccionDe(c)) + '</span></div><span style="font-size:12px;color:var(--warm)">' + c.id + '</span></div>' +
    '<div class="mv-prog"><div style="width:' + pct + '%"></div></div>' +
    '<div class="mv-body"><div class="mv-step">Paso ' + paso + ' de ' + MV_GRUPOS.length + ' · ' + card.g + (card.t==='check'?' · pregunta ' + (MV.cards.filter(x=>x.t==='check').indexOf(card)+1) + '/' + MV.cards.filter(x=>x.t==='check').length:'') + '</div>' + cuerpo +
      (card.t==='cerrar' ? '' : '<div class="mv-nav"><button onclick="mvIr(-1)" ' + (MV.i===0?'disabled style="opacity:.4"':'') + '>← Anterior</button><button class="pri" onclick="mvIr(1)">Siguiente →</button></div>') + '</div>' +
    '<div class="mv-foot"><div class="mv-foot-tot"><small>Total en vivo (IVA incl.)</small><b id="mv-total">' + fmtEur(tot.total) + '</b> <span id="mv-sub" style="font-size:11px;color:var(--warm)">Subtotal ' + fmtEur(tot.subtotal) + ' · IVA ' + c.borrador.ivaPct + '%</span></div><span class="mv-saved" id="mv-saved" style="opacity:.35">Guardado ✓</span><button class="mv-cerrar" onclick="mvIrGrupo(\'Cerrar visita\')">Cerrar visita</button></div>';
}

function mvResumen(c){
  const v = versionVigente(c); const sc = scoreCalidad(c, DB.cfg);
  const tot = v && v.totales || {};
  let h = '<div class="mv-q">' + escH(nombreTipoObra(c.solicitud.tipoObra)) + '</div><div class="mv-ayuda">' + c.vivienda.m2 + ' m² · ' + escH(c.vivienda.tipo) + ' · ' + (c.vivienda.antiguedad||'') + '</div>';
  h += '<div class="section-card"><div class="section-card-title">Versión vigente ' + (v?v.id:'') + '</div><div style="font-family:\'Cormorant Garamond\',serif;font-size:26px">' + (tot.lo ? fmtEur0(tot.lo) + ' – ' + fmtEur0(tot.hi) : fmtEur(tot.total||0)) + '</div></div>';
  if (c.vivienda.humedades) h += '<div class="mv-aviso">⚠ El cliente declara humedades: revisa paredes y techos con foto.</div>';
  if (c.vivienda.comunidad === 'pendiente') h += '<div class="mv-aviso">⚠ Autorización de la comunidad pendiente.</div>';
  if (c.vivienda.topePresupuesto) h += '<div class="section-card">Tope de presupuesto del cliente: <b>' + fmtEur0(c.vivienda.topePresupuesto) + '</b></div>';
  if (c.solicitud.notasCliente) h += '<div class="section-card" style="font-style:italic">“' + escH(c.solicitud.notasCliente) + '”</div>';
  h += '<div class="section-card"><div class="section-card-title">Espacios</div>' + (c.solicitud.espacios||[]).map(e => '<span class="etiq-chip etiq-info">' + escH(e.nombre||e.tipo) + ' · ' + e.m2 + ' m²</span>').join('') + '<div style="font-size:12px;color:var(--muted);margin-top:8px">' + ((c.solicitud.fotosCliente||[]).length) + ' fotos del cliente · calidad del caso ' + sc.total + '/100</div></div>';
  return h;
}

function mvCheck(c, it){
  const ck = (c.visita.checks[it.id]) || {}; const val = ck.valor;
  let h = '<div class="mv-q">' + escH(it.label) + '</div>' + (it.espacioNombre ? '<div class="mv-ayuda"><b>' + escH(it.espacioNombre) + '</b>' + (it.ayuda?' · ' + escH(it.ayuda):'') + '</div>' : (it.ayuda ? '<div class="mv-ayuda">' + escH(it.ayuda) + '</div>' : '<div class="mv-ayuda"></div>'));
  if (it.tipo === 'si_no'){
    h += '<div class="mv-opts"><button class="mv-opt ' + (val===true?'sel':'') + '" onclick="mvResp(true)">Sí</button><button class="mv-opt ' + (val===false?'sel':'') + '" onclick="mvResp(false)">No</button></div>';
  } else if (it.tipo === 'opcion'){
    h += '<div class="mv-opts">' + it.opciones.map(o => '<button class="mv-opt ' + (val===o?'sel':'') + '" onclick="mvResp(\'' + o + '\')">' + o.charAt(0).toUpperCase() + o.slice(1) + '</button>').join('') + '</div>';
  } else if (it.tipo === 'numero'){
    h += '<input class="mv-big" type="number" inputmode="decimal" step="0.01" id="mv-num" value="' + (val != null ? val : '') + '" placeholder="0" oninput="mvRespTxt(this.value)">';
  } else if (it.tipo === 'texto'){
    h += '<input class="mv-big" type="text" id="mv-txt" value="' + escH(val||'') + '" oninput="mvRespTxt(this.value)">';
  } else if (it.tipo === 'foto'){
    const n = (c.visita.fotos||[]).filter(f => f.checkId === it.id).length;
    h += '<div class="mv-opts"><button class="mv-opt" onclick="mvAddFoto(\'' + it.id + '\',\'' + (it.espacioId||'') + '\')">📷 Hacer foto (' + n + ')</button></div>';
    h += '<div class="mv-thumbs">' + (c.visita.fotos||[]).filter(f => f.checkId === it.id).map(f => mvThumb(f)).join('') + '</div>';
  }
  if (it.tipo !== 'foto' && it.tplId === 'humedades') h += '<div class="mv-opts"><button class="mv-opt" onclick="mvAddFoto(\'' + it.id + '\',\'' + (it.espacioId||'') + '\')">📷 Añadir foto de la humedad (' + (c.visita.fotos||[]).filter(f => f.checkId === it.id).length + ')</button></div>';
  h += '<div id="mv-avisos">' + mvAvisosHtml(it) + '</div>';
  return h;
}
function mvResp(valor){
  const c = mvCaso(); const it = MV.cards[MV.i].item;
  c.visita.checks[it.id] = Object.assign({}, c.visita.checks[it.id], { valor, efectoAplicado:true });
  recalcularYGuardar(c); renderMV(); mvGuardado();
}
function mvRespTxt(valor){
  const c = mvCaso(); const it = MV.cards[MV.i].item;
  c.visita.checks[it.id] = Object.assign({}, c.visita.checks[it.id], { valor: valor === '' ? null : (it.tipo==='numero' ? valor : valor), efectoAplicado:true });
  recalcularYGuardar(c);
  const av = document.getElementById('mv-avisos'); if (av) av.innerHTML = mvAvisosHtml(it);
  mvTotal();
}
function mvThumb(f){ return '<div class="mv-thumb">' + escH(f.etiqueta||'Foto') + (f.espacioNombre?' · ' + escH(f.espacioNombre):'') + '<span class="x" onclick="mvDelFoto(\'' + f.id + '\')">✕</span></div>'; }
function mvAddFoto(checkId, espId, etiqueta){
  const c = mvCaso(); const esp = (c.solicitud.espacios||[]).find(e => e.id === (espId || MV.fotoEsp));
  c.visita.fotos.push({ id:uid('foto'), url:'foto-simulada.jpg', espacioId:esp?esp.id:null, espacioNombre:esp?(esp.nombre||esp.tipo):'', etiqueta:etiqueta||MV.fotoEti||'General', checkId:checkId||null, fecha:hoy() });
  renderMV(); mvGuardado();
}
function mvDelFoto(id){ const c = mvCaso(); c.visita.fotos = c.visita.fotos.filter(f => f.id !== id); renderMV(); mvGuardado(); }

function mvMedidas(c){
  const espacios = c.solicitud.espacios || [];
  let h = '<div class="mv-q">Medidas por espacio</div><div class="mv-ayuda">Introduce largo, ancho y alto, y pulsa «Aplicar a las líneas» para actualizar cantidades (las líneas bloqueadas no cambian).</div>';
  espacios.forEach(e => {
    const m = c.visita.medidas[e.id] || { largo:'', ancho:'', alto:'', huecos:[], aplicada:false };
    const med = calcularMedidas(m);
    h += '<div class="mv-med"><b>' + escH(e.nombre||e.tipo) + '</b> <span style="font-size:12px;color:var(--muted)">(estimado ' + e.m2 + ' m²)</span>' +
      '<div class="mv-med-grid" style="margin-top:8px">' + ['largo','ancho','alto'].map(k => '<div><label>' + k.charAt(0).toUpperCase() + k.slice(1) + ' (m)</label><input type="number" inputmode="decimal" step="0.01" value="' + (m[k]||'') + '" oninput="mvMed(\'' + e.id + '\',\'' + k + '\',this.value)"></div>').join('') + '</div>' +
      (m.huecos||[]).map((hu,i) => '<div class="mv-hueco"><input type="number" inputmode="decimal" step="0.01" placeholder="Ancho" value="' + (hu.ancho||'') + '" oninput="mvHueco(\'' + e.id + '\',' + i + ',\'ancho\',this.value)"><input type="number" inputmode="decimal" step="0.01" placeholder="Alto" value="' + (hu.alto||'') + '" oninput="mvHueco(\'' + e.id + '\',' + i + ',\'alto\',this.value)"><select onchange="mvHueco(\'' + e.id + '\',' + i + ',\'tipo\',this.value)"><option value="puerta"' + (hu.tipo==='puerta'?' selected':'') + '>Puerta</option><option value="ventana"' + (hu.tipo==='ventana'?' selected':'') + '>Ventana</option></select><span style="cursor:pointer;color:var(--danger)" onclick="mvDelHueco(\'' + e.id + '\',' + i + ')">✕</span></div>').join('') +
      '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="abtn abtn-ghost abtn-sm" onclick="mvAddHueco(\'' + e.id + '\')">+ Puerta/ventana</button><button class="abtn abtn-primary abtn-sm" onclick="mvAplicarMedidas(\'' + e.id + '\')">Aplicar a las líneas</button>' + (m.aplicada?'<span class="badge b-ok">aplicado</span>':'') + '</div>' +
      '<div class="mv-res" id="mv-res-' + e.id + '">' + mvResMed(med) + '</div></div>';
  });
  return h;
}
function mvResMed(med){ return 'Suelo/techo ' + med.m2_suelo + ' m² · Paredes ' + med.m2_pared + ' m² · Rodapié ' + med.ml_rodapie + ' ml'; }
function mvMedObj(c, eid){ return c.visita.medidas[eid] = c.visita.medidas[eid] || { largo:0, ancho:0, alto:0, huecos:[], aplicada:false }; }
function mvMed(eid, k, val){ const c = mvCaso(); const m = mvMedObj(c, eid); m[k] = Number(val)||0; m.aplicada = false; const el = document.getElementById('mv-res-' + eid); if (el) el.textContent = mvResMed(calcularMedidas(m)); mvGuardado(); }
function mvHueco(eid, i, k, val){ const c = mvCaso(); const hu = mvMedObj(c, eid).huecos[i]; hu[k] = k==='tipo' ? val : (Number(val)||0); mvMedObj(c, eid).aplicada = false; const el = document.getElementById('mv-res-' + eid); if (el) el.textContent = mvResMed(calcularMedidas(mvMedObj(c, eid))); mvGuardado(); }
function mvAddHueco(eid){ const c = mvCaso(); mvMedObj(c, eid).huecos.push({ ancho:0.9, alto:2.1, tipo:'puerta' }); renderMV(); }
function mvDelHueco(eid, i){ const c = mvCaso(); mvMedObj(c, eid).huecos.splice(i,1); renderMV(); }
function mvAplicarMedidas(eid){
  const c = mvCaso(); const m = mvMedObj(c, eid); if (!(m.largo > 0 && m.ancho > 0 && m.alto > 0)){ toast('Introduce largo, ancho y alto', 'err'); return; }
  m.aplicada = true; recalcularYGuardar(c); toast('Medidas aplicadas a las líneas'); renderMV(); mvGuardado();
}

function mvFotos(c){
  const espacios = c.solicitud.espacios || []; const etis = ['General','Detalle','Humedad','Instalación','Antes'];
  let h = '<div class="mv-q">Fotos de la visita</div><div class="mv-ayuda">Elige estancia y etiqueta; cada foto queda vinculada.</div><div>' +
    espacios.map(e => '<span class="mv-chip ' + (MV.fotoEsp===e.id?'sel':'') + '" onclick="MV.fotoEsp=\'' + e.id + '\';renderMV()">' + escH(e.nombre||e.tipo) + '</span>').join('') + '</div><div>' +
    etis.map(t => '<span class="mv-chip ' + (MV.fotoEti===t?'sel':'') + '" onclick="MV.fotoEti=\'' + t + '\';renderMV()">' + t + '</span>').join('') + '</div>' +
    '<div class="mv-opts"><button class="mv-opt" onclick="mvAddFoto(null,null)">📷 Hacer foto</button></div>';
  h += '<div class="mv-thumbs">' + (c.visita.fotos||[]).map(f => mvThumb(f)).join('') + '</div>' + ((c.visita.fotos||[]).length ? '' : '<div class="mv-ayuda">Aún no hay fotos.</div>');
  return h;
}

function mvNotas(c){
  const espacios = c.solicitud.espacios || [];
  let h = '<div class="mv-q">Notas de la visita</div><div class="mv-ayuda">Texto o nota de voz, por estancia.</div><div>' +
    espacios.map(e => '<span class="mv-chip ' + (MV.notaEsp===e.id?'sel':'') + '" onclick="MV.notaEsp=\'' + e.id + '\';renderMV()">' + escH(e.nombre||e.tipo) + '</span>').join('') + '</div>';
  h += '<textarea id="mv-nota-txt" class="mv-big" style="font-size:16px;min-height:90px;margin-top:8px" placeholder="Escribe una nota…"></textarea>';
  h += '<div class="mv-opts"><button class="mv-opt" onclick="mvGuardarNota()">Guardar nota</button>' +
    (MV.grab ? '<div class="mv-rec"><i></i> Grabando nota de voz…</div><button class="mv-opt sel" onclick="mvParar()">⏹ Parar y guardar</button>' : '<button class="mv-opt" onclick="MV.grab=true;renderMV()">🎙 Grabar nota de voz</button>') + '</div>';
  h += (c.visita.notas||[]).map(n => '<div class="mv-nota"><div style="font-size:11px;color:var(--muted)">' + escH(n.espacioNombre||'General') + ' · ' + fmtFecha(n.fecha) + (n.audioUrl?' · 🎙 ' + n.segundos + ' s':'') + ' <span style="float:right;cursor:pointer;color:var(--danger)" onclick="mvDelNota(\'' + n.id + '\')">✕</span></div>' + (n.audioUrl ? '<button class="abtn abtn-ghost abtn-sm" style="margin:4px 0" onclick="toast(\'Reproduciendo nota (simulado)\')">▶ Reproducir</button><div><i>' + escH(n.transcripcion) + '</i></div>' : escH(n.texto)) + '</div>').join('');
  return h;
}
function mvEspNom(c){ const e = (c.solicitud.espacios||[]).find(x => x.id === MV.notaEsp); return e ? (e.nombre||e.tipo) : ''; }
function mvGuardarNota(){
  const c = mvCaso(); const t = (document.getElementById('mv-nota-txt')||{}).value||''; if (!t.trim()){ toast('Escribe algo primero','err'); return; }
  c.visita.notas.push({ id:uid('nota'), texto:t.trim(), audioUrl:null, transcripcion:null, espacioId:MV.notaEsp, espacioNombre:mvEspNom(c), fecha:hoy() }); renderMV(); mvGuardado();
}
function mvParar(){
  const c = mvCaso(); MV.grab = false;
  const frases = ['Revisar la bajante antes de alicatar.','El cliente quiere cambiar la ventana, valorar aparte.','Pared del fondo con desnivel, posible maestra.'];
  c.visita.notas.push({ id:uid('nota'), texto:'', audioUrl:'nota-simulada.webm', transcripcion:'[Transcripción simulada] ' + frases[(c.visita.notas.length)%frases.length], segundos:6 + (c.visita.notas.length*3)%20, espacioId:MV.notaEsp, espacioNombre:mvEspNom(c), fecha:hoy() });
  renderMV(); mvGuardado();
}
function mvDelNota(id){ const c = mvCaso(); c.visita.notas = c.visita.notas.filter(n => n.id !== id); renderMV(); }

function mvFiscal(c){
  c.fiscal = c.fiscal || { nombre:'', nif:'', direccion:'' };
  const f = (k,l,ph) => '<div style="margin-bottom:12px"><label style="font-size:12px;color:var(--muted)">' + l + '</label><input class="mv-big" style="font-size:18px" value="' + escH(c.fiscal[k]||'') + '" placeholder="' + ph + '" oninput="mvFis(\'' + k + '\',this.value)"></div>';
  return '<div class="mv-q">Datos fiscales</div><div class="mv-ayuda">Alimentan la factura futura.</div>' + f('nombre','Nombre o razón social',clienteDe(c).nombre) + f('nif','NIF / NIE','12345678Z') + f('direccion','Dirección fiscal',direccionDe(c));
}
function mvFis(k, val){ const c = mvCaso(); c.fiscal = c.fiscal || { nombre:'', nif:'', direccion:'' }; c.fiscal[k] = val; mvGuardado(); }

function mvPresupuesto(c){
  const b = c.borrador;
  let h = '<div class="mv-q">Presupuesto</div><div class="mv-ayuda">Edita cantidad o precio y la línea se bloquea (no se pisa al recalcular).</div>';
  const espNombre = eid => { const e = (c.solicitud.espacios||[]).find(x => x.id === eid); return e ? (e.nombre||e.tipo) : 'General'; };
  const grupos = {}; b.lineas.forEach(l => (grupos[espNombre(l.espacioId)] = grupos[espNombre(l.espacioId)] || []).push(l));
  let rows = '';
  Object.entries(grupos).forEach(([g, ls]) => {
    rows += '<tr><td colspan="5" class="lin-grupo-td">' + escH(g) + '</td></tr>';
    rows += ls.map(l => '<tr><td><input value="' + escH(l.concepto) + '" oninput="mvLin(\'' + l.id + '\',\'concepto\',this.value)"><span class="lin-origen" id="mv-ori-' + l.id + '">' + (l.origen||'calculo') + '</span></td>' +
      '<td style="width:64px"><input class="num" type="number" inputmode="decimal" step="0.01" value="' + l.cantidad + '" oninput="mvLin(\'' + l.id + '\',\'cantidad\',this.value)"></td>' +
      '<td style="width:70px"><input class="num" type="number" inputmode="decimal" step="0.01" value="' + l.precio + '" oninput="mvLin(\'' + l.id + '\',\'precio\',this.value)"></td>' +
      '<td style="width:70px;text-align:right" id="mv-sub-' + l.id + '">' + fmtEur0(l.subtotal) + '</td>' +
      '<td style="width:54px;text-align:right"><span class="lin-cand ' + (l.bloqueada?'on':'') + '" id="mv-lock-' + l.id + '" onclick="mvCandado(\'' + l.id + '\')">' + (l.bloqueada?'🔒':'🔓') + '</span> <span style="cursor:pointer;color:var(--danger)" onclick="mvDelLinea(\'' + l.id + '\')">✕</span></td></tr>').join('');
  });
  h += '<table class="lineas-tbl"><thead><tr><th>Concepto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
  h += '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center"><button class="abtn abtn-ghost abtn-sm" onclick="mvAddLinea()">+ Añadir línea</button><label style="font-size:13px">IVA <select onchange="mvIva(this.value)">' + [21,10,0].map(i => '<option value="' + i + '"' + (b.ivaPct===i?' selected':'') + '>' + i + '%</option>').join('') + '</select></label><span style="font-size:11px;color:var(--amber)">Confirmar el criterio con el gestor</span></div>';
  return h;
}
function mvLinea(lid){ return mvCaso().borrador.lineas.find(l => l.id === lid); }
function mvLin(lid, campo, val){
  const l = mvLinea(lid); if (!l) return;
  if (campo === 'cantidad' || campo === 'precio'){ l[campo] = r(Number(val)||0); l.subtotal = r(l.cantidad * l.precio); delete l.precioBase; } else l[campo] = val;
  l.bloqueada = true; l.origen = 'manual';
  const s = document.getElementById('mv-sub-' + lid); if (s) s.textContent = fmtEur0(l.subtotal);
  const k = document.getElementById('mv-lock-' + lid); if (k){ k.textContent = '🔒'; k.classList.add('on'); }
  const o = document.getElementById('mv-ori-' + lid); if (o) o.textContent = 'manual';
  mvTotal();
}
function mvCandado(lid){ const l = mvLinea(lid); l.bloqueada = !l.bloqueada; renderMV(); mvGuardado(); }
function mvDelLinea(lid){ const c = mvCaso(); c.borrador.lineas = c.borrador.lineas.filter(l => l.id !== lid); renderMV(); mvGuardado(); }
function mvAddLinea(){ const c = mvCaso(); const e = (c.solicitud.espacios||[])[0]; c.borrador.lineas.push({ id:uid('L'), key:'manual', concepto:'Nueva partida', espacioId:e?e.id:null, unidad:'ud', base:'fijo', cantidad:1, precio:0, subtotal:0, tipo:'extra', origen:'manual', bloqueada:true }); renderMV(); mvGuardado(); }
function mvIva(v){ const c = mvCaso(); c.borrador.ivaPct = Number(v); mvTotal(); }

function borradorComoVersion(c, tipo){
  const b = asegurarBorrador(c); const tot = totalesBorrador(c); const inc = calcularIncertidumbre(c); const hq = calcularHorquilla(tot.total, inc.nivel); tot.lo = hq.lo; tot.hi = hq.hi;
  return { id:siguienteVersionId(c), tipo:tipo||'tras_visita', creadaAt:hoy(), enviadaAt:null, ivaPct:b.ivaPct, lineas:b.lineas, totales:tot, cambiosRespectoAnterior:null, estado:'borrador' };
}
function mvCerrar(c){
  const vig = versionVigente(c); const tmp = borradorComoVersion(c); const d = diffVersiones(vig, tmp);
  const delta = r(tmp.totales.total - (vig.totales.total||0)); const sig = siguienteVersionId(c);
  const n = (c.visita.fotos||[]).length, nn = (c.visita.notas||[]).length, nc = Object.keys(c.visita.checks||{}).length;
  const lista = d.anyadidas.map(l => '<div class="diff-row diff-add">+ ' + escH(l.concepto) + ' (' + fmtEur0(l.subtotal) + ')</div>').join('') + d.quitadas.map(l => '<div class="diff-row diff-del">− ' + escH(l.concepto) + '</div>').join('') + d.cambiadas.map(x => '<div class="diff-row diff-chg">~ ' + escH(x.a.concepto) + ': ' + fmtEur0(x.de.subtotal) + ' → ' + fmtEur0(x.a.subtotal) + '</div>').join('');
  return '<div class="mv-q">Cerrar visita</div><div class="mv-ayuda">Resumen frente a ' + vig.id + ' · nueva versión: ' + sig + '</div>' +
    '<div class="section-card"><div class="section-card-title">Cambios</div><div style="font-size:14px;margin-bottom:8px">' + vig.id + ': <b>' + fmtEur(vig.totales.total) + '</b> → ' + sig + ': <b>' + fmtEur(tmp.totales.total) + '</b> <span style="color:' + (delta>0?'var(--danger)':'var(--ok)') + '">(' + (delta>=0?'+':'') + fmtEur(delta) + ')</span></div>' + (lista || '<div style="font-size:12px;color:var(--muted)">Sin cambios de líneas.</div>') + '</div>' +
    '<div class="section-card" style="font-size:13px">' + nc + ' respuestas · ' + n + ' fotos · ' + nn + ' notas' + (c.fiscal && c.fiscal.nif ? ' · datos fiscales ✓' : ' · <span style="color:var(--amber)">sin datos fiscales</span>') + '</div>' +
    ((c.borrador.avisos||[]).length ? '<div class="section-card"><div class="section-card-title">Avisos activos</div>' + c.borrador.avisos.map(a => '<div class="mv-aviso" style="margin:6px 0">⚠ ' + escH(a.texto) + '</div>').join('') + '</div>' : '') +
    '<div class="mv-opts"><button class="mv-opt sel" onclick="mvEnviarModal()">Enviar ' + sig + ' en directo</button><button class="mv-opt" onclick="mvDejarBorrador()">Dejar en borrador para revisar en el panel</button></div>' +
    '<div class="mv-nav"><button onclick="mvIr(-1)">← Anterior</button></div>';
}
function mvDejarBorrador(){
  const c = mvCaso(); c.visita.estado = 'realizada';
  c.eventos.push({ fecha:hoy(), tipo:'visita', texto:'Visita realizada. Borrador de ' + siguienteVersionId(c) + ' pendiente de revisión', autor:'reformista' });
  const id = c.id; cerrarModoVisita(); toast('Visita cerrada · borrador guardado'); navegarA('presupuestos', document.getElementById('nb-presupuestos')); void id;
}
function mvEnviarModal(){
  const c = mvCaso(); const tmp = borradorComoVersion(c); const cli = clienteDe(c);
  const msg = fillTpl(PLANTILLAS_MSG.envio_version, varsDe(c, { importe: fmtEur(tmp.totales.total) }));
  openModal('<div class="modal-title">Enviar ' + tmp.id + ' en directo · ' + escH(cli.nombre) + '</div><div class="section-card"><div class="section-card-title">Total</div><div style="font-family:\'Cormorant Garamond\',serif;font-size:26px">' + fmtEur(tmp.totales.total) + '</div></div>' + msgBloque(msg, cli.tel) +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="closeAllModals()">Volver</button><button class="abtn abtn-primary" onclick="mvConfirmarEnvio()">Enviar y cerrar visita</button></div>');
}
function mvConfirmarEnvio(){
  const c = mvCaso(); c.visita.estado = 'realizada';
  const nv = enviarBorradorComoVersion(c, 'tras_visita');
  closeAllModals(); cerrarModoVisita(); toast('Versión ' + nv.id + ' enviada'); navegarA('presupuestos', document.getElementById('nb-presupuestos'));
}
function enviarBorradorComoVersion(c, tipo){
  const nv = borradorComoVersion(c, tipo);
  enviarVersion(c, nv, 'WhatsApp'); c.borrador = null;
  if (['en_triaje','en_visita'].includes(c.estado) && puedeTransitar(c, 'propuesta_enviada')) transitar(c, 'propuesta_enviada', { autor:'reformista', texto:'Presupuesto ' + nv.id + ' enviado' });
  return nv;
}

  document.getElementById('pg-' + id).innerHTML =
    '<div class="page-hdr"><div><div class="page-title">' + title + '</div><div class="page-sub">Llega en la ' + fase + '</div></div></div>' +
    '<div class="stub-pg"><div class="stub-icon">' + icon + '</div><div class="stub-title">' + title + '</div>' +
    '<div class="stub-sub">' + sub + '</div>' +
    '<div class="stub-tags">' + tags.map(t => '<span class="stub-tag">' + t + '</span>').join('') + '</div></div>';
}
RENDERERS.obras = () => stub('obras','🏗','Obras','Panel de obras en curso con hitos, cambios, adendas y partes de trabajo. Los datos y la lógica (progreso, salud, adendas) ya están cargados.',['Hitos','Cambios y adendas','Progreso','Salud de obra'],'Fase D');
RENDERERS.configuracion = () => stub('configuracion','⚙','Configuración','Ajustes del negocio: márgenes, IVA, zona, visita, plan de cobros, hitos tipo y pesos de calidad. Todo editable sobre la configuración por defecto ya cargada.',['Económico','Zona y visita','Plan de cobros','Pesos de calidad'],'Fase G');

// ═══════════════════════════════════════════════════════
// SECCIÓN 14: LOGIN Y ARRANQUE
// ═══════════════════════════════════════════════════════
function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (email === DB.cfg.empresa.email && pass === 'admin1234'){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-shell').style.display = 'block';
    document.getElementById('demo-panel').classList.add('visible');
    actualizarDemoFecha();
    navegarA('resumen', document.getElementById('nb-resumen'));
  } else {
    document.getElementById('l-err').style.display = 'block';
  }
}
function doLogout(){
  document.getElementById('admin-shell').style.display = 'none';
  document.getElementById('demo-panel').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  closeAllModals();
}
function actualizarDemoFecha(){
  const txt = fmtFecha(hoy()) + (_hoyOffset ? ' (+' + _hoyOffset + 'd)' : '');
  document.getElementById('demo-fecha-txt').textContent = txt;
}
function aplicarRelojesAutomaticos(){
  DB.casos.forEach(c => {
    evaluarRelojes(c, DB.cfg, hoy()).forEach(acc => {
      try {
        if (acc.accion === 'transitar_a_pausa' && c.estado !== 'en_pausa' && puedeTransitar(c, 'en_pausa'))
          transitar(c, 'en_pausa', {autor:'sistema', texto:'Pausado automáticamente (sin respuesta)'});
        if (acc.accion === 'marcar_caducada' && c.estado === 'propuesta_enviada' && puedeTransitar(c, 'caducada')){
          transitar(c, 'caducada', {autor:'sistema', texto:'Propuesta caducada automáticamente'});
          const v = c.versiones.find(x => x.estado === 'vigente'); if (v) v.estado = 'caducada';
        }
      } catch(e){}
    });
  });
}
function avanzarTiempo(dias){
  _hoyOffset += dias; DB.meta.hoyOffsetDias = _hoyOffset;
  aplicarRelojesAutomaticos();
  actualizarDemoFecha();
  renderPaginaActual();
  toast('Avanzado ' + dias + ' día' + (dias>1?'s':'') + ' · ' + fmtFecha(hoy()));
}
function volverHoy(){
  _hoyOffset = 0; DB = crearDBInicial();
  actualizarDemoFecha(); renderPaginaActual();
  toast('Fecha restablecida a hoy');
}
function restablecerDatos(){
  _hoyOffset = 0; DB = crearDBInicial();
  catFiltroCat = 'todos'; bandejaFiltro = 'activos';
  actualizarDemoFecha(); renderPaginaActual();
  toast('Datos de demostración restablecidos');
}

// Arranque
(function init(){
  actualizarDemoFecha();
  const res = window.__tests();
  console.log('%cPanel del reformista v2 — Fase A cargada. Ejecuta __tests() en consola para ver el detalle.', 'color:#c96f28');
  if (res.fails && res.fails.length) console.warn('Tests con fallos:', res.fails);
})();
</script>
