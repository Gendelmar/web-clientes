let _repro = { id:null, libres:[], sel:null };
function reprogramarModal(id){
  const c = DB.casos.find(x=>x.id===id); if(!c || !c.visita.elegida) return;
  _repro = { id, libres: franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14, id).slice(0,12), sel:null };
  renderRepro();
}
function renderRepro(){
  const c = DB.casos.find(x=>x.id===_repro.id); const pol = politicaReprogramar(c, DB.cfg, _hoyDate());
  const opts = _repro.libres.map((f,i)=>'<div class="franja-opt ' + (_repro.sel===i?'sel':'') + '" onclick="_repro.sel=' + i + ';renderRepro()">' + fmtFecha(f.fecha) + ' · ' + f.franja + '</div>').join('');
  openModal('<div class="modal-title">Reprogramar visita · ' + escH(clienteDe(c).nombre) + '</div>' +
    '<p style="font-size:13px;margin-bottom:6px">Actual: <b>' + fmtFecha(c.visita.elegida.fecha) + ' · ' + c.visita.elegida.franja + '</b> (en ' + pol.horas + ' h)</p>' +
    '<div class="porque" style="margin-bottom:12px"><b>' + (pol.gratis?'✓ Reprogramación gratuita':'⚠ Reprogramación tardía') + '</b> (límite ' + pol.limite + ' h)<br>' + escH(pol.efecto) + '</div>' + opts +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="closeAllModals()">Cancelar</button><button class="abtn abtn-primary" ' + (_repro.sel==null?'disabled style="opacity:.5"':'') + ' onclick="confirmarRepro()">Reprogramar</button></div>');
}
function confirmarRepro(){ const c = DB.casos.find(x=>x.id===_repro.id); if(!c||_repro.sel==null) return; reprogramarVisita(c, _repro.libres[_repro.sel], 'reformista'); closeAllModals(); toast('Visita reprogramada'); refrescar(); }
function reprogramarVisita(c, franja, autor){
  const pol = politicaReprogramar(c, DB.cfg, _hoyDate()); const prev = c.visita.elegida;
  c.visita.elegida = franja; c.visita.estado = 'confirmada'; c.visita.confirmadaCliente = false;
  let extra = '';
  if (pol && !pol.gratis && pol.tardia==='retiene' && c.visita.cobro && c.visita.cobro.estado==='cobrada'){ c.visita.cobro.estado = 'pendiente'; extra = ' · tardía: se retiene el cobro anterior y la nueva visita queda pendiente de cobro'; }
  (c.eventos = c.eventos||[]).push({ fecha:hoy(), tipo:'visita', texto:'Visita reprogramada de ' + (prev?fmtFechaCorta(prev.fecha) + ' ' + prev.franja:'—') + ' a ' + fmtFechaCorta(franja.fecha) + ' ' + franja.franja + extra, autor:autor||'reformista' });
  return pol;
}
function cancelarVisitaModal(id){
  const c = DB.casos.find(x=>x.id===id); if(!c || !c.visita.elegida) return; const pol = politicaReprogramar(c, DB.cfg, _hoyDate());
  openModal('<div class="modal-title">Cancelar visita · ' + escH(clienteDe(c).nombre) + '</div><p style="font-size:13px;margin-bottom:8px">' + fmtFecha(c.visita.elegida.fecha) + ' · ' + c.visita.elegida.franja + '</p>' +
    '<div class="porque"><b>' + (pol.gratis?'✓ Cancelación sin coste':'⚠ Cancelación tardía') + '</b><br>' + (pol.pagada ? (pol.gratis?'Se reembolsará el cobro de la visita.':'Se retiene el cobro de la visita.') : 'No hay cobro de visita registrado.') + '</div>' +
    '<div style="margin-top:14px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="closeAllModals()">Volver</button><button class="abtn abtn-primary" onclick="cancelarVisita(\'' + id + '\')">Cancelar visita</button></div>');
}
function cancelarVisita(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return; const pol = politicaReprogramar(c, DB.cfg, _hoyDate()); const prev = c.visita.elegida;
  let extra = '';
  if (pol && pol.pagada && pol.gratis){ DB.cobros.filter(m=>m.casoId===c.id && m.tipo==='visita' && m.estado==='cobrado').forEach(m=>m.estado='anulado'); c.visita.cobro.estado='pendiente'; extra = ' · cobro reembolsado'; }
  else if (pol && pol.pagada) extra = ' · cancelación tardía: se retiene el cobro';
  c.visita.estado = 'cancelada'; c.visita.elegida = null;
  if (c.visita.cobro && c.visita.cobro.estado === 'pendiente_pago') c.visita.cobro = { importe:c.visita.cobro.importe, politica:'reprogramable', estado:'pendiente' };
  if (c.estado==='visita_confirmada' && puedeTransitar(c,'visita_propuesta')) transitar(c,'visita_propuesta',{autor:'reformista',texto:'Visita cancelada; se vuelve a proponer'});
  c.eventos.push({ fecha:hoy(), tipo:'visita', texto:'Visita cancelada (' + fmtFechaCorta(prev.fecha) + ' ' + prev.franja + ')' + extra, autor:'reformista' });
  closeAllModals(); toast('Visita cancelada'); refrescar();
}

const MV = { id:null, i:0, cards:[], grab:false, fotoEsp:null, fotoEti:'General', notaEsp:null, savedT:null };
const MV_GRUPOS = ['Resumen','Checklist','Medidas','Fotos','Notas','Datos fiscales','Presupuesto','Cerrar visita'];
function mvCaso(){ return DB.casos.find(c => c.id === MV.id); }
function recalcularYGuardar(c){
  asegurarBorrador(c);
  const res = recalcularBorrador(c, DB.cfg);
  c.borrador.lineas = res.lineas; c.borrador.avisos = res.avisos;
  return res;
}
function mvCards(c){
  const cards = [{ t:'resumen', g:'Resumen' }];
  generarChecklist(c).forEach(it => cards.push({ t:'check', g:'Checklist', item:it }));
  cards.push({ t:'medidas', g:'Medidas' }, { t:'fotos', g:'Fotos' }, { t:'notas', g:'Notas' }, { t:'fiscal', g:'Datos fiscales' }, { t:'presupuesto', g:'Presupuesto' }, { t:'cerrar', g:'Cerrar visita' });
  return cards;
}
function abrirModoVisita(id){
  const c = DB.casos.find(x => x.id === id); if (!c) return;
  if (c.estado === 'visita_confirmada' && puedeTransitar(c, 'en_visita')) transitar(c, 'en_visita', { autor:'reformista', texto:'Visita iniciada (Modo visita)' });
  c.visita = Object.assign({ checks:{}, medidas:{}, fotos:[], notas:[] }, c.visita);
  recalcularYGuardar(c);
  MV.id = id; MV.i = 0; MV.cards = mvCards(c); MV.grab = false; MV.fotoEsp = (c.solicitud.espacios[0]||{}).id || null; MV.notaEsp = MV.fotoEsp;
  closeAllModals();
  document.getElementById('demo-panel').style.display = 'none';
  document.getElementById('mv-root').style.display = 'flex';
  renderMV();
}
function cerrarModoVisita(){
  document.getElementById('mv-root').style.display = 'none'; document.getElementById('mv-root').innerHTML = '';
  document.getElementById('demo-panel').style.display = '';
  MV.id = null; renderPaginaActual();
}
function mvGuardado(){
  const el = document.getElementById('mv-saved'); if (!el) return;
  el.textContent = 'Guardado ✓'; el.style.opacity = 1; clearTimeout(MV.savedT); MV.savedT = setTimeout(() => { const e2 = document.getElementById('mv-saved'); if (e2) e2.style.opacity = .35; }, 1400);
}
function mvTotal(){
  const c = mvCaso(); if (!c) return; const tot = totalesBorrador(c);
  const el = document.getElementById('mv-total'); if (el) el.textContent = fmtEur(tot.total);
  const sub = document.getElementById('mv-sub'); if (sub) sub.textContent = 'Subtotal ' + fmtEur(tot.subtotal) + ' · IVA ' + (c.borrador.ivaPct) + '%';
  mvGuardado();
}
function mvAvisosHtml(item){
  const c = mvCaso(); const av = (c.borrador.avisos||[]).filter(a => !item || a.checkId === item.id);
  return av.map(a => '<div class="mv-aviso">⚠ ' + escH(a.texto) + '</div>').join('');
}
function mvIr(d){ MV.i = clamp(MV.i + d, 0, MV.cards.length - 1); renderMV(); document.querySelector('.mv-body')?.scrollTo(0,0); }
function mvIrGrupo(g){ const k = MV.cards.findIndex(x => x.g === g); if (k >= 0){ MV.i = k; renderMV(); } }

function renderMV(){
  const c = mvCaso(); if (!c) return; const cli = clienteDe(c); const card = MV.cards[MV.i];
  const paso = MV_GRUPOS.indexOf(card.g) + 1; const pct = Math.round((MV.i + 1) / MV.cards.length * 100);
  let cuerpo = '';
  if (card.t === 'resumen') cuerpo = mvResumen(c);
  else if (card.t === 'check') cuerpo = mvCheck(c, card.item);
  else if (card.t === 'medidas') cuerpo = mvMedidas(c);
  else if (card.t === 'fotos') cuerpo = mvFotos(c);
  else if (card.t === 'notas') cuerpo = mvNotas(c);
  else if (card.t === 'fiscal') cuerpo = mvFiscal(c);
  else if (card.t === 'presupuesto') cuerpo = mvPresupuesto(c);
  else if (card.t === 'cerrar') cuerpo = mvCerrar(c);
  const tot = totalesBorrador(c);
  document.getElementById('mv-root').innerHTML =
    '<div class="mv-head"><button class="mv-back" onclick="cerrarModoVisita()">← Volver</button><div class="mv-head-t"><b>' + escH(cli.nombre) + '</b><span>' + escH(direccionDe(c)) + '</span></div><span style="font-size:12px;color:var(--warm)">' + c.id + '</span></div>' +

function urgenteHoy(db, cfg, ahora){
  const out = []; const nom = c => (db.clientes.find(x => x.id === c.clienteId) || { nombre:'(sin cliente)' }).nombre;
  db.casos.forEach(c => {
    if (c.visita?.estado === 'confirmada' && c.visita.elegida?.fecha === ahora) out.push({ tipo:'visita', casoId:c.id, destino:'visita', texto:'Visita hoy a las ' + c.visita.elegida.franja.split('-')[0] + ' · ' + nom(c) });
    if (enBandeja(c) && scorePrioridad(c, cfg, ahora).nivel === 'Atender hoy') out.push({ tipo:'atender', casoId:c.id, destino:'caso', texto:'Solicitud para atender hoy · ' + nom(c) });
    evaluarRelojes(c, cfg, ahora).filter(x => ['recordatorio','recordatorio_visita','aviso_caducidad','reclamar_conformidad','reserva_pago','reserva_vencida'].includes(x.tipo)).forEach(x => out.push({ tipo:'recordatorio', casoId:c.id, destino:['reclamar_conformidad'].includes(x.tipo) ? 'obra' : 'caso', texto:x.texto + ' · ' + nom(c) }));
    (c.obra?.adendas||[]).filter(a => a.estado === 'enviada').forEach(a => out.push({ tipo:'adenda', casoId:c.id, destino:'obra', texto:'Adenda ' + a.id + ' pendiente de firma · ' + nom(c) }));
    if (['en_obra','en_remates'].includes(c.estado)) cambiosPendientes(c).filter(ch => ch.bloqueaObra && !ch.resuelto).forEach(ch => out.push({ tipo:'bloqueo', casoId:c.id, destino:'obra', texto:'Cambio ' + ch.id + ' bloquea la obra · ' + nom(c) }));
    if (c.aceptacion) cobrosPendientesDebidos(c, cfg, db.cobros).forEach(t => out.push({ tipo:'cobro', casoId:c.id, destino:'cobros', texto:'Cobro debido «' + t.label + '» ' + fmtEur0(t.falta) + ' · ' + nom(c) }));
    (db.avisosPago || []).filter(a => a.casoId === c.id && a.estado === 'pendiente').forEach(a => out.push({ tipo:'cobro_conf', casoId:c.id, destino:'cobros_conf', texto:'Cobro por confirmar: ' + fmtEur0(a.importe) + ' (' + (a.tipo === 'visita' ? 'visita' : (a.tramo || 'pago')) + ') · ' + nom(c) }));
    const nl = mensajesNoLeidos(c, 'adm'); if (nl) out.push({ tipo:'mensajes', casoId:c.id, destino:'mensajes', texto:nl + ' mensaje(s) sin leer · ' + nom(c) });
    if (pendienteConformidad(c)) out.push({ tipo:'conformidad', casoId:c.id, destino:'obra', texto:'Entregada, pendiente de conformidad del cliente · ' + nom(c) });
  });
  return out;
}
function cifrasClave(db, cfg, ahora){
  const ult = (f, n) => f && diasEntre(f, ahora) >= 0 && diasEntre(f, ahora) <= n;
  const nuevas30 = db.casos.filter(c => ult(c.creadoAt, 30)).length;
  const enviadas90 = db.casos.filter(c => (c.versiones||[]).some(v => v.enviadaAt && ult(v.enviadaAt, 90))).length;
  const aceptadas90 = db.casos.filter(c => c.aceptacion && ult(c.aceptacion.fecha, 90) && (c.versiones||[]).some(v => v.enviadaAt)).length;
  const propuestas = r(db.casos.filter(c => c.estado === 'propuesta_enviada').reduce((s,c) => s + ((c.versiones||[]).find(v => v.estado === 'vigente')?.totales?.total || 0), 0));
  const pendientes = r(db.casos.filter(c => c.aceptacion && ESTADOS_OBRA.includes(c.estado)).reduce((s,c) => s + Math.max(0, estadoEconomico(c, db.cobros).saldo), 0));
  return { nuevas30, enviadas90, aceptadas90, conversion: enviadas90 ? Math.round(aceptadas90 / enviadas90 * 100) : null, propuestas, pendientes };
}
function totalAceptadoCliente(db, clienteId){ return r(db.casos.filter(c => c.clienteId === clienteId && c.aceptacion).reduce((s,c) => s + c.aceptacion.importe, 0)); }

function variacionPct(p){ const h = p.hist || []; if (h.length < 2 || !h[h.length-2]) return 0; return r((h[h.length-1] - h[h.length-2]) / h[h.length-2] * 100); }
function alertaVariacion(p, cfg){ return Math.abs(variacionPct(p)) >= ((cfg.catalogo && cfg.catalogo.umbralAlerta) || 5); }
function productoUsado(db, pid){
  return (db.casos||[]).filter(esAbierto).some(c => (c.borrador?.lineas||[]).some(l => l.productoId === pid) || (c.versiones||[]).some(v => !['sustituida','caducada','rechazada','aceptada'].includes(v.estado) && (v.lineas||[]).some(l => l.productoId === pid)));
}
function recalcularEstimaciones(db, ivaAnterior){
  let n = 0;
  (db.casos||[]).filter(esAbierto).forEach(caso => {
    (caso.versiones||[]).filter(v => !v.enviadaAt && !['sustituida','caducada','rechazada','aceptada'].includes(v.estado)).forEach(v => {
      v.ivaPct = db.cfg.iva; const tot = calcularTotales(v.lineas, v.ivaPct, db.cfg.margen, db.cfg.minimo); const hq = calcularHorquilla(tot.total, calcularIncertidumbre(caso).nivel); tot.lo = hq.lo; tot.hi = hq.hi; v.totales = tot; n++;
    });
    if (caso.borrador && (ivaAnterior == null || caso.borrador.ivaPct === ivaAnterior)) caso.borrador.ivaPct = db.cfg.iva;
  });
  return n;
}
// variación determinista de la actualización simulada (-6 % … +6 %)
function variacionSimulada(pid, semilla){ let h = 0; const t = pid + '|' + semilla; for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 9973; return ((h % 13) - 6) / 100; }
function actualizarPreciosSimulado(db, semilla){
  const cambios = [];
  db.catalogo.forEach(p => { const v = variacionSimulada(p.id, semilla); if (!v) return; const antes = p.precio; p.precio = r(antes * (1 + v)); p.hist = (p.hist||[]).concat([p.precio]).slice(-8); p.alerta = alertaVariacion(p, db.cfg); if (p.precioManual == null) cambios.push({ id:p.id, antes, despues:p.precio, pct:r(v*100) }); });
  return cambios;
}

function cfgSet(path, raw, tipo){
  let val = raw;

  const ivaAnt = DB.cfg.iva; cfgPut(path, val);
  if (['margen','iva','minimo'].includes(path)){ const n = recalcularEstimaciones(DB, path === 'iva' ? ivaAnt : null); toast('Guardado · ' + n + ' estimación(es) recalculada(s)'); }
  else if (path === 'horquillaV1Pct'){ const n = recalcularHorquillas(DB); toast('Guardado · ' + n + ' horquilla(s) de V1 recalculada(s)'); }
  else toast('Guardado · efecto inmediato');

  else if (tipo === 'csv') ctl = '<input type="text" value="' + escH((v||[]).join(', ')) + '" onchange="cfgSet(\'' + path + '\',this.value,\'csv\')">';

function ckEf(i, j, k, v){ const e = CHECKLIST_PLANTILLAS[i].efectos[j]; if (k === 'tipo'){ const base = { tipo:v }; if (v === 'add_linea') Object.assign(base, { cuando:{op:'true'}, concepto:'Nueva partida', unidad:'fijo', cantidad:1, precio:100, tipo_linea:'mo' }); if (v === 'multiplicador') Object.assign(base, { cuando:{op:'eq',valor:''}, aplicaA:['mo'], factor:1.05 }); if (v === 'aviso') Object.assign(base, { cuando:{op:'true'}, texto:'Aviso' }); if (v === 'set_cantidad') base.base = 'm2_suelo'; CHECKLIST_PLANTILLAS[i].efectos[j] = base; } else e[k] = ['precio','factor'].includes(k) ? Number(v)||0 : (k === 'cantidad' && v !== 'm2_espacio' ? (Number(v)||1) : v); toast('Efecto actualizado'); RENDERERS.configuracion(); }
function ckEfCuando(i, j, k, v){ const e = CHECKLIST_PLANTILLAS[i].efectos[j]; e.cuando = e.cuando || { op:'true' }; e.cuando[k] = k === 'valor' && v !== '' && !isNaN(v) ? Number(v) : v; RENDERERS.configuracion(); }

function ckEfDel(i, j){ CHECKLIST_PLANTILLAS[i].efectos.splice(j,1); RENDERERS.configuracion(); }
function ckDel(i){ confirmarAccion('Eliminar pregunta', '¿Eliminar «' + CHECKLIST_PLANTILLAS[i].label + '» del checklist?', () => { CHECKLIST_PLANTILLAS.splice(i,1); closeAllModals(); RENDERERS.configuracion(); }); }
function ckAdd(){ CHECKLIST_PLANTILLAS.push({ id:'q' + Date.now().toString(36), label:'Nueva pregunta', tipo:'si_no', porEspacio:false, aplicaA:{ siempre:true }, efectos:[{ tipo:'ninguno' }] }); RENDERERS.configuracion(); }

function nombreAccesible(el){
  if (el.getAttribute('aria-label') || el.getAttribute('aria-labelledby')) return true;

  openModal('<div class="modal-title">Pedir al cliente · ' + escH(cli.nombre) + '</div>' +
    (tipo === 'vivienda' ? '<p style="font-size:13px;color:var(--muted);margin-bottom:8px">Marca qué datos de la vivienda necesitas:</p>' + Object.keys(VIV_ETIQ).map(k => '<label class="check-q"><input type="checkbox" ' + (_pd.sel[k] ? 'checked' : '') + ' onchange="_pd.sel[\'' + k + '\']=this.checked;pedirDatosModal(\'' + id + '\',\'vivienda\')"> ' + escH(VIV_ETIQ[k][0].toUpperCase() + VIV_ETIQ[k].slice(1)) + '</label>').join('') : '<p style="font-size:13px;color:var(--muted)">El cliente los completa al aceptar el presupuesto (o antes, desde «Completar ahora»).</p>') +
    '<div class="modal-section"><b style="font-size:12px;text-transform:uppercase;color:var(--muted)">Mensaje</b>' + msgBloque(msg, cli.tel) + '</div>' +
    '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost" onclick="' + (volver || 'renderFicha()') + '">Cancelar</button><button class="abtn abtn-primary" onclick="pedirDatosOk(\'' + id + '\')">Dejar el mensaje en la conversación</button></div>', true);
  window._pdMsg = msg;
}
function pedirDatosOk(id){ const c = DB.casos.find(x => x.id === id); escribirMensaje(c, { autor:'reformista', texto:window._pdMsg, tipo:'mensaje' }); if (_pd.tipo === 'vivienda') c.datosVivienda = Object.assign(nuevoDatosVivienda(c), c.datosVivienda || {}, { pedidos:Object.keys(_pd.sel).filter(k => _pd.sel[k]) }); toast('Mensaje registrado: el cliente lo verá en su panel'); renderPaginaActual(); if (_fichaId) renderFicha(); else closeAllModals(); }

// ═══════════════════════════════════════════════════════
// SECCIÓN 14: LOGIN Y ARRANQUE
// ═══════════════════════════════════════════════════════
function doLogin(){
  const email = document.getElementById('l-email').value.trim();
  const pass = document.getElementById('l-pass').value;
  if (email === DB.cfg.empresa.email && pass === 'admin1234'){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-shell').style.display = 'block';
    document.getElementById('demo-panel').classList.add('visible'); demoInicial();
    actualizarDemoFecha();
    navegarA('resumen', document.getElementById('nb-resumen'));
  } else {
    document.getElementById('l-err').style.display = 'block';
  }
}
function doLogout(){
  document.getElementById('admin-shell').style.display = 'none';
  document.getElementById('demo-panel').classList.remove('visible');
  document.getElementById('login-screen').style.display = 'flex';
  closeAllModals();
}
function demoInicial(){ if (window.innerWidth <= 820) { document.getElementById('demo-panel').classList.add('col'); document.getElementById('demo-toggle').setAttribute('aria-expanded','false'); } }
function actualizarDemoFecha(){
  const txt = fmtFecha(hoy()) + (_hoyOffset ? ' (+' + _hoyOffset + 'd)' : '');
  document.getElementById('demo-fecha-txt').textContent = txt;
}
function aplicarRelojesAutomaticos(){
  DB.casos.forEach(c => {
    evaluarRelojes(c, DB.cfg, hoy()).forEach(acc => {
      try {
        if (acc.accion === 'transitar_a_pausa' && c.estado !== 'en_pausa' && puedeTransitar(c, 'en_pausa'))
          transitar(c, 'en_pausa', {autor:'sistema', texto:'Pausado automáticamente (sin respuesta)'});
        if (acc.accion === 'pausar_partida'){ const ch = (c.obra.cambios||[]).find(x => x.id === acc.cambioId); if (ch && !ch.partidaPausada){ ch.partidaPausada = true; c.eventos.push({ fecha:hoy(), tipo:'sistema', texto:'Partida pausada pendiente de aprobación (cambio ' + ch.id + ' bloqueante >48 h)', autor:'sistema' }); } }
        if (acc.accion === 'liberar_reserva' && c.estado === 'visita_confirmada'){ liberarReserva(c, 'no llegó el justificante de pago en ' + reservaHoras(DB.cfg) + ' h'); escribirMensaje(c, { autor:'sistema', texto:'Hemos liberado tu hueco de visita porque no recibimos el justificante del pago a tiempo. Puedes volver a elegir día desde tu panel.', sinEvento:true }); }
        if (acc.accion === 'recordar_pago' && c.estado === 'visita_confirmada'){ c.visita.cobro.recordadaAt = ahoraMs(); escribirMensaje(c, { autor:'sistema', texto:'Recordatorio: tu hueco de visita sigue reservado, pero necesitamos el justificante del pago para mantenerlo. Quedan unas ' + Math.round(estadoReserva(c, ahoraMs()).restanteHoras) + ' h.', tipo:'mensaje' }); }
        if (acc.accion === 'marcar_caducada' && c.estado === 'propuesta_enviada' && puedeTransitar(c, 'caducada')){
          transitar(c, 'caducada', {autor:'sistema', texto:'Propuesta caducada automáticamente'});
          const v = c.versiones.find(x => x.estado === 'vigente'); if (v) v.estado = 'caducada';
        }
      } catch(e){}
    });
  });
}
function avanzarTiempo(dias){
  _hoyOffset += dias; DB.meta.hoyOffsetDias = _hoyOffset;
  aplicarRelojesAutomaticos(); sincronizarNotificaciones(DB, DB.cfg, hoy());
  actualizarDemoFecha();
  renderPaginaActual();
  toast('Avanzado ' + dias + ' día' + (dias>1?'s':'') + ' · ' + fmtFecha(hoy()));
}
function volverHoy(){
  _hoyOffset = 0; DB = crearDBInicial(); restablecerGlobales(); Adj.limpiar(); sembrarAdjuntosDemo();
  actualizarDemoFecha(); renderPaginaActual();
  toast('Fecha restablecida a hoy');
}
function restablecerDatos(){
  _hoyOffset = 0; DB = crearDBInicial(); restablecerGlobales(); Adj.limpiar(); sembrarAdjuntosDemo(); msgSel = null; msgAdj = []; catF = { cat:'', prov:'', variacion:'', stock:'', usados:false, fav:false, q:'', orden:'nombre' };
  catFiltroCat = 'todos'; bandejaFiltro = 'activos';
  actualizarDemoFecha(); renderPaginaActual();
  toast('Datos de demostración restablecidos');
}

// Arranque
(function init(){
  actualizarDemoFecha(); aplicarTema(); aplicarPantalla();
  sembrarAdjuntosDemo(); actualizarBurbujas();
  const res = window.__tests();
  console.log('%cPanel del reformista v2 cargado. Ejecuta __tests() en la consola para ver el detalle de las pruebas.', 'color:#c96f28');
  if (res.fails && res.fails.length) console.warn('Tests con fallos:', res.fails);
})();
</script>
<script>
/* === PROTOTIPO COMPLETO · adaptador del panel administrador === */
window.__P = {
  db: () => DB,
  off: () => _hoyOffset,
  refresh: () => {
    try { const ae = document.activeElement; if (paginaActual === 'mensajes' && ae && ae.closest && ae.closest('[data-keep]')) actualizarBurbujas(); else renderPaginaActual(); } catch (e) {}
    try { const bg = document.getElementById('modal-bg'); if (typeof _fichaId !== 'undefined' && _fichaId && bg && bg.classList.contains('open')) renderFicha(); } catch (e) {}
  },
  abrir: (id) => { try { navegarA('bandeja', document.getElementById('nb-bandeja')); abrirCaso(id); } catch (e) { console.warn(e); } },
  toast: (m) => { try { toast(m); } catch (e) {} }
};

</script>
