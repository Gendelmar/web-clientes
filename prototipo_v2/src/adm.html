<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel del reformista v2 — Anatoliy Reformas</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f4efe6;--stone:#e5ddd0;--warm:#c4b49a;--terra:#8a5c38;
  --deep:#18100a;--ink:#1c140d;--accent:#c96f28;--light:#faf7f2;
  --muted:#7a6b58;--ok:#3a6648;--danger:#963030;--border:#ddd5c5;
  --side:#130d06;--r:10px;--amber:#7a4e0a;
  --prio-hoy:#c62828;--prio-pronto:#e65100;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
a{color:var(--accent);text-decoration:none}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}

/* ── LOGIN ───────────────────────────────────────── */
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--deep)}
.login-card{background:var(--cream);border-radius:16px;padding:48px 40px;width:360px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.login-logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;color:var(--terra);margin-bottom:4px}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:32px}
.login-card label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.login-card input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:var(--light);color:var(--ink);margin-bottom:16px;outline:none;transition:border .2s}
.login-card input:focus{border-color:var(--accent)}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;margin-top:8px}
.login-btn:hover{background:var(--terra)}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;display:none}

/* ── SHELL ───────────────────────────────────────── */
.admin-shell{display:none;min-height:100vh}
.sidebar{position:fixed;top:0;left:0;width:200px;height:100vh;background:var(--side);display:flex;flex-direction:column;padding:0;z-index:100;overflow-y:auto}
.sidebar-logo{padding:20px 16px 10px;border-bottom:1px solid rgba(255,255,255,.07)}
.sidebar-logo-t{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--accent)}
.sidebar-logo-s{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.sidebar-nav{padding:10px 0;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;background:none;border:none;color:rgba(255,255,255,.55);font-size:13px;text-align:left;transition:background .15s,color .15s;border-radius:0}
.nav-btn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85)}
.nav-btn.active{background:rgba(201,111,40,.18);color:var(--accent);font-weight:600}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sidebar-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.07)}
.sidebar-user{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:8px}
.logout-btn{display:block;width:100%;padding:7px 12px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);border:none;border-radius:6px;font-size:12px;text-align:center}
.logout-btn:hover{background:rgba(255,255,255,.12)}
.admin-main{margin-left:200px;min-height:100vh;padding:0}
.apage{display:none;padding:28px 32px;max-width:1200px}
.apage.active{display:block}

/* ── PAGE HEADER ─────────────────────────────────── */
.page-hdr{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:400;color:var(--deep)}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px}

/* ── STAT GRID ───────────────────────────────────── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;color:var(--deep);line-height:1}
.stat-lbl{font-size:12px;color:var(--muted);margin-top:5px}
.stat-delta{font-size:11px;margin-top:4px}
.stat-delta.up{color:var(--ok)}
.stat-delta.dn{color:var(--danger)}

/* ── BANDEJA ─────────────────────────────────────── */
.bandeja-tools{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.bandeja-filter{padding:6px 12px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--light);color:var(--ink);outline:none}
.bandeja-filter:focus{border-color:var(--accent)}
.bandeja-count{font-size:12px;color:var(--muted);margin-left:auto}
.caso-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:10px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.caso-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08);border-color:var(--warm)}
.caso-card-top{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.caso-ref{font-size:11px;color:var(--muted);font-family:'Cormorant Garamond',serif}
.caso-nombre{font-weight:600;font-size:14px;flex:1}
.caso-tipo{font-size:12px;color:var(--muted)}
.caso-card-mid{display:flex;align-items:center;gap:20px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.caso-importe{font-weight:600;color:var(--ink);font-size:13px}
.caso-dias{font-size:11px}
.prio-chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.prio-chip.hoy{background:#ffe8e8;color:var(--prio-hoy)}
.prio-chip.pronto{background:#fff3e0;color:var(--prio-pronto)}
.prio-chip.espera{background:var(--stone);color:var(--muted)}
.accion-btn{margin-left:auto;font-size:11px;padding:4px 12px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-weight:600}
.accion-btn:hover{background:var(--terra)}
.score-bar{display:flex;align-items:center;gap:6px}
.score-track{flex:1;max-width:80px;height:4px;background:var(--stone);border-radius:2px;overflow:hidden}
.score-fill{height:100%;border-radius:2px;background:var(--accent)}
.score-val{font-size:11px;color:var(--muted);min-width:28px}

/* ── BADGES ──────────────────────────────────────── */
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.b-ok{background:#e8f5e9;color:#1b5e20}
.b-warn{background:#fff8e1;color:#f57f17}
.b-info{background:#e3f2fd;color:#0d47a1}
.b-mute{background:var(--stone);color:var(--muted)}
.b-err{background:#ffebee;color:#b71c1c}
.b-acc{background:rgba(201,111,40,.12);color:var(--accent)}
/* estado badges */
.b-recibida{background:#e8f4fd;color:#1a6291}
.b-en_triaje{background:#fff8e7;color:#7a5c00}
.b-esperando_info{background:#fff0e0;color:#8a3800}
.b-visita_propuesta{background:#f0f8ff;color:#0050a0}
.b-visita_confirmada{background:#e8f0fe;color:#1a4691}
.b-en_visita{background:#e3f2fd;color:#0d47a1}
.b-propuesta_enviada{background:#e8f5e9;color:#1b5e20}
.b-aceptada{background:#d4f5e0;color:#155724}
.b-en_obra{background:#f3e5f5;color:#4a148c}
.b-terminada{background:#e8f5e9;color:#1b5e20}
.b-en_remates{background:#fff3e0;color:#e65100}
.b-cerrada{background:#f5f5f5;color:#424242}
.b-en_pausa{background:#fafafa;color:#616161;border:1px solid var(--border)}
.b-descartada{background:#ffebee;color:#b71c1c}
.b-caducada{background:#fff8e1;color:#f57f17}
.b-rechazada{background:#fce4ec;color:#880e4f}
.b-archivada{background:#eceff1;color:#546e7a}

/* ── TABLE ───────────────────────────────────────── */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.table-wrap table{width:100%;border-collapse:collapse}
.table-wrap th{background:var(--stone);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 16px;text-align:left;white-space:nowrap}
.table-wrap td{padding:12px 16px;font-size:13px;border-top:1px solid var(--border)}
.table-wrap tr:hover td{background:var(--light)}

/* ── BUTTONS ─────────────────────────────────────── */
.abtn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;border:none;transition:background .15s}
.abtn-primary{background:var(--accent);color:#fff}
.abtn-primary:hover{background:var(--terra)}
.abtn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border)}
.abtn-ghost:hover{background:var(--stone)}
.abtn-sm{padding:5px 12px;font-size:12px}

/* ── STUB PAGE ───────────────────────────────────── */
.stub-pg{text-align:center;padding:80px 20px;color:var(--muted)}
.stub-icon{font-size:48px;margin-bottom:16px}
.stub-title{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--deep);margin-bottom:8px}
.stub-sub{font-size:14px;max-width:400px;margin:0 auto 24px;line-height:1.6}
.stub-tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stub-tag{font-size:12px;background:var(--stone);color:var(--muted);padding:4px 12px;border-radius:20px}

/* ── MOBILE NAV ──────────────────────────────────── */
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--side);border-top:1px solid rgba(255,255,255,.1);z-index:200;justify-content:space-around;padding:6px 0}
.mn-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 8px;background:none;border:none;color:rgba(255,255,255,.45);font-size:10px}
.mn-btn.active{color:var(--accent)}
.mn-icon{font-size:18px}
@media(max-width:820px){
  .sidebar{display:none}
  .admin-main{margin-left:0;padding-bottom:72px}
  .mobile-nav{display:flex}
  .apage{padding:20px 16px}
}

/* ── DEMO PANEL ──────────────────────────────────── */
.demo-panel{position:fixed;bottom:16px;right:16px;background:var(--deep);color:var(--cream);border-radius:12px;padding:10px 14px;z-index:1000;display:none;align-items:center;gap:10px;font-size:12px;box-shadow:0 4px 20px rgba(0,0,0,.4);flex-wrap:wrap;max-width:500px}
.demo-panel.visible{display:flex}
.demo-fecha{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--warm);white-space:nowrap}
.demo-panel button{background:rgba(255,255,255,.1);color:var(--cream);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 10px;font-size:11px;white-space:nowrap}
.demo-panel button:hover{background:rgba(255,255,255,.2)}
.demo-sep{color:rgba(255,255,255,.2);margin:0 2px}

/* ── TOAST ───────────────────────────────────────── */
.toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--deep);color:var(--cream);padding:10px 18px;border-radius:8px;font-size:13px;max-width:320px;box-shadow:0 4px 16px rgba(0,0,0,.3);animation:fadeIn .2s}
.toast.err{background:#c62828}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ── MODAL ───────────────────────────────────────── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--cream);border-radius:14px;padding:32px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:16px}

/* ── CARDS + MISC ────────────────────────────────── */
.section-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.section-card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.prog-bar{background:var(--stone);border-radius:4px;height:6px;overflow:hidden;flex:1}
.prog-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.etiq-chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin:2px}
.etiq-ok{background:#e8f5e9;color:#1b5e20}
.etiq-warn{background:#fff8e1;color:#f57f17}
.etiq-bad{background:#ffebee;color:#b71c1c}
.etiq-info{background:#e3f2fd;color:#0d47a1}
.etiq-neu{background:var(--stone);color:var(--muted)}

/* ── RESUMEN ─────────────────────────────────────── */
.res-section-title{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--deep);margin:24px 0 12px}
.embudo-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.embudo-estado{flex:1}
.embudo-n{font-weight:600;min-width:30px;text-align:right}
.embudo-bar-wrap{flex:2;max-width:200px}

/* ── TABS ────────────────────────────────────────── */
.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 16px;background:none;border:none;border-bottom:2px solid transparent;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:-1.5px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .tab-n{font-size:11px;background:var(--stone);color:var(--muted);border-radius:10px;padding:1px 7px;margin-left:5px}
.tab.active .tab-n{background:rgba(201,111,40,.15);color:var(--accent)}

/* ── CONTROLES BANDEJA ───────────────────────────── */
.ctrl-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.ctrl-row input[type=text],.ctrl-row select{padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--light);color:var(--ink);outline:none}
.ctrl-row input[type=text]:focus,.ctrl-row select:focus{border-color:var(--accent)}
.ctrl-row .ctrl-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ctrl-check{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}

/* dos barras: calidad y espera */
.bar2{display:flex;flex-direction:column;gap:3px;min-width:150px}
.bar2-line{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.bar2-track{flex:1;height:4px;background:var(--stone);border-radius:2px;overflow:hidden}
.bar2-fill{height:100%;border-radius:2px}
.bar2-lbl{min-width:72px}

/* Por qué */
.porque{background:var(--light);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:8px;font-size:12px}
.porque-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.porque-grid{grid-template-columns:1fr}}
.pq-factor{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.pq-factor .pq-lbl{flex:1}
.pq-bar{width:70px;height:4px;background:var(--stone);border-radius:2px;overflow:hidden}
.pq-bar>div{height:100%;background:var(--accent)}
.pq-pts{min-width:42px;text-align:right;color:var(--muted)}
.pq-total{border-top:1px solid var(--border);margin-top:6px;padding-top:6px;font-weight:600;display:flex;justify-content:space-between}

/* ── KANBAN (Por estado) ─────────────────────────── */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px}
.kan-col{min-width:200px;flex-shrink:0;background:var(--light);border:1px solid var(--border);border-radius:10px;padding:10px}
.kan-col-hdr{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
.kan-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:12px}
.kan-card:hover{border-color:var(--accent)}
.kan-card-nombre{font-weight:600;margin-bottom:2px}

/* ── MENSAJE / TRIAJE MODAL ──────────────────────── */
.msg-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:13px;line-height:1.5;white-space:pre-wrap;margin:10px 0;max-height:220px;overflow-y:auto}
.msg-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.franja-opt{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.franja-opt.sel{border-color:var(--accent);background:rgba(201,111,40,.06)}
.check-q{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.modal-lg{max-width:860px}
.modal-section{border-top:1px solid var(--border);margin-top:18px;padding-top:16px}
.modal-section:first-of-type{border-top:none;margin-top:0;padding-top:0}

/* ── FICHA: edición en línea ─────────────────────── */
.ficha-tabs{display:flex;gap:2px;margin:14px 0;flex-wrap:wrap;position:sticky;top:0;background:var(--cream);z-index:2;padding-bottom:4px}
.ficha-tab{padding:7px 12px;font-size:12px;border:none;background:var(--stone);border-radius:6px;color:var(--muted);font-weight:500}
.ficha-tab.active{background:var(--accent);color:#fff}
.inl-field{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;border-bottom:1px dashed var(--border)}
.inl-field label{min-width:150px;color:var(--muted);font-size:12px}
.inl-field input,.inl-field select{flex:1;padding:4px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fff;color:var(--ink)}
.inl-field input:focus,.inl-field select:focus{border-color:var(--accent);outline:none}
.kv{display:flex;gap:8px;font-size:13px;padding:3px 0}
.kv .k{color:var(--muted);min-width:140px}

/* líneas de presupuesto editables */
.lineas-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.lineas-tbl th{text-align:left;font-size:10px;text-transform:uppercase;color:var(--muted);padding:6px 6px;border-bottom:1px solid var(--border)}
.lineas-tbl td{padding:4px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.lineas-tbl input{width:100%;padding:3px 5px;border:1px solid transparent;border-radius:4px;font-size:12px;background:transparent;color:var(--ink)}
.lineas-tbl input:hover{border-color:var(--border)}
.lineas-tbl input:focus{border-color:var(--accent);background:#fff;outline:none}
.lineas-tbl input.num{text-align:right}
.lin-cand{cursor:pointer;font-size:14px;opacity:.5}
.lin-cand.on{opacity:1;color:var(--accent)}
.lin-origen{font-size:9px;padding:1px 5px;border-radius:8px;background:var(--stone);color:var(--muted)}
.lin-grupo-td{background:var(--light);font-weight:600;font-size:11px;color:var(--terra);text-transform:uppercase;letter-spacing:.04em}
.totbar{position:sticky;bottom:0;background:var(--deep);color:var(--cream);border-radius:8px;padding:10px 14px;margin-top:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px}
.totbar b{color:#fff}
.totbar .tot-final{margin-left:auto;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--warm)}

/* versiones / diff */
.ver-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;margin:2px;cursor:pointer}
.ver-chip.vigente{border-color:var(--accent);color:var(--accent);font-weight:600}
.ver-chip.aceptada{border-color:var(--ok);color:var(--ok)}
.diff-add{color:var(--ok)} .diff-del{color:var(--danger);text-decoration:line-through} .diff-chg{color:var(--amber)}
.diff-row{font-size:12px;padding:3px 0;border-bottom:1px dashed var(--border)}

/* timeline */
.tl-item{display:flex;gap:10px;padding:6px 0;font-size:12px}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--warm);margin-top:5px;flex-shrink:0}
.tl-dot.sistema{background:var(--muted)} .tl-dot.cliente{background:var(--accent)} .tl-dot.reformista{background:var(--terra)}
.tl-fecha{color:var(--muted);min-width:70px}
.tl-autor{font-size:10px;color:var(--muted)}

/* vista cliente */
.cliente-view{background:linear-gradient(160deg,#faf7f2,#f0e9dd);border-radius:12px;padding:20px}
.cv-step{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.cv-step-dot{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:var(--stone);color:var(--muted)}
.cv-step-dot.done{background:var(--ok);color:#fff} .cv-step-dot.now{background:var(--accent);color:#fff}
.cv-action{background:#fff;border:2px solid var(--accent);border-radius:10px;padding:16px;margin:14px 0}
.cv-btn{display:block;width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;margin-top:8px}
.cv-btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--border)}

/* ── AGENDA ──────────────────────────────────────── */
.ag-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ag-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:900px){.ag-week{grid-template-columns:1fr}}
.ag-day{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;min-height:130px}
.ag-day.hoy{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ag-day.bloq{background:repeating-linear-gradient(45deg,#f6f1e8,#f6f1e8 6px,#ece4d6 6px,#ece4d6 12px)}
.ag-day.cerrado{background:var(--light);opacity:.75}
.ag-day-h{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:4px}
.ag-ev{font-size:11px;border-radius:6px;padding:4px 6px;margin-bottom:4px;cursor:pointer;border-left:3px solid var(--accent);background:rgba(201,111,40,.12);line-height:1.3}
.ag-ev.prop{background:transparent;border:1px dashed var(--warm);border-left:3px dashed var(--warm)}
.ag-ev.hito{border-left-color:#7b1fa2;background:#f3e5f5}
.ag-ev.alerta{border-left-color:var(--danger);background:#ffebee}
.ag-leyenda{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.ruta-item{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:6px}
.ruta-hora{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--terra)}
.ruta-tras{font-size:12px;color:var(--muted);padding:2px 0 8px 16px;border-left:2px dashed var(--warm);margin:0 0 6px 20px}
.disp-dia{display:flex;align-items:flex-start;gap:12px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.disp-dia .dd-n{min-width:84px;font-weight:600}
.disp-fr{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.disp-fr input[type=time],.disp-inp{padding:3px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;background:#fff;font-family:inherit}

/* ── MODO VISITA ─────────────────────────────────── */
.mv-root{position:fixed;inset:0;background:var(--cream);z-index:400;display:none;flex-direction:column}
.mv-head{background:var(--deep);color:var(--cream);padding:10px 16px;display:flex;align-items:center;gap:12px}
.mv-head .mv-back{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:8px;padding:8px 12px;font-size:13px}
.mv-head-t{flex:1;min-width:0}
.mv-head-t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-head-t span{font-size:11px;color:var(--warm)}
.mv-prog{height:4px;background:rgba(255,255,255,.15)}
.mv-prog>div{height:100%;background:var(--accent);transition:width .25s}
.mv-body{flex:1;overflow-y:auto;padding:18px 16px 110px;max-width:760px;width:100%;margin:0 auto}
.mv-step{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:6px}
.mv-q{font-family:'Cormorant Garamond',serif;font-size:28px;line-height:1.15;color:var(--deep);margin-bottom:6px}
.mv-ayuda{font-size:13px;color:var(--muted);margin-bottom:16px}
.mv-opts{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.mv-opt{padding:18px;font-size:17px;font-weight:600;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--ink);text-align:left}
.mv-opt.sel{border-color:var(--accent);background:rgba(201,111,40,.1);color:var(--terra)}
.mv-big{width:100%;padding:16px;font-size:22px;border:2px solid var(--border);border-radius:14px;background:#fff;color:var(--ink);font-family:inherit}
.mv-big:focus{border-color:var(--accent);outline:none}
.mv-aviso{background:#fff3e0;border:2px solid var(--accent);border-radius:12px;padding:12px 14px;font-size:14px;color:#7a3a00;margin:12px 0;font-weight:500}
.mv-nav{display:flex;gap:10px;margin-top:22px}
.mv-nav button{flex:1;padding:14px;font-size:15px;font-weight:600;border-radius:12px;border:2px solid var(--border);background:#fff;color:var(--ink)}
.mv-nav button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.mv-foot{position:absolute;left:0;right:0;bottom:0;background:var(--deep);color:var(--cream);padding:10px 16px;display:flex;align-items:center;gap:14px}
.mv-foot-tot{flex:1}
.mv-foot-tot small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--warm)}
.mv-foot-tot b{font-family:'Cormorant Garamond',serif;font-size:26px;color:#fff;font-weight:600}
.mv-saved{font-size:11px;color:#9ad1a8;min-width:70px;transition:opacity .4s}
.mv-cerrar{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600}
.mv-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.mv-thumb{position:relative;aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#d9cdb8,#b9a888);color:#fff;font-size:10px;display:flex;align-items:flex-end;padding:6px}
.mv-thumb .x{position:absolute;top:4px;right:6px;background:rgba(0,0,0,.45);border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer}
.mv-chip{display:inline-block;padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;margin:0 6px 6px 0;background:#fff;cursor:pointer}
.mv-chip.sel{border-color:var(--accent);background:rgba(201,111,40,.12);color:var(--terra);font-weight:600}
.mv-med{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.mv-med-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mv-med-grid label{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.mv-med-grid input,.mv-hueco input,.mv-hueco select{width:100%;padding:10px;font-size:16px;border:1.5px solid var(--border);border-radius:8px;background:#fff;font-family:inherit}
.mv-hueco{display:grid;grid-template-columns:1fr 1fr 1fr 28px;gap:6px;margin-top:6px;align-items:center}
.mv-res{font-size:12px;color:var(--terra);margin-top:8px}
.mv-rec{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#ffebee;color:var(--danger);font-weight:600;margin:10px 0}
.mv-rec i{width:10px;height:10px;border-radius:50%;background:var(--danger);animation:mvpulse 1s infinite}
@keyframes mvpulse{50%{opacity:.25}}
.mv-nota{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:13px}

/* ── OBRA / DOCUMENTOS ───────────────────────────── */
.ob-det{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:12px}
.ob-det>summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--terra);list-style:none;padding:2px 0}
.ob-det>summary::-webkit-details-marker{display:none}
.ob-det>summary::before{content:'▸ ';color:var(--accent)}
.ob-det[open]>summary::before{content:'▾ '}
.ob-det[open]>summary{margin-bottom:8px}
.doc-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;padding:24px;max-height:60vh;overflow-y:auto}
.doc h1{font-family:'Cormorant Garamond',serif;font-size:28px;margin-bottom:2px}
.doc h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 6px}
.doc-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.doc-t{width:100%;border-collapse:collapse;font-size:13px}
.doc-t td{padding:5px 8px;border-bottom:1px solid var(--border)}
.doc-t td:first-child{color:var(--muted);width:42%}
.doc-leyenda{margin:12px 0;padding:8px 12px;border:2px dashed var(--danger);color:var(--danger);font-weight:600;text-align:center;font-size:13px}
.doc-firmas{display:flex;justify-content:space-between;margin-top:46px;font-size:12px;color:var(--muted)}
.doc-firmas div{border-top:1px solid #000;padding-top:4px;width:44%;text-align:center}
.doc ul{font-size:13px;padding-left:18px}
#print-area{display:none}
@media print{
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;padding:18mm;background:#fff;color:#000}
  #print-area .doc-wrap{border:none;max-height:none;overflow:visible;padding:0}
}

/* ── RESUMEN ─────────────────────────────────────── */
.urg-box{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.urg-box.vacio{border-color:var(--ok)}
.urg-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.urg-hdr b{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--terra)}
.urg-hdr span{font-size:12px;color:var(--muted)}
.urg-chips{margin-bottom:8px}
.urg-item{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--border);cursor:pointer;font-size:13px;border-radius:6px}
.urg-item:hover{background:var(--light)}
.urg-ic{width:22px;text-align:center}
.urg-go{color:var(--accent);font-size:18px}
.obras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.obra-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;cursor:pointer}
.obra-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.obra-card.en_riesgo{border-left-color:#e6a100}
.obra-card.bloqueada{border-left-color:var(--danger)}

/* ── CONFIGURACIÓN / CATÁLOGO ────────────────────── */
.cfg-row{display:flex;align-items:center;gap:14px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.cfg-row>label{flex:0 0 280px;color:var(--ink)}
.cfg-row>label small{display:block;color:var(--muted);font-size:11px}
.cfg-ctl{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cfg-ctl input[type=text],.cfg-ctl input[type=number],.cfg-ctl select,.cfg-ctl textarea,.cfg-row>label input{padding:6px 9px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
.cfg-ctl input[type=text],.cfg-ctl textarea{flex:1;min-width:180px}
.cfg-ctl input[type=number]{width:110px}
.cfg-ctl input:focus,.cfg-ctl select:focus,.cfg-ctl textarea:focus{border-color:var(--accent);outline:none}
.cfg-suf{font-size:12px;color:var(--muted)}
.cfg-live{font-size:10px;color:var(--ok);white-space:nowrap}
.section-card h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--terra);margin:18px 0 4px}
.section-card h3:first-child{margin-top:0}
.ck-ef{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:5px 0;border-bottom:1px dashed var(--border)}
.ck-ef input,.ck-ef select{padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit}
.cat-thumb{width:40px;height:40px;border-radius:8px;background:var(--stone);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.vis-track{display:inline-block;width:34px;height:18px;background:var(--warm);border-radius:10px;position:relative;vertical-align:middle}
.vis-track.on{background:var(--ok)}
.vis-knob{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:left .15s}
.vis-track.on .vis-knob{left:18px}
@media(max-width:700px){.cfg-row{flex-direction:column;align-items:flex-start;gap:4px}.cfg-row>label{flex:none}}
body[data-densidad=compacta] .caso-card{padding:10px 14px;margin-bottom:6px}
body[data-densidad=compacta] .apage{padding:18px 22px}
body[data-densidad=compacta] .stat-card{padding:12px 14px}
body[data-densidad=amplia] .caso-card{padding:22px 26px;margin-bottom:14px}
body[data-densidad=amplia] .apage{padding:36px 42px}

/* ── PULIDO: accesibilidad, táctil y responsive ──── */
:focus-visible{outline:3px solid var(--accent-dark,#a9561a);outline-offset:2px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent-dark,#a9561a);outline-offset:2px}
.abtn-primary,.accion-btn,.cv-btn:not(.ghost),.login-btn,.mv-cerrar,.ficha-tab.active{background:var(--accent-dark,#a9561a)}
.abtn-primary:hover,.accion-btn:hover,.login-btn:hover{background:var(--terra)}
.tab.active,.tab.active .tab-n{color:var(--accent-dark,#a9561a)}
.tab.active{border-bottom-color:var(--accent-dark,#a9561a)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.table-wrap{overflow-x:auto}
.table-wrap table{min-width:640px}
.modal-lg .lineas-tbl{display:block;overflow-x:auto}
.demo-panel .demo-toggle{padding:4px 8px}
.demo-panel.col .demo-body{display:none}
.demo-body{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
/* objetivos táctiles ≥ 44 px en el Modo visita */
.mv-root button,.mv-root select,.mv-root input:not([type=checkbox]):not([type=radio]),.mv-root textarea,.mv-chip,.mv-opt{min-height:44px}
.mv-root .abtn,.mv-back,.mv-cerrar,.mv-chip{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.mv-root input[type=checkbox],.mv-root input[type=radio]{width:24px;height:24px}
.mv-root .lin-cand,.mv-root .lineas-tbl span[onclick]{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;font-size:18px}
.mv-root .lineas-tbl{display:block;overflow-x:auto}
.mv-root .lineas-tbl input{min-height:44px;font-size:16px;padding:6px}
.mv-hueco span[onclick],.mv-nota span[onclick]{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px}
.mv-thumb .x{width:44px;height:44px;line-height:44px;top:0;right:0;border-radius:0 10px 0 10px;background:rgba(0,0,0,.45)}
@media(max-width:820px){
  .apage{padding:18px 14px}
  .page-title{font-size:26px}
  .modal{width:100%;max-width:100%;max-height:94vh;border-radius:14px 14px 0 0;padding:20px 16px;align-self:flex-end}
  .modal-bg{align-items:flex-end}
  .modal-lg{max-width:100%}
  .caso-card-top,.caso-card-mid{gap:8px}
  .accion-btn{margin-left:0}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat-val{font-size:26px}
  .demo-panel{bottom:72px;right:8px;left:8px;max-width:none;border-radius:10px}
  .demo-panel.col{left:auto}
  .cfg-row>label{flex:1 1 100%}
  .ctrl-row>*{max-width:100%}
  .bar2{min-width:120px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;white-space:nowrap}
  .ficha-tabs{overflow-x:auto;flex-wrap:nowrap}
  .urg-box{padding:12px}
  .mn-btn{min-width:44px;min-height:44px;padding:4px 2px;font-size:9px}
  .abtn{min-height:40px}
}
@media(max-width:480px){
  .mv-body{padding:14px 12px 110px}
  .mv-q{font-size:24px}
  .mv-med-grid{grid-template-columns:1fr 1fr 1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
  .login-card{width:calc(100% - 28px);padding:32px 22px}
}

.disp-fr{flex-wrap:wrap}
.disp-dia{flex-wrap:wrap}
.disp-inp,.disp-fr select,.disp-fr input{max-width:100%;min-width:0}
.inl-field input,.inl-field select{min-width:0}
@media(max-width:820px){
  .inl-field{flex-wrap:wrap}
  .inl-field label{min-width:100%}
  .disp-dia .dd-n{min-width:100%}
  .modal input,.modal select,.modal textarea{max-width:100%}
}

.mv-lin{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px}
.mv-lin>input{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;margin-bottom:8px}
.mv-lin-row{display:grid;grid-template-columns:1fr 1fr 1.2fr auto auto;gap:6px;align-items:end}
.mv-lin-row label{font-size:11px;color:var(--muted);display:block}
.mv-lin-row label input{width:100%;padding:8px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-family:inherit;text-align:right;margin-top:2px}
.mv-lin-sub{display:flex;flex-direction:column;align-items:flex-end;font-size:14px;padding-bottom:6px}
.mv-lin-sub small{font-size:10px;color:var(--muted)}
.obra-card .badge{align-self:flex-start;height:fit-content}
@media(max-width:480px){.mv-lin-row{grid-template-columns:1fr 1fr auto auto}.mv-lin-sub{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center;order:5}}

/* ── V2: mensajes, notificaciones, adjuntos y cobros por confirmar ── */
.nav-bubble{margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.nav-bubble.mnb{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;font-size:9px;padding:0 4px}
.mn-btn{position:relative}
.adj-chip{display:inline-flex;align-items:center;gap:6px;max-width:210px;padding:3px 8px 3px 3px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:11px;cursor:pointer;color:var(--ink)}
.adj-chip img{width:44px;height:34px;object-fit:cover;border-radius:5px;display:block}
.adj-chip.grande img{width:90px;height:68px}
.adj-chip .adj-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.adj-chip .adj-pdf{width:44px;height:34px;border-radius:5px;background:#f8e0e0;color:#a03030;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.adj-chip.off{opacity:.55;cursor:default}
.adj-mov{text-decoration:none;font-size:14px}
.visor{background:#222;border-radius:10px;padding:8px;max-height:60vh;overflow:auto;text-align:center}
.visor img{max-width:100%;max-height:52vh;cursor:zoom-in}.visor img.zoom{max-width:none;max-height:none;cursor:zoom-out}
.visor iframe{width:100%;height:52vh;border:0;background:#fff}
.aviso-pago{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:8px 0;background:#fff}
.ap-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ap-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.msg-layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:start}
.conv-list{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow-y:auto}
.conv-item{text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:block;width:100%;cursor:pointer;font-family:inherit}
.conv-item:hover{border-color:var(--accent)}.conv-item.sel{border-color:var(--accent);background:#fff7ef}
.conv-item.nuevo .conv-top b{color:var(--accent-dark,#a9561a)}
.conv-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.conv-n{background:var(--accent);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.conv-sub{font-size:11px;color:var(--muted);margin-top:2px}.conv-last{font-size:12px;margin-top:4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.conv-fecha{font-size:10px;color:var(--muted);margin-top:2px}

// 4.1 — Zona geográfica según código postal
function zonaDeCp(cp, cfg){
  const c = String(cp||''); const tramos = cfg.zonaTramos || {};
  for (const [zona, prefijos] of Object.entries(tramos))
    if ((prefijos||[]).some(p => c.startsWith(p))) return zona;
  return 'fuera';
}

// 4.2 — Importe de la visita técnica
function importeVisita(caso, cfg){
  if (!cfg.visita || !cfg.visita.cobra) return 0;
  const zona = zonaDeCp(caso.vivienda?.cp, cfg);
  const m = cfg.visita.importePorZona || {};
  return m[zona] != null ? m[zona] : 0;
}

// 4.3 — Totales de una lista de líneas (redondeo en cada paso)
function calcularTotales(lineas, ivaPct, margenPct, minimo){
  const subtotal = r((lineas||[]).reduce((s,l) => s + (l.subtotal != null ? l.subtotal : r((l.cantidad||0)*(l.precio||0))), 0));
  const margen   = r(subtotal * (margenPct||0) / 100);
  const base     = r(subtotal + margen);
  const iva      = r(base * (ivaPct||0) / 100);
  let total      = r(base + iva);
  const minimoAplicado = !!minimo && total < minimo;
  if (minimoAplicado) total = r(minimo);
  return { subtotal, margen, base, iva, total, minimoAplicado };
}

// 4.4 — Incertidumbre del caso → nivel baja/media/alta
function calcularIncertidumbre(caso){
  let pts = 0; const v = caso.vivienda||{}, s = caso.solicitud||{};
  if (['<1980','desconocida'].includes(v.antiguedad)) pts++;
  if (v.humedades) pts++;
  if (!((s.fotosCliente||[]).length > 0)) pts++;
  const trabajos = (s.espacios||[]).flatMap(e => (e.trabajos||[]).map(t => t.key||t));
  if (trabajos.some(k => ['demolicion','demolicion_completa','tirar_pared','demolicion_integral'].includes(k))) pts++;
  if (trabajos.some(k => ['fontaneria_bano','electricidad_vivienda','instalacion_caldera'].includes(k))) pts++;
  const nivel = pts <= 1 ? 'baja' : pts <= 3 ? 'media' : 'alta';
  return { pts, nivel };
}

// 4.5 — Horquilla (banda) alrededor de un total según incertidumbre
// R-03: porcentaje fijo configurable (horquillaV1Pct, 5 % por defecto). El nivel de incertidumbre queda como etiqueta informativa.
function calcularHorquilla(total, nivel, pct){
  const p = pct != null ? Number(pct) : horquillaPct(cfgActual()); const w = p / 100;
  return { lo: r(total * (1 - w)), hi: r(total * (1 + w)), w, nivel: nivel || null };
}

// 4.6 — Puntuación de calidad del caso (0-100) con 7 factores
function scoreCalidad(caso, cfg){
  const v = caso.vivienda||{}, s = caso.solicitud||{};
  const pesos = cfg.pesosCalidad || [25,20,15,15,10,10,5];
  const v1 = (caso.versiones||[]).find(x => x.tipo === 'estimacion') || (caso.versiones||[])[0];
  const lo = v1?.totales?.lo || 0, hi = v1?.totales?.hi || 0;
  const mid = (lo + hi) / 2;
  const minUtil = cfg.importeMinimoUtil || 2000;

  // F1 Importe
  const ratio = minUtil > 0 ? mid / minUtil : 0;
  const fImporte = ratio <= 0 ? 0 : ratio >= 3 ? 1 : ratio >= 1 ? (0.4 + 0.6*(ratio-1)/2) : (0.4*ratio);
  // F2 Completitud
  const fCliente = caso.clienteId ? 0.3 : 0;
  const nFotos = (s.fotosCliente||[]).length;
  const fFotos = nFotos === 0 ? 0 : nFotos <= 2 ? 0.3 : 0.5;
  const fPreg = (v.tipo && v.antiguedad && v.humedades != null) ? 0.2 : 0;
  const fCompletitud = Math.min(1, fCliente + fFotos + fPreg);
  // F3 Urgencia
  let fUrgencia = 0.13;
  if (v.fechaInicioDeseada){
    const d = diasEntre(hoy(), v.fechaInicioDeseada);
    fUrgencia = d <= 30 ? 1 : d <= 90 ? 0.67 : d <= 180 ? 0.33 : 0.13;
  }
  // F4 Zona
  const zona = zonaDeCp(v.cp, cfg);
  const fZona = zona === 'dentro' ? 1 : zona === 'limite' ? (8/15) : 0;
  // F5 Propietario + comunidad
  const fProp = v.propietario ? 0.6 : 0.2;
  const fComun = ['no_aplica','resuelta'].includes(v.comunidad) ? 0.4 : v.comunidad === 'pendiente' ? 0.1 : 0;
  const fPropiComun = Math.min(1, fProp + fComun);
  // F6 Encaje presupuesto
  const tope = v.topePresupuesto;
  let fEncaje = 0.5;
  if (tope > 0) fEncaje = tope >= hi ? 1 : tope >= lo ? 0.7 : tope >= 0.8*lo ? 0.4 : 0;
  // F7 Tipo de obra
  const tObra = s.tipoObra || '';
  const fTipo = (cfg.tiposQueNoHace||[]).includes(tObra) ? 0 : (cfg.tiposBajoInteres||[]).includes(tObra) ? 0.4 : 1;

  const fs = [fImporte, fCompletitud, fUrgencia, fZona, fPropiComun, fEncaje, fTipo];
  const meta = [
    {id:'importe',     label:'Importe estimado'},
    {id:'completitud', label:'Completitud del pedido'},
    {id:'urgencia',    label:'Urgencia del cliente'},
    {id:'zona',        label:'Zona geográfica'},
    {id:'propietario', label:'Propietario y comunidad'},
    {id:'encaje',      label:'Encaje de presupuesto'},
    {id:'tipo',        label:'Tipo de obra'},
  ];
  const razones = [
    'Punto medio ' + fmtEur0(mid) + ' frente a mínimo útil ' + fmtEur0(minUtil),
    (caso.clienteId?'Contacto completo; ':'') + nFotos + ' foto(s)',
    v.fechaInicioDeseada ? 'Inicio deseado en ' + diasEntre(hoy(), v.fechaInicioDeseada) + ' días' : 'Sin fecha de inicio',
    'Zona ' + zona,
    (v.propietario?'Propietario':'No propietario') + ' · comunidad ' + (v.comunidad||'—'),
    tope > 0 ? 'Tope ' + fmtEur0(tope) + ' frente a ' + fmtEur0(lo) + '–' + fmtEur0(hi) : 'Sin tope declarado',
    'Tipo ' + (tObra||'—')
  ];
  const factores = meta.map((m,i) => ({ id:m.id, label:m.label, max:pesos[i], f:r(fs[i]), puntos:Math.round(pesos[i]*fs[i]), razon:razones[i] }));
  const total = factores.reduce((s,f) => s + f.puntos, 0);

  const etiquetas = [];
  if (nFotos === 0) etiquetas.push({texto:'Sin fotos', tono:'bad'});
  else etiquetas.push({texto:nFotos+' foto'+(nFotos>1?'s':''), tono:'ok'});
  if (v.humedades) etiquetas.push({texto:'Humedades', tono:'warn'});
  if (zona === 'dentro') etiquetas.push({texto:'En zona', tono:'ok'});
  else if (zona === 'limite') etiquetas.push({texto:'Zona límite', tono:'warn'});
  else etiquetas.push({texto:'Fuera de zona', tono:'bad'});
  if (v.comunidad === 'pendiente') etiquetas.push({texto:'Comunidad pendiente', tono:'warn'});
  if (tope > 0 && tope < lo) etiquetas.push({texto:'Tope bajo estimación', tono:'bad'});
  if (v.propietario) etiquetas.push({texto:'Propietario', tono:'neu'});
  if (ratio < 1) etiquetas.push({texto:'Importe bajo', tono:'warn'});
  if (clienteActuoDesde(caso)) etiquetas.push({texto:'Cliente respondió', tono:'ok'});
  const trabsAll = (s.espacios||[]).flatMap(e => (e.trabajos||[]).map(t => t.key||t));
  if (trabsAll.length && !trabsAll.some(k => TRABAJOS_COMPLEJOS.includes(k)) && ratio >= 1) etiquetas.push({texto:'Obra sencilla', tono:'neu'});

  return { total, factores, etiquetas };
}

// Helpers de actividad del cliente
const TRABAJOS_COMPLEJOS = ['demolicion','demolicion_completa','tirar_pared','demolicion_integral','fontaneria_bano','electricidad_vivienda','instalacion_caldera'];
function ultimaAccionReformista(caso){ const evs = caso.eventos||[]; for (let i = evs.length-1; i >= 0; i--) if (evs[i].autor === 'reformista') return i; return -1; }
function clienteActuoDesde(caso){ const evs = caso.eventos||[]; return evs.slice(ultimaAccionReformista(caso) + 1).some(e => e.autor === 'cliente'); }
function fechaUltimaRespuesta(caso){ const evs = (caso.eventos||[]).filter(e => e.autor === 'cliente'); return evs.length ? evs[evs.length-1].fecha : null; }

// 4.7 — Puntuación de prioridad (0-100) = espera + calidad + actividad
function scorePrioridad(caso, cfg, ahora){
  ahora = ahora || hoy();
  const plazo = cfg.plazoRespuestaHoras || 48;
  let desde = caso.creadoAt || (caso.eventos||[])[0]?.fecha || ahora;
  if (caso.estado === 'esperando_info' && clienteActuoDesde(caso)) desde = fechaUltimaRespuesta(caso) || desde;
  else if (!['recibida','en_triaje'].includes(caso.estado)){ const ult = (caso.eventos||[]).slice(-1)[0]; if (ult) desde = ult.fecha; }
  const horas = Math.max(0, horasEntre(desde, ahora));
  const espera = Math.round(Math.min(horas / plazo, 1) * 50);
  const sc = scoreCalidad(caso, cfg);
  const calidad = Math.round(sc.total * 0.30);
  const actividad = clienteActuoDesde(caso) ? 20 : 0;
  const total = espera + calidad + actividad;
  const u = cfg.umbralesPrioridad || {hoy:60, pronto:40};
  const nivel = total >= u.hoy ? 'Atender hoy' : total >= u.pronto ? 'Pronto' : 'Sin prisa';
  return { total, espera, calidad, actividad, nivel, horasEspera: Math.round(horas) };
}

// 4.8 — Acción sugerida (orden de evaluación del spec 6.6)
function accionSugerida(caso, cfg){
  const v = caso.vivienda||{}, s = caso.solicitud||{};
  const zona = zonaDeCp(v.cp, cfg);
  const sc = scoreCalidad(caso, cfg);
  const ver = (caso.versiones||[]).find(x => x.estado === 'vigente') || (caso.versiones||[])[0];
  const hi = ver ? rangoVersion(ver).hi : 0; // R-03: V2 en adelante es exacta (hi = total)
  const nFotos = (s.fotosCliente||[]).length + (caso.visita?.fotos||[]).length;
  const inc = calcularIncertidumbre(caso);
  if (zona === 'fuera') return { id:'revisar_descarte', label:'Revisar descarte', motivo:'La vivienda está fuera de tu zona de trabajo.' };
  if (sc.total < 30) return { id:'revisar_descarte', label:'Revisar descarte', motivo:'Calidad del pedido muy baja (' + sc.total + '/100).' };
  if (hi < (cfg.importeMinimoUtil||2000)) return { id:'revisar_descarte', label:'Revisar descarte', motivo:'El importe máximo estimado (' + fmtEur0(hi) + ') queda por debajo del mínimo útil.' };
  if (nFotos === 0) return { id:'pedir_info', label:'Pedir fotos o más info', motivo: v.humedades ? 'Declara humedades y no hay ninguna foto.' : 'No hay fotos para valorar el estado.' };
  if (inc.nivel === 'alta') return { id:'pedir_info', label:'Pedir fotos o más info', motivo:'La incertidumbre es alta: conviene aclarar antes de presupuestar.' };
  const sv = cfg.sinVisita || { tipos:[], hiMax:3000, fotosMin:2 };
  const trabs = (s.espacios||[]).flatMap(e => (e.trabajos||[]).map(t => t.key||t));
  if ((sv.tipos||[]).includes(s.tipoObra) && !trabs.some(k => TRABAJOS_COMPLEJOS.includes(k)) && hi <= sv.hiMax && nFotos >= sv.fotosMin)
    return { id:'presupuesto_sin_visita', label:'Presupuesto sin visita', motivo:'Obra sencilla, importe ≤ ' + fmtEur0(sv.hiMax) + ' y ' + nFotos + ' fotos: puedes presupuestar sin visitar.' };
  return { id:'proponer_visita', label:'Proponer visita', motivo:'Hace falta ver la vivienda para presupuestar con fiabilidad.' };
}

    en_visita:{ id:'cerrar_visita', label:'Cerrar visita y enviar presupuesto', motivo:'La visita está en curso o pendiente de cerrar.' },
    propuesta_enviada:{ id:'seguimiento', label:'Hacer seguimiento', motivo:'Hay una propuesta vigente esperando respuesta.' },
    aceptada:{ id:'iniciar_obra', label:'Iniciar obra', motivo:'La propuesta está aceptada y la obra no ha empezado.' },
    en_obra:{ id:'supervisar', label:'Supervisar la obra', motivo:'Obra en curso: revisa hitos, cambios y cobros.' },
    terminada:{ id:'abrir_remates', label:'Abrir remates', motivo:'Obra terminada: pasa a la fase de remates.' },
    en_remates:{ id:'esperar_conformidad', label:'Esperar la conformidad del cliente', motivo:'Resuelve los remates; solo el cliente puede dar la conformidad y cerrar la obra.' },
    cerrada:{ id:'cobrar', label:(eco && eco.saldo > 0) ? 'Reclamar saldo pendiente' : 'Archivar', motivo:(eco && eco.saldo > 0) ? 'Obra cerrada con ' + fmtEur(eco.saldo) + ' pendientes de cobro.' : 'Todo cobrado y cerrado.' },
    en_pausa:{ id:'reactivar', label:'Reactivar o archivar', motivo:'El caso está en pausa.' },
    caducada:{ id:'renovar', label:'Renovar o archivar', motivo:'La propuesta caducó.' },
    rechazada:{ id:'renegociar', label:'Renegociar o archivar', motivo:'El cliente rechazó la propuesta.' },
    descartada:{ id:'archivar', label:'Archivar o reabrir', motivo:'Caso descartado.' },
  };
  return mapa[e] || { id:'ninguna', label:'—', motivo:'' };

// 4.9 — Transiciones permitidas
const TRANSICIONES = {
  recibida:          ['en_triaje'],
  en_triaje:         ['esperando_info','visita_propuesta','propuesta_enviada','descartada'],
  esperando_info:    ['en_triaje','en_pausa','descartada'],
  visita_propuesta:  ['visita_confirmada','en_pausa','descartada'],
  visita_confirmada: ['en_visita','visita_propuesta'],
  en_visita:         ['propuesta_enviada','descartada'],
  propuesta_enviada: ['aceptada','rechazada','caducada','propuesta_enviada'],
  caducada:          ['propuesta_enviada','archivada'],
  rechazada:         ['propuesta_enviada','archivada'],
  aceptada:          ['en_obra'],
  en_obra:           ['terminada'],
  terminada:         ['en_remates'],
  en_remates:        ['cerrada'],
  cerrada:           ['archivada'],
  en_pausa:          ['archivada'],
  descartada:        ['en_triaje','archivada'],
  archivada:         [],
};
function puedeTransitar(caso, hacia){
  const de = caso.estado; if (!de) return false;
  if (de === 'en_pausa' && caso.estadoPrevio && hacia === caso.estadoPrevio) return true; // reactivar
  const validas = TRANSICIONES[de] || [];
  if (!validas.includes(hacia)) return false;
  if (hacia === 'archivada' && ['en_obra','terminada','en_remates'].includes(de)) return false;
  if (de === 'en_obra' && hacia === 'terminada'){
    if (cambiosPendientes(caso).length > 0) return false; // no terminar la obra con cambios sin consolidar
  }
  return true;
}
function transitar(caso, hacia, opciones){
  opciones = opciones || {};
  if (!puedeTransitar(caso, hacia)) throw new Error('Transición no permitida: ' + caso.estado + ' → ' + hacia);
  if (hacia === 'cerrada' && opciones.autor !== 'cliente') throw new Error('La obra solo se cierra con la conformidad expresa del cliente (R-14)');
  const vieneDePausa = caso.estado === 'en_pausa';
  if (hacia === 'en_pausa') caso.estadoPrevio = caso.estado;
  caso.estado = hacia;
  if (vieneDePausa && hacia !== 'archivada') caso.estadoPrevio = null;
  (caso.eventos = caso.eventos || []).push({
    fecha: opciones.fecha || hoy(), tipo:'transicion',
    texto: opciones.texto || ('Estado → ' + (ESTADO_LABEL[hacia]||hacia)),
    autor: opciones.autor || 'reformista'
  });
  return caso;
}

// 4.10 — Diferencia entre dos versiones
function diffVersiones(a, b){
  const key = l => (l.key||'') + '|' + (l.espacioId||'') + '|' + (l.tipo||'');
  const mapA = new Map((a?.lineas||[]).map(l => [key(l), l]));
  const mapB = new Map((b?.lineas||[]).map(l => [key(l), l]));
  const anyadidas = [...mapB.keys()].filter(k => !mapA.has(k)).map(k => mapB.get(k));
  const quitadas  = [...mapA.keys()].filter(k => !mapB.has(k)).map(k => mapA.get(k));
  const cambiadas = [...mapA.keys()].filter(k => mapB.has(k))
    .filter(k => { const x=mapA.get(k), y=mapB.get(k); return x.precio!==y.precio || x.cantidad!==y.cantidad || x.subtotal!==y.subtotal; })
    .map(k => ({ de: mapA.get(k), a: mapB.get(k) }));
  return { anyadidas, quitadas, cambiadas };
}

// 4.11 — Total vigente (firmado + provisional)
function totalVigente(caso){
  const aceptada = r(caso.aceptacion?.importe || 0);
  const vAcept = (caso.versiones||[]).find(v => v.id === caso.aceptacion?.versionId);
  const ivaPct = ((vAcept?.ivaPct != null ? vAcept.ivaPct : 21)) / 100;
  const adendasFirmadasNeto = r((caso.obra?.adendas||[]).filter(a => a.estado === 'firmada').reduce((s,a) => s + (a.delta||0), 0));
  const adendasFirmadas = r(adendasFirmadasNeto * (1 + ivaPct));
  const firmado = r(aceptada + adendasFirmadas);
  const provisionalNeto = r((caso.obra?.cambios||[]).filter(c => c.estado === 'registrado' || c.estado === 'en_desacuerdo').reduce((s,c) => s + (c.importe||0), 0));
  const provisional = r(provisionalNeto * (1 + ivaPct));
  const total = r(firmado + provisional);
  const desviacionPct = aceptada > 0 ? r((total - aceptada) / aceptada * 100) : 0;
  return { aceptada, adendasFirmadas, provisional, firmado, total, desviacionPct };
}

// 4.12 — Medidas de una estancia
function calcularMedidas(m){
  const largo = m?.largo||0, ancho = m?.ancho||0, alto = m?.alto||0, huecos = m?.huecos||[];
  const m2_suelo = r(largo * ancho), m2_techo = r(largo * ancho);
  const perimetro = r(2 * (largo + ancho));
  const bruto = r(perimetro * alto);
  const descHuecos = r(huecos.reduce((s,h) => s + (h.ancho||0)*(h.alto||0), 0));
  const m2_pared = r(bruto - descHuecos);
  const anchoPuertas = r(huecos.filter(h => h.tipo === 'puerta').reduce((s,h) => s + (h.ancho||0), 0));
  const ml_rodapie = r(perimetro - anchoPuertas);
  return { m2_suelo, m2_techo, m2_pared, ml_rodapie };
}

// 4.13 — Cantidad estimada de una partida (sin medidas reales usa aproximación)
function cantidadEstimada(base, m2, medidas){
  if (base === 'fijo' || base === 'ud') return 1;
  if (medidas){
    if (base === 'm2_suelo') return medidas.m2_suelo;
    if (base === 'm2_techo') return medidas.m2_techo;
    if (base === 'm2_pared') return medidas.m2_pared;
    if (base === 'ml_rodapie') return medidas.ml_rodapie;
  }
  // Aproximación desde m² de suelo
  if (base === 'm2_suelo' || base === 'm2_techo') return r(m2);
  if (base === 'm2_pared') return r(Math.sqrt(m2) * 4 * 2.5); // perímetro aprox × altura
  if (base === 'ml_rodapie') return r(Math.sqrt(m2) * 4 * 0.9);
  return r(m2);
}

// 4.14 — Generar checklist de visita (una pregunta por espacio cuando porEspacio)
function generarChecklist(caso, plantillas){
  plantillas = plantillas || CHECKLIST_PLANTILLAS;
  const espacios = caso.solicitud?.espacios || [];
  const trabajosDe = e => (e.trabajos||[]).map(t => t.key||t);
  const todos = espacios.flatMap(trabajosDe);
  const out = [];
  plantillas.forEach(t => {
    const ap = t.aplicaA || {siempre:true};
    const aplica = e => ap.siempre || (ap.espacios && (!e || ap.espacios.includes(e.tipo))) || (ap.trabajos && ap.trabajos.some(k => e ? trabajosDe(e).includes(k) : todos.includes(k)));
    if (t.porEspacio){
      espacios.forEach(e => { if (aplica(e)) out.push(Object.assign({}, t, { id:t.id+'@'+e.id, tplId:t.id, espacioId:e.id, espacioNombre:e.nombre||e.tipo })); });
    } else if (aplica(null)) out.push(Object.assign({}, t, { id:t.id, tplId:t.id, espacioId:null, espacioNombre:null }));
  });
  return out;
}

// condición de un efecto sobre el valor de la respuesta
function cumpleCondicion(cuando, valor){
  if (!cuando) return valor != null && valor !== '' && valor !== false;
  if (valor == null || valor === '') return false;
  if (cuando.op === 'eq') return String(valor) === String(cuando.valor);
  if (cuando.op === 'true') return valor === true || valor === 'si' || valor === 'true';
  if (cuando.op === 'gt') return Number(valor) > Number(cuando.valor);
  if (cuando.op === 'lt') return Number(valor) < Number(cuando.valor);
  return false;
}

// 4.15 — Recalcular borrador: medidas + efectos del checklist, respetando líneas bloqueadas/manuales
function recalcularBorrador(caso, cfg){
  const vig = (caso.versiones||[]).find(v => v.estado === 'vigente') || (caso.versiones||[]).slice(-1)[0] || {};
  let lineas = ((caso.borrador && caso.borrador.lineas) || vig.lineas || []).map(l => Object.assign({}, l));
  const ivaPct = (caso.borrador && caso.borrador.ivaPct) || vig.ivaPct || cfg.iva;
  const protegida = l => l.bloqueada || l.origen === 'manual';
  const espacios = caso.solicitud?.espacios || [];
  const checks = caso.visita?.checks || {};
  const medidas = caso.visita?.medidas || {};
  const avisos = [];

  // 1. las líneas de checklist se regeneran en cada pasada (salvo las bloqueadas)
  lineas = lineas.filter(l => !(l.origen === 'checklist' && !l.bloqueada));

  // 2. medidas por espacio
  lineas.forEach(l => {
    if (protegida(l)) return;
    const m = medidas[l.espacioId]; if (!m || m.aplicada === false) return;
    l.cantidad = cantidadEstimada(l.base, l.cantidad, calcularMedidas(m));
    l.subtotal = r(l.cantidad * l.precio);
  });

  // 3. efectos del checklist
  const factores = { mo:1, mat:1, extra:1 };
  const items = generarChecklist(caso);
  items.forEach(it => {
    const ck = checks[it.id]; if (!ck) return;
    (it.efectos||[]).forEach(ef => {
      const ok = ef.tipo === 'set_cantidad' ? (ck.valor !== '' && ck.valor != null) : cumpleCondicion(ef.cuando, ck.valor);
      if (!ok) return;
      const esp = espacios.find(e => e.id === it.espacioId);
      if (ef.tipo === 'set_cantidad'){
        const cant = Number(ck.valor); if (!(cant > 0)) return;
        lineas.forEach(l => { if (protegida(l) || l.espacioId !== it.espacioId || l.base !== ef.base) return; l.cantidad = r(cant); l.subtotal = r(l.cantidad * l.precio); });
      } else if (ef.tipo === 'multiplicador'){
        (ef.aplicaA||['mo']).forEach(t => { factores[t] = r((factores[t]||1) * ef.factor); });
      } else if (ef.tipo === 'add_linea'){
        if (lineas.some(l => l.checkId === it.id && l.key === 'chk_' + it.tplId)) return;
        const cant = ef.cantidad === 'm2_espacio' ? (esp ? esp.m2 : 1) : ef.cantidad;
        lineas.push({ id:uid('L'), key:'chk_'+it.tplId, concepto:ef.concepto + (esp ? ' · ' + (esp.nombre||esp.tipo) : ''), espacioId:it.espacioId, unidad:ef.unidad||'ud', base:'fijo', cantidad:cant, precio:ef.precio, subtotal:r(cant*ef.precio), tipo:ef.tipo_linea||'extra', origen:'checklist', bloqueada:false, checkId:it.id });
      } else if (ef.tipo === 'aviso'){
        avisos.push({ texto:ef.texto, checkId:it.id, espacio:it.espacioNombre });
      }
    });
  });

  // 4. multiplicadores sobre el precio base (no se acumulan entre pasadas)
  lineas.forEach(l => {
    if (protegida(l) || l.origen === 'checklist') return;
    const f = factores[l.tipo] || 1;
    if (f !== 1 && l.precioBase == null) l.precioBase = l.precio;
    if (l.precioBase != null){ l.precio = r(l.precioBase * f); l.subtotal = r(l.cantidad * l.precio); if (f === 1) delete l.precioBase; }
  });

  const totales = calcularTotales(lineas, ivaPct, cfg.margen, cfg.minimo);
  const inc = calcularIncertidumbre(caso);
  const hq = calcularHorquilla(totales.total, inc.nivel);
  totales.lo = hq.lo; totales.hi = hq.hi;
  return { lineas, totales, avisos, ivaPct };
}

// 4.16 — Disparadores de adenda (spec 6.10)
function cambiosPendientes(caso){ return (caso.obra?.cambios||[]).filter(c => c.estado === 'registrado' || c.estado === 'en_desacuerdo'); }
function umbralAdendaEur(caso, cfg){
  const base = caso.aceptacion?.importe || (caso.versiones||[]).find(v=>v.estado==='aceptada')?.totales?.total || 0;
  return (cfg.adendaModo === 'eur') ? (cfg.adendaUmbralEur||0) : r(base * (cfg.adendaUmbral||5) / 100);
}
function debeGenerarAdenda(caso, cfg, contexto){
  contexto = contexto || {};
  const triggers = [];
  const pend = cambiosPendientes(caso);
  const ivaPct = ((caso.versiones||[]).find(v => v.id === caso.aceptacion?.versionId)?.ivaPct || 21) / 100;
  if (!pend.length && contexto.contexto !== 'manual') return triggers;
  const importeTotal = caso.aceptacion?.importe || (caso.versiones||[]).find(v=>v.estado==='aceptada')?.totales?.total || 0;
  const suma = r(pend.reduce((s,c) => s + (c.importe||0), 0));
  const um = (cfg.adendaModo === 'eur') ? (cfg.adendaUmbralEur||0) : (importeTotal / (1 + ivaPct) * (cfg.adendaUmbral||5) / 100);
  if (pend.length && suma > 0 && um > 0 && suma >= um) triggers.push('umbral');
  if (pend.some(c => (c.importe||0) >= (cfg.adendaTopeIndividual||1000))) triggers.push('tope');
  if (contexto.contexto === 'hito' && pend.length && cfg.adendaPorHito !== false) triggers.push('hito');
  if (contexto.contexto === 'cobro' && pend.length) triggers.push('cobro');
  if (contexto.contexto === 'manual') triggers.push('manual');
  if (contexto.contexto === 'cierre' && pend.length) triggers.push('cierre');
  if (contexto.solicitudCliente) triggers.push('solicitud_cliente');
  if (pend.some(c => c.bloqueaObra)) triggers.push('bloqueante');
  return triggers;
}

// 4.17 — Progreso de obra (0-1) ponderado por días estimados
function calcularProgreso(caso){
  const hitos = caso.obra?.hitos || [];
  if (!hitos.length) return 0;
  const totalDias = hitos.reduce((s,h) => s + (h.diasEstimados||0), 0);
  if (totalDias === 0) return 0;
  const avance = hitos.reduce((s,h) => s + (h.diasEstimados||0) * (h.estado==='hecho'?1:h.estado==='en_curso'?0.5:0), 0);
  return Math.round(avance / totalDias * 10000) / 10000; // fracción 0-1, 4 decimales
}

// 4.18 — Salud de la obra (spec 6.11)
function saludObra(caso, cfg, ahora){
  ahora = ahora || hoy();
  const cambios = caso.obra?.cambios || [];
  const pend = cambios.filter(c => c.estado === 'registrado' || c.estado === 'en_desacuerdo');
  const bloq = pend.filter(c => c.bloqueaObra && !c.resuelto);
  if (bloq.length){
    const antiguo = bloq.reduce((m,c) => new Date(c.fecha) < new Date(m.fecha) ? c : m);
    if (horasEntre(antiguo.fecha, ahora) > 24) return 'bloqueada';
    return 'en_riesgo';
  }
  const hitos = caso.obra?.hitos || [];
  if (hitos.some(h => h.estado !== 'hecho' && (h.fechaFinPrevista || h.fechaPrevista) && diasEntre(h.fechaFinPrevista || h.fechaPrevista, ahora) > 0)) return 'en_riesgo';
  if (caso.aceptacion){
    const tv = totalVigente(caso); const um = (cfg.adendaModo === 'eur') ? null : (cfg.adendaUmbral || 5);
    if (um && tv.desviacionPct >= um * 0.8 && pend.length) return 'en_riesgo';
  }
  if (pend.some(c => c.fecha && diasEntre(c.fecha, ahora) > 7)) return 'en_riesgo';
  return 'al_dia';
}

// 4.19 — Cobros / saldo / estado económico
function cobrosDeCaso(caso, cobros){ return (cobros||[]).filter(c => c.casoId === caso.id); }
function calcularCobrado(caso, cobros){ return r(cobrosDeCaso(caso, cobros).filter(c => c.estado !== 'anulado').reduce((s,c) => { let imp = c.importe||0; if (c.tipo === 'visita'){ if (c.descontable === false) imp = 0; else if (c.descontablePct != null) imp = r(imp * c.descontablePct / 100); } return s + imp; }, 0)); }
function estadoEconomico(caso, cobros){
  const tv = totalVigente(caso);
  const cobrado = calcularCobrado(caso, cobros);
  const saldo = r(tv.total - cobrado);
  const estado = cobrado <= 0 ? 'pendiente' : saldo <= 0 ? 'cobrado' : 'parcial';
  return { total: tv.total, cobrado, saldo, estado };
}

// 4.20 — Evaluar relojes (spec 6.13): recordatorios debidos y acciones automáticas
function recordatorioEnviado(caso, fase, n){ return (caso.recordatorios||[]).some(x => x.fase === fase && x.n === n && x.enviadoAt); }
function evaluarRelojes(caso, cfg, ahora){
  ahora = ahora || hoy();
  const out = [];
  const ultTrans = [...(caso.eventos||[])].reverse().find(e => e.tipo === 'transicion');
  const desdeFase = ultTrans?.fecha || caso.creadoAt || ahora;
  const pausaDias = cfg.diasPausaAuto || 8; const rl = Object.assign({ recordatorio1:2, recordatorio2:5, propuesta1:3, propuesta2:7, avisoCaducidad:5 }, cfg.relojes || {});
  const faseCliente = (fase, texto, concepto) => {
    const dias = diasEntre(desdeFase, ahora);
    if (dias >= pausaDias) out.push({ tipo:'pausa', fase, texto:'Sin respuesta tras ' + dias + ' días. Se pausa automáticamente.', accion:'transitar_a_pausa' });
    else {
      const n = dias >= rl.recordatorio2 ? 2 : dias >= rl.recordatorio1 ? 1 : 0;
      if (n && !recordatorioEnviado(caso, fase, n)) out.push({ tipo:'recordatorio', fase, n, ultimo:n===2, concepto, texto:'Recordatorio ' + n + '/2: ' + texto + ' (día ' + dias + ').', accion:'enviar_recordatorio' });
    }
  };
  if (caso.estado === 'esperando_info' && !clienteActuoDesde(caso)) faseCliente('esperando_info', 'el cliente no ha enviado lo pedido', 'enviarnos la información pendiente');
  if (caso.estado === 'visita_propuesta') faseCliente('visita_propuesta', 'el cliente no ha elegido franja de visita', 'elegir el día de la visita');
  if (caso.estado === 'propuesta_enviada'){
    const v = (caso.versiones||[]).find(x => x.estado === 'vigente') || (caso.versiones||[]).slice(-1)[0];
    if (v?.enviadaAt){
      const dias = diasEntre(v.enviadaAt, ahora); const validez = cfg.validezDias || 30;
      if (dias >= validez) out.push({ tipo:'caducidad', fase:'propuesta_enviada', texto:'Propuesta enviada hace ' + dias + ' días (validez ' + validez + '). Caducada.', accion:'marcar_caducada' });
      else {
        if (dias >= validez - rl.avisoCaducidad) out.push({ tipo:'aviso_caducidad', fase:'propuesta_enviada', texto:'La propuesta caduca en ' + (validez - dias) + ' días.', accion:'recordar_caducidad' });
        const n = dias >= rl.propuesta2 ? 2 : dias >= rl.propuesta1 ? 1 : 0;
        if (n && !recordatorioEnviado(caso, 'propuesta_enviada', n)) out.push({ tipo:'recordatorio', fase:'propuesta_enviada', n, ultimo:n===2, concepto:'revisar tu presupuesto', texto:'Recordatorio ' + n + '/2 de propuesta enviada (día ' + dias + ').', accion:'enviar_recordatorio' });
      }
    }
  }
  if (caso.estado === 'visita_confirmada' && caso.visita?.elegida?.fecha){
    const d = diasEntre(ahora, caso.visita.elegida.fecha);
    if (d === 1) out.push({ tipo:'recordatorio_visita', fase:'visita_confirmada', texto:'La visita es mañana. Recordar al cliente.', accion:'recordar_visita' });
    if (d === 0) out.push({ tipo:'visita_hoy', fase:'visita_confirmada', texto:'La visita es hoy.', accion:'preparar_visita' });
  }
  if (['en_obra','en_remates'].includes(caso.estado)){
    (caso.obra?.cambios||[]).filter(c => c.estado === 'registrado' || c.estado === 'en_desacuerdo').forEach(c => {
      const h = horasEntre(c.fecha, ahora);
      if (c.bloqueaObra && !c.resuelto){
        if (h >= 48){ if (!c.partidaPausada) out.push({ tipo:'pausar_partida', fase:'obra', cambioId:c.id, texto:'El cambio ' + c.id + ' bloquea la obra desde hace ' + Math.round(h) + ' h: partida pausada pendiente de aprobación.', accion:'pausar_partida' }); else out.push({ tipo:'cambio_bloqueante', fase:'obra', cambioId:c.id, n:2, texto:'Cambio bloqueante ' + c.id + ' sin resolver (' + Math.round(h) + ' h).', accion:'recordar_cambio' }); }
        else if (h >= 24) out.push({ tipo:'cambio_bloqueante', fase:'obra', cambioId:c.id, n:1, texto:'El cambio ' + c.id + ' bloquea la obra (24 h sin resolver).', accion:'recordar_cambio' });
      } else if (h >= 72 && Math.floor(h/72) > (c.recordatoriosEnviados||0)) out.push({ tipo:'cambio_pendiente', fase:'obra', cambioId:c.id, texto:'Cambio ' + c.id + ' sin consolidar desde hace ' + Math.round(h/24) + ' días: impide terminar la obra.', accion:'recordar_cambio' });
    });
    (caso.obra?.solicitudesCambio||[]).filter(sc => sc.estado === 'abierta').forEach(sc => out.push({ tipo:'solicitud_cambio', fase:'obra', texto:'Solicitud de cambio del cliente sin valorar: «' + sc.texto + '»', accion:'valorar_solicitud' }));
  }
  if (caso.estado === 'en_remates' && caso.obra?.cierre?.terminadaAt){
    const plazo = cfg.rematesPlazoDias || 7; const d = diasEntre(caso.obra.cierre.terminadaAt, ahora);
    if (d >= plazo && !caso.obra.cierre.conformidad) out.push({ tipo:'reclamar_conformidad', fase:'remates', texto:'Pasaron ' + d + ' días desde la entrega (plazo de reclamación: ' + plazo + '): reclama la conformidad al cliente. Nunca se cierra sola.', accion:'reclamar_conformidad' });
  }
  // R-07: reserva del hueco de visita a la espera del justificante (recordar primero, liberar al vencer)
  if (caso.estado === 'visita_confirmada' && caso.visita?.cobro?.estado === 'pendiente_pago'){
    const rs = estadoReserva(caso, ahoraMs());
    if (rs.vencida) out.push({ tipo:'reserva_vencida', fase:'visita_confirmada', texto:'Venció la reserva de la visita sin justificante de pago: se libera el hueco.', accion:'liberar_reserva' });
    else if (rs.recordar) out.push({ tipo:'reserva_pago', fase:'visita_confirmada', n:1, texto:'La reserva de la visita vence en ' + Math.round(rs.restanteHoras) + ' h y falta el justificante: recuérdaselo al cliente.', accion:'recordar_pago' });
  }
  return out;
}

const MS_HORA = 3600000, MS_DIA = 86400000;

// ── R-03 · Horquilla ───────────────────────────────────
const HORQUILLA_V1_DEF = 5;
function horquillaPct(cfg){ const p = cfg && cfg.horquillaV1Pct; return (p != null && p !== '' && isFinite(p) && Number(p) >= 0) ? Number(p) : HORQUILLA_V1_DEF; }

// ── R-08 · Validación de documentos (apéndice B) ───────
const LETRAS_DNI = 'TRWAGMYFPDXBNJZSQVHLCKE';
function normDoc(s){ return String(s == null ? '' : s).toUpperCase().replace(/[\s\-.]/g, ''); }
function validarDNI(s){ const m = /^(\d{8})([A-Z])$/.exec(normDoc(s)); return !!m && LETRAS_DNI[parseInt(m[1], 10) % 23] === m[2]; }
function validarNIE(s){ const m = /^([XYZ])(\d{7})([A-Z])$/.exec(normDoc(s)); if (!m) return false; const n = parseInt({ X:'0', Y:'1', Z:'2' }[m[1]] + m[2], 10); return LETRAS_DNI[n % 23] === m[3]; }
function validarCIF(s){
  const m = /^([A-HJNPQRSUVW])(\d{7})([0-9A-J])$/.exec(normDoc(s)); if (!m) return false;
  let par = 0, imp = 0;
  for (let i = 0; i < 7; i++){ const n = +m[2][i]; if (i % 2 === 0){ const x = n * 2; imp += Math.floor(x / 10) + x % 10; } else par += n; }
  const c = (10 - ((par + imp) % 10)) % 10, letra = 'JABCDEFGHI'[c];
  if ('PQRSNW'.includes(m[1])) return m[3] === letra;

  return m[3] === String(c) || m[3] === letra;
}
function validarNIF(tipo, valor){ return tipo === 'empresa' ? validarCIF(valor) : (validarDNI(valor) || validarNIE(valor)); }
function cpValido(cp){ const c = String(cp == null ? '' : cp).trim(); if (!/^\d{5}$/.test(c)) return false; const p = parseInt(c.slice(0, 2), 10); return p >= 1 && p <= 52; }
function normNombre(s){ return String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
function compararNombres(a, b){ const x = normNombre(a), y = normNombre(b); return !!x && x === y; }
function nombreCompletoValido(n){ return normNombre(n).split(' ').filter(p => p.length >= 2).length >= 2; }

// ── R-04 · Datos de la vivienda ────────────────────────
const VIV_OBL_DEF = ['ubicacion','regimen','anioConstruccion','inicio','habitada'];
const VIV_ETIQ = { ubicacion:'ubicación exacta', regimen:'propietario o inquilino', permiso:'permiso del propietario', anioConstruccion:'año de construcción', inicio:'fecha deseada de inicio', habitada:'si vivirás en la casa durante la obra' };
function nuevoDatosVivienda(caso){
  const v = (caso && caso.vivienda) || {};
  return { ubicacion:{ calle:'', numero:'', piso:'', puerta:'', cp:v.cp || '', localidad:'' }, regimen:null, permisoPropietario:false, permisoDocId:null, contactoPropietario:'',
    anioConstruccion:null, anioDesconocido:false, inicio:null, inicioSinFecha:false, habitada:null, fotosExtra:[], comentarios:'', comunidad:null, completos:false };
}
function evaluarDatosVivienda(caso, cfg, hoyStr){

  const esPiso = ((caso && caso.vivienda && caso.vivienda.tipo) || 'piso') === 'piso';
  const obl = (cfg && cfg.viviendaObligatorios) || VIV_OBL_DEF;
  const u = dv.ubicacion || {}; const anioMax = new Date(hoyStr ? hoyStr : hoy()).getFullYear();
  const ok = {};
  ok.ubicacion = !!(String(u.calle || '').trim() && String(u.numero || '').trim() && cpValido(u.cp) && String(u.localidad || '').trim() && (!esPiso || (String(u.piso || '').trim() && String(u.puerta || '').trim())));
  const regSel = ['propietario','inquilino'].includes(dv.regimen);
  ok.regimen = regSel && (dv.regimen !== 'inquilino' || dv.permisoPropietario === true);
  const an = Number(dv.anioConstruccion);
  ok.anioConstruccion = dv.anioDesconocido === true || (Number.isInteger(an) && an >= 1800 && an <= anioMax);
  ok.inicio = dv.inicioSinFecha === true || !!dv.inicio;
  ok.habitada = ['si','no','parcialmente'].includes(dv.habitada);
  const items = [];
  Object.keys(VIV_ETIQ).filter(k => k !== 'permiso').forEach(k => { items.push({ id:k, label:VIV_ETIQ[k], obl:obl.includes(k), ok:!!ok[k] }); });
  const faltan = [];
  obl.forEach(k => {
    if (ok[k]) return;

    else faltan.push({ id:k, texto:VIV_ETIQ[k], accion:'completar_vivienda' });
  });

// Valida un cambio parcial de campos y devuelve los errores (la fecha de inicio no puede ser anterior a hoy)
function validarCamposVivienda(campos, hoyStr){
  const e = {}; campos = campos || {}; const h = hoyStr || hoy(); const anioMax = new Date(h).getFullYear();
  if (campos.ubicacion && campos.ubicacion.cp && !cpValido(campos.ubicacion.cp)) e.cp = 'Código postal no válido.';
  if (campos.anioConstruccion != null && campos.anioConstruccion !== '' && !campos.anioDesconocido){ const n = Number(campos.anioConstruccion); if (!(Number.isInteger(n) && n >= 1800 && n <= anioMax)) e.anioConstruccion = 'Indica un año entre 1800 y ' + anioMax + '.'; }
  if (campos.inicio && !campos.inicioSinFecha && campos.inicio < h) e.inicio = 'La fecha de inicio no puede ser anterior a hoy.';

}
const ANTIG_DE_ANIO = a => a < 1980 ? '<1980' : a <= 2000 ? '1980-2000' : '>2000';
const COMUN_MAP = { informada:'resuelta', no_hace_falta:'no_aplica', no:'no', no_se:'pendiente' };
function textoDireccion(u){ if (!u) return ''; return [[u.calle, u.numero].filter(Boolean).join(' '), [u.piso, u.puerta].filter(Boolean).join(' '), [u.cp, u.localidad].filter(Boolean).join(' ')].filter(Boolean).join(', '); }
// Aplica los campos al caso (merge), recalcula «completos» y vuelca a vivienda.* (alimenta calidad, mapa y agenda)
function aplicarDatosVivienda(caso, campos, cfg){
  const errores = validarCamposVivienda(campos); if (Object.keys(errores).length) return { ok:false, errores };

}
function fusionarDatosVivienda(caso, campos, cfg){
  const dv = caso.datosVivienda = Object.assign(nuevoDatosVivienda(caso), caso.datosVivienda || {});
  Object.keys(campos || {}).forEach(k => { if (k === 'ubicacion') dv.ubicacion = Object.assign({}, dv.ubicacion, campos.ubicacion); else if (k !== 'completos') dv[k] = campos[k]; });

function minDeHora(h){ const p = String(h).split(':'); return (+p[0])*60 + (+p[1]||0); }
function horaDeMin(m){ return String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0'); }
function franjaIni(f){ return minDeHora(String(f.franja).split('-')[0]); }
function franjaFin(f){ return minDeHora(String(f.franja).split('-')[1]); }
function fechaMasDias(ds, n){ const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().split('T')[0]; }
function diaSemana(ds){ return new Date(ds + 'T12:00:00').getDay(); }
function diaBloqueado(ds, cfg){ return ((cfg.agenda && cfg.agenda.bloqueos) || []).find(b => ds >= b.desde && ds <= (b.hasta || b.desde)) || null; }

// visitas confirmadas que ocupan agenda
function visitasOcupadas(casos, excluirId){
  return (casos||[]).filter(c => c.id !== excluirId && c.visita && c.visita.estado === 'confirmada' && c.visita.elegida)
    .map(c => ({ casoId:c.id, fecha:c.visita.elegida.fecha, ini:franjaIni(c.visita.elegida), fin:franjaFin(c.visita.elegida) }));
}

// huecos libres de los próximos nDias según disponibilidad, duración, traslado y visitas ocupadas
function franjasLibres(cfg, casos, desde, nDias, excluirId){
  const dur = cfg.visita.duracionMin, tras = cfg.visita.trasladoMin;
  const ocup = visitasOcupadas(casos, excluirId);
  const out = [];
  for (let i = 0; i < (nDias||14); i++){
    const ds = fechaMasDias(desde, i);
    if (diaBloqueado(ds, cfg)) continue;
    const ventanas = (cfg.agenda.semana && cfg.agenda.semana[diaSemana(ds)]) || [];
    const delDia = ocup.filter(o => o.fecha === ds);
    ventanas.forEach(v => {
      const ini = minDeHora(v[0]), fin = minDeHora(v[1]);
      for (let s = ini; s + dur <= fin; s += dur + tras){
        const choca = delDia.some(o => !(s >= o.fin + tras || s + dur + tras <= o.ini));
        if (!choca) out.push({ fecha:ds, franja:horaDeMin(s) + '-' + horaDeMin(s + dur) });
      }
    });
  }
  return out;
}

// política de reprogramación/cancelación
function politicaReprogramar(caso, cfg, ahora){
  const el = caso.visita && caso.visita.elegida; if (!el) return null;
  const inicio = new Date(el.fecha + 'T' + horaDeMin(franjaIni(el)) + ':00');
  const horas = (inicio - ahora) / 3600000;
  const pol = cfg.visita.politica || { reprogramarGratisHoras:24, tardia:'retiene' };
  const gratis = horas >= pol.reprogramarGratisHoras;
  const pagada = caso.visita.cobro && caso.visita.cobro.estado === 'cobrada';
  let efecto;
  if (gratis) efecto = pagada ? 'Sin coste: se conserva (o reembolsa) el cobro de la visita.' : 'Sin coste para el cliente.';
  else if (pol.tardia === 'retiene') efecto = pagada ? 'Tardía: se retiene el cobro ya hecho y se cobrará de nuevo la nueva visita.' : 'Tardía: se cobrará la visita.';
  else efecto = 'Tardía, pero sin cargo adicional (política flexible).';
  return { gratis, horas: Math.round(horas*10)/10, limite: pol.reprogramarGratisHoras, tardia: pol.tardia, pagada, efecto };
}
