const DIAS_HITO_DEF = [2,3,4,3,3,2,3,2];

// ── Obra: hitos, cambios y adendas ──────────────────────
function replanificarHitos(obra){
  let cur = obra.inicio || hoy();
  (obra.hitos||[]).forEach(h => {
    const dias = Math.max(1, Math.round(h.diasEstimados||1));
    h.fechaInicioPrevista = cur; h.fechaFinPrevista = fechaMasDias(cur, dias); h.fechaPrevista = h.fechaFinPrevista; cur = h.fechaFinPrevista;
  });
  return obra;
}
function iniciarObra(caso, cfg, fechaInicio){
  if (!puedeTransitar(caso, 'en_obra')) throw new Error('La obra solo puede iniciarse desde «Aceptada»');
  caso.obra = caso.obra || {};
  caso.obra.inicio = fechaInicio || hoy();
  caso.obra.hitos = (cfg.hitosTipo||[]).map((n,i) => ({ id:'H'+(i+1), nombre:n, diasEstimados:DIAS_HITO_DEF[i]||3, estado:'pendiente', fechaReal:null, fotos:[] }));
  ['cambios','adendas','fotos','solicitudesCambio','remates'].forEach(k => caso.obra[k] = caso.obra[k] || []);
  replanificarHitos(caso.obra);
  transitar(caso, 'en_obra', { autor:'reformista', texto:'Obra iniciada el ' + fmtFecha(caso.obra.inicio) });
  return caso.obra;
}
function marcarHito(caso, hitoId, estado, opciones){
  opciones = opciones || {};

  h.estado = estado;
  if (estado === 'hecho'){ h.fechaReal = opciones.fecha || hoy(); for (let i=0;i<(opciones.fotos||0);i++) (h.fotos = h.fotos||[]).push({ id:uid('hf'), url:'hito-simulado.jpg', momento:'durante', fecha:h.fechaReal }); }
  else h.fechaReal = null;
  (caso.eventos = caso.eventos||[]).push({ fecha:hoy(), tipo:'obra', texto:'Hito «' + h.nombre + '» → ' + estado.replace('_',' '), autor:'reformista' });
  return h;
}
function nuevoIdSeq(lista, prefijo){ const mx = (lista||[]).reduce((m,x) => Math.max(m, parseInt(String(x.id).replace(/\D/g,''),10)||0), 0); return prefijo + (mx + 1); }
function registrarCambio(caso, d){

function marcarDesacuerdo(caso, cambioId){
  const ch = (caso.obra.cambios||[]).find(x => x.id === cambioId); if (!ch || ch.estado === 'consolidado') return null;
  ch.estado = 'en_desacuerdo'; ch.avisoCliente = Object.assign({}, ch.avisoCliente, { desacuerdo:true });

function resolverDesacuerdo(caso, cambioId, accion, nuevoImporte){

  ch.estado = 'registrado'; ch.avisoCliente = Object.assign({}, ch.avisoCliente, { desacuerdo:false, resueltoAt:hoy() });

function crearAdenda(caso, cambioIds, motivo){
  const cambios = (caso.obra.cambios||[]).filter(c => cambioIds.includes(c.id) && c.estado === 'registrado' && !c.adendaId);
  if (!cambios.length) throw new Error('Selecciona al menos un cambio registrado (los que están en desacuerdo no se pueden incluir)');
  caso.obra.adendas = caso.obra.adendas || [];
  const ad = { id:nuevoIdSeq(caso.obra.adendas,'A'), fecha:hoy(), cambios:cambios.map(c=>c.id), delta:r(cambios.reduce((s,c)=>s+c.importe,0)), estado:'enviada', motivo:motivo||'manual', concepto:'Adenda · ' + cambios.length + ' cambio(s)', enviadaAt:hoy(), firmadaAt:null };
  caso.obra.adendas.push(ad); cambios.forEach(c => c.adendaId = ad.id);
  (caso.eventos = caso.eventos||[]).push({ fecha:hoy(), tipo:'adenda', texto:'Adenda ' + ad.id + ' enviada al cliente (' + fmtEur(ad.delta) + ' sin IVA, motivo: ' + ad.motivo + ')', autor:'reformista' });

function firmarAdenda(caso, adendaId){
  const ad = (caso.obra.adendas||[]).find(a => a.id === adendaId); if (!ad || ad.estado === 'firmada') return null;
  const vivos = ad.cambios.map(id => caso.obra.cambios.find(c => c.id === id)).filter(c => c && c.estado !== 'en_desacuerdo');
  ad.cambios.forEach(id => { const c = caso.obra.cambios.find(x => x.id === id); if (c && c.estado === 'en_desacuerdo') c.adendaId = null; });
  ad.cambios = vivos.map(c => c.id); ad.delta = r(vivos.reduce((s,c) => s + c.importe, 0));
  vivos.forEach(c => c.estado = 'consolidado');
  ad.estado = 'firmada'; ad.firmadaAt = hoy();
  (caso.eventos = caso.eventos||[]).push({ fecha:hoy(), tipo:'adenda', texto:'Adenda ' + ad.id + ' firmada (' + fmtEur(ad.delta) + ' sin IVA); cambios consolidados', autor:'cliente' });

function puedeTerminarObra(caso){
  const pend = cambiosPendientes(caso); const des = pend.filter(c => c.estado === 'en_desacuerdo');
  if (!pend.length) return { ok:true, motivo:'', pendientes:[], desacuerdos:[] };
  const motivo = des.length
    ? 'Hay ' + des.length + ' cambio(s) en desacuerdo (' + des.map(c=>c.id).join(', ') + '): resuélvelos antes de consolidar.'
    : 'Hay ' + pend.length + ' cambio(s) sin consolidar (' + pend.map(c=>c.id).join(', ') + '): genera y firma una adenda de cierre.';
  return { ok:false, motivo, pendientes:pend, desacuerdos:des };

function puedeCerrarObra(caso, cfg, modo){
  const abiertos = (caso.obra?.remates||[]).filter(x => x.estado === 'abierto');
  if (caso.estado !== 'en_remates') return { ok:false, motivo:'La obra debe estar en fase de remates.' };
  if (abiertos.length) return { ok:false, motivo:'Quedan ' + abiertos.length + ' remate(s) abiertos: resuélvelos primero.' };
  // R-14: ya no existe el cierre por plazo; solo la conformidad expresa del cliente cierra la obra
  if (modo === 'plazo') return { ok:false, motivo:'El cierre por plazo ya no existe: la obra solo se cierra con la conformidad expresa del cliente desde su panel.' };
  return { ok:true, motivo:'' };
}

// ── Cobros ──────────────────────────────────────────────
function planCobros(caso, cfg, cobros){
  const base = caso.aceptacion ? caso.aceptacion.importe : 0;
  const pagado = calcularCobrado(caso, cobros);
  const hitos = caso.obra?.hitos || [];
  const entregado = ['terminada','en_remates','cerrada'].includes(caso.estado);
  let acum = 0; const tramos = [];
  (cfg.planCobros||[]).forEach(t => {
    const importe = r(base * t.pct / 100); acum = r(acum + importe);
    let alcanzado = false;
    if (t.cuando === 'aceptacion') alcanzado = !!caso.aceptacion;
    else if (String(t.cuando).startsWith('hito:')) alcanzado = hitos.some(h => h.nombre === String(t.cuando).slice(5) && h.estado === 'hecho');
    else if (t.cuando === 'entrega') alcanzado = entregado;
    const cubierto = pagado + 0.005 >= acum;
    tramos.push({ label:t.label, pct:t.pct, cuando:t.cuando, importe, acumulado:acum, estado: cubierto ? 'cobrado' : (alcanzado ? 'debido' : 'pendiente'), falta: cubierto ? 0 : r(Math.min(importe, acum - pagado)) });
  });
  return tramos;
}
function proximoTramo(caso, cfg, cobros){ return planCobros(caso, cfg, cobros).find(t => t.estado !== 'cobrado') || null; }
function cobrosPendientesDebidos(caso, cfg, cobros){ return planCobros(caso, cfg, cobros).filter(t => t.estado === 'debido'); }

function crearProforma(caso, cobros, numero, fecha){
  const tv = totalVigente(caso); const cobrado = calcularCobrado(caso, cobros);
  const ver = (caso.versiones||[]).find(v => v.id === caso.aceptacion?.versionId); const ivaPct = ver?.ivaPct || 21;
  const base = r(tv.total / (1 + ivaPct/100));
  return { id:'PF-' + String(numero).padStart(4,'0'), numero, casoId:caso.id, clienteId:caso.clienteId, fecha, ivaPct, fiscal: caso.fiscal ? Object.assign({}, caso.fiscal) : null,
    aceptada:tv.aceptada, adendasFirmadas:tv.adendasFirmadas, firmado:tv.firmado, provisional:tv.provisional, total:tv.total, base, iva:r(tv.total - base), cobrado, saldo:r(tv.total - cobrado),
    movimientos: cobrosDeCaso(caso, cobros).filter(c => c.estado !== 'anulado').map(c => ({ fecha:c.fecha, concepto:c.concepto, tipo:c.tipo, importe:c.importe, medio:c.medio, aCuenta:c.tipo === 'visita' })),
    leyenda:'Borrador de factura / proforma — no es una factura', congelada:true };
}
function crearActa(caso, cobros, numero, fecha, cfg){

  const firmadas = (caso.obra?.adendas||[]).filter(a => a.estado === 'firmada');

    inicioObra:caso.obra?.inicio || null, finObra:caso.obra?.cierre?.terminadaAt || null, conformidad: caso.obra?.cierre?.conformidad || null,
    garantiaInicio:fecha, textoGarantia:(cfg && cfg.textoGarantia) || CFG_DEFAULT.textoGarantia,
    documentacion:[ 'Presupuesto aceptado ' + (caso.aceptacion?.versionId||''), ...firmadas.map(a => 'Adenda ' + a.id + ' firmada (' + fmtEur(a.delta) + ' sin IVA)'), (caso.obra?.fotos||[]).length + ' fotografías de la obra', (caso.obra?.remates||[]).length + ' remate(s) gestionados' ] };
}
function csvCelda(v){ return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; }
function cobrosCSV(cobros){

// ── Catálogo: precios, impacto y lista de compra ────────
function precioEfectivo(p){ return p.precioManual != null ? p.precioManual : p.precio; }
function esAbierto(c){ return !['cerrada','archivada','descartada','rechazada','caducada','aceptada','en_obra','terminada','en_remates'].includes(c.estado); }
function impactoCambioPrecio(db, productoId, nuevoPrecio){
  const afectados = [];
  const push = (caso, origen, v, l) => afectados.push({ casoId:caso.id, origen, versionId:v?v.id:null, lineaId:l.id, cantidad:l.cantidad, precioActual:l.precio, precioNuevo:nuevoPrecio, deltaTotal:r((nuevoPrecio - l.precio) * l.cantidad), bloqueada:!!(l.bloqueada || l.origen === 'manual') });
  (db.casos||[]).filter(esAbierto).forEach(caso => {
    (caso.borrador?.lineas||[]).filter(l => l.productoId === productoId && l.tipo === 'mat').forEach(l => push(caso, 'borrador', null, l));
    (caso.versiones||[]).filter(v => !['sustituida','caducada','rechazada','aceptada'].includes(v.estado)).forEach(v => {
      (v.lineas||[]).filter(l => l.productoId === productoId && l.tipo === 'mat').forEach(l => push(caso, v.enviadaAt ? 'enviada' : 'estimacion', v, l));
    });
  });
  const suma = arr => r(arr.reduce((s,a) => s + a.deltaTotal, 0));
  const borr = afectados.filter(a => a.origen !== 'enviada'), env = afectados.filter(a => a.origen === 'enviada');
  return { afectados, deltaAgregado:suma(afectados), nCasos:new Set(afectados.map(a => a.casoId)).size,
    borradores:{ n:new Set(borr.map(a => a.casoId)).size, delta:suma(borr), recalculables:borr.filter(a => !a.bloqueada).length, bloqueadas:borr.filter(a => a.bloqueada).length },
    enviadas:{ n:new Set(env.map(a => a.casoId)).size, delta:suma(env), casos:[...new Set(env.map(a => a.casoId))] } };
}
function aplicarPrecioABorradores(db, productoId, nuevoPrecio){
  let lineas = 0; const casos = new Set();
  const recalcLinea = l => { if (l.productoId !== productoId || l.tipo !== 'mat' || l.bloqueada || l.origen === 'manual') return false; l.precio = nuevoPrecio; l.subtotal = r(l.cantidad * l.precio); return true; };
  (db.casos||[]).filter(esAbierto).forEach(caso => {
    let tocado = false;
    (caso.borrador?.lineas||[]).forEach(l => { if (recalcLinea(l)){ lineas++; tocado = true; } });
    (caso.versiones||[]).filter(v => !['sustituida','caducada','rechazada','aceptada'].includes(v.estado) && !v.enviadaAt).forEach(v => {
      let t = false; (v.lineas||[]).forEach(l => { if (recalcLinea(l)){ lineas++; t = true; } });
      if (t){ const tot = calcularTotales(v.lineas, v.ivaPct, db.cfg.margen, db.cfg.minimo); const hq = calcularHorquilla(tot.total, calcularIncertidumbre(caso).nivel); tot.lo = hq.lo; tot.hi = hq.hi; v.totales = tot; tocado = true; }
    });
    if (tocado) casos.add(caso.id);
  });
  return { lineas, casos:[...casos] };
}
function mermaDe(prod, cfg){ if (prod.merma != null) return prod.merma; const m = cfg && cfg.catalogo && cfg.catalogo.mermaPorCategoria; return (m && m[prod.cat] != null) ? m[prod.cat] : ((cfg && cfg.catalogo && cfg.catalogo.mermaDefecto) != null ? cfg.catalogo.mermaDefecto : 0.05); }
function listaCompra(caso, catalogo, cfg){
  const v = (caso.versiones||[]).find(x => x.id === caso.aceptacion?.versionId) || (caso.versiones||[]).find(x => x.estado === 'vigente') || (caso.versiones||[])[0];
  const mats = (v?.lineas||[]).filter(l => l.tipo === 'mat' && !l.anulada);
  const porProd = {}; let sinVincular = 0;
  mats.forEach(l => { if (l.productoId) porProd[l.productoId] = (porProd[l.productoId]||0) + (l.cantidad||0); else sinVincular++; });
  const grupos = {};
  Object.entries(porProd).forEach(([pid, cant]) => {
    const prod = (catalogo||[]).find(p => p.id === pid); if (!prod) return;
    const merma = mermaDe(prod, cfg); const pack = prod.pack || 1;
    const packs = Math.ceil(Math.round(cant * (1 + merma) / pack * 1e6) / 1e6 - 1e-9);
    const cantidadCompra = r(packs * pack);
    const it = { productoId:pid, nombre:prod.nombre, necesaria:r(cant), merma, pack, packs, unidad:prod.unidad, cantidadCompra, precio:precioEfectivo(prod), subtotal:r(cantidadCompra * precioEfectivo(prod)) };
    (grupos[prod.proveedor||'Sin proveedor'] = grupos[prod.proveedor||'Sin proveedor'] || []).push(it);
  });
  return { grupos:Object.entries(grupos).map(([proveedor, items]) => ({ proveedor, items, total:r(items.reduce((s,i) => s + i.subtotal, 0)) })).sort((a,b) => a.proveedor.localeCompare(b.proveedor)), sinVincular };
}
function anularMaterialesCliente(lineas, espacioIds, margenPct){
  let neto = 0;
  (lineas||[]).forEach(l => {
    if (l.tipo !== 'mat' || l.anulada || (espacioIds && espacioIds.length && !espacioIds.includes(l.espacioId))) return;
    neto = r(neto + l.subtotal);
    l.anulada = true; l.subtotalOriginal = l.subtotal; l.precioOriginal = l.precio; l.precio = 0; l.subtotal = 0; l.bloqueada = true; l.origen = 'manual';
    l.concepto = l.concepto.replace(/ \(aportado por el cliente\)$/, '') + ' (aportado por el cliente)';
  });
  return { ahorroSinMargen:neto, ahorro:r(neto * (1 + (margenPct||0)/100)) };
}

function normTel(t){ return String(t||'').replace(/\D/g,'').replace(/^34(?=\d{9}$)/,''); }
function normEmail(e){ return String(e||'').trim().toLowerCase(); }
function coincideCliente(a, b){ return (normEmail(a.email) && normEmail(a.email) === normEmail(b.email)) || (normTel(a.tel) && normTel(a.tel) === normTel(b.tel)); }
function buscarDuplicado(clientes, datos, excluirId){ return (clientes||[]).find(c => c.id !== excluirId && coincideCliente(c, datos)) || null; }
function detectarDuplicados(clientes){ const pares = []; for (let i = 0; i < clientes.length; i++) for (let j = i + 1; j < clientes.length; j++) if (coincideCliente(clientes[i], clientes[j])) pares.push([clientes[i].id, clientes[j].id]); return pares; }
function unirClientes(db, idMantener, idEliminar){
  const k = db.clientes.find(c => c.id === idMantener), d = db.clientes.find(c => c.id === idEliminar); if (!k || !d || k === d) return null;
  db.casos.forEach(c => { if (c.clienteId === idEliminar) c.clienteId = idMantener; });
  if (d.notas) k.notas = (k.notas ? k.notas + '\n' : '') + d.notas;
  k.whatsappOk = k.whatsappOk || d.whatsappOk;
  db.clientes = db.clientes.filter(c => c.id !== idEliminar);
  return k;
}

function nuevaVersionDesde(caso, tipo){
  const vigente = caso.versiones.find(x=>x.estado==='vigente') || caso.versiones[caso.versiones.length-1];

}
function enviarVersion(caso, version, canal){
  const previa = caso.versiones.find(x=>x.estado==='vigente');
  if (previa){ version.cambiosRespectoAnterior = diffVersiones(previa, version); previa.estado = 'sustituida'; }

      caso.visita.elegida = datos.franja || caso.visita.franjasOfrecidas[0];

    case 'pagar_visita': {
      const a = crearAvisoPago(DB, caso, { tipo:'visita', importe:(caso.visita.cobro && caso.visita.cobro.importe) || importeVisita(caso, DB.cfg), medio:datos.medio, fecha:datos.fecha, adjuntoId:datos.adjuntoId, concepto:'Visita técnica', nota:datos.nota });

      ev('El cliente envía el justificante del pago de la visita (' + fmtEur(a.importe) + ')'); break; }
    case 'avisar_pago': {
      const a = crearAvisoPago(DB, caso, { tipo:'plan', importe:datos.importe, medio:datos.medio, fecha:datos.fecha, tramo:datos.tramo, concepto:datos.tramo || 'Pago del cliente', adjuntoId:datos.adjuntoId, nota:datos.nota });

    case 'firmar_adenda':
      if (datos.id) firmarAdenda(caso, datos.id); break;

      (caso.obra.remates = caso.obra.remates||[]).push({ id:nuevoIdSeq(caso.obra.remates,'R'), texto:datos.texto||'Remate indicado por el cliente', foto:true, estado:'abierto', autor:'cliente' });
      ev('El cliente lista un remate: ' + (datos.texto||'')); break;
    // R-14: la conformidad ya no se registra aquí; solo registrarConformidadCliente() (llamada desde Proto.cli('conformidad'))
    case 'desacuerdo':
      marcarDesacuerdo(caso, datos.id); break;
    case 'confirmar_visita':
      caso.visita.confirmadaCliente = true; ev('El cliente confirma que estará en la visita'); break;
    case 'reprogramar':
      if (datos.franja){ const pol = reprogramarVisita(caso, datos.franja, 'cliente'); ev('El cliente reprograma la visita' + (pol && !pol.gratis ? ' (tardía)' : '')); } break;
    case 'aceptar':
      if (caso.estado === 'propuesta_enviada'){
        const v = caso.versiones.find(x=>x.estado==='vigente');
        let importe = v?.totales?.total || 0;

        caso.aceptacion = { versionId:v?.id, fecha:hoy(), metodo:'enlace', importe: v?.totales?.total||0, descontadoVisita: caso.visita?.cobro?.estado==='cobrada'?(caso.visita.cobro.importe||0):0 };
        if (v) v.estado = 'aceptada';
        transitar(caso,'aceptada',{autor:'cliente',texto:'El cliente aceptó la propuesta ' + (v?.id||'')});
        ev('¡Propuesta aceptada! Importe ' + fmtEur(v?.totales?.total||0));
      } break;
    case 'pedir_cambios':
      (caso.obra.solicitudesCambio = caso.obra.solicitudesCambio||[]).push({ id:nuevoIdSeq(caso.obra.solicitudesCambio,'S'), fecha:hoy(), texto:datos.texto||'El cliente pide cambios en la propuesta', estado:'abierta' });
      ev('El cliente pide cambios: ' + (datos.texto||'(sin detalle)')); break;
    case 'rechazar':
      if (puedeTransitar(caso,'rechazada')){ const v=caso.versiones.find(x=>x.estado==='vigente'); if(v)v.estado='rechazada'; transitar(caso,'rechazada',{autor:'cliente',texto:'Rechazada: '+(datos.motivo||'sin motivo')}); }
      ev('El cliente rechazó la propuesta' + (datos.motivo?': '+datos.motivo:'')); break;
    case 'reactivar':
      if (caso.estado==='en_pausa' && caso.estadoPrevio && puedeTransitar(caso, caso.estadoPrevio)) transitar(caso, caso.estadoPrevio, {autor:'cliente',texto:'Reactivado desde pausa'});
      ev('El cliente reactivó el caso'); break;
    case 'renovar':
      if (caso.estado==='caducada' && puedeTransitar(caso,'propuesta_enviada')){ const nv=nuevaVersionDesde(caso,'renovada'); enviarVersion(caso,nv,'WhatsApp'); transitar(caso,'propuesta_enviada',{autor:'cliente',texto:'Propuesta renovada'}); }
      ev('El cliente pidió renovar la propuesta'); break;
  }
  return caso;
}

function toast(msg, tipo){
  const w = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (tipo === 'err' ? ' err' : '');
  el.textContent = msg; w.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2800);
}
let _focoPrevio = null;
function openModal(bodyHtml, big){
  const bg = document.getElementById('modal-bg'); const yaAbierto = bg.classList.contains('open');
  if (!yaAbierto) _focoPrevio = document.activeElement;
  document.getElementById('main-modal-body').innerHTML = bodyHtml;
  const t = document.querySelector('#main-modal-body .modal-title');
  document.getElementById('main-modal').setAttribute('aria-label', t ? t.textContent.trim() : 'Ventana de detalle');
  document.getElementById('main-modal').classList.toggle('modal-lg', !!big);
  bg.classList.add('open'); if (!yaAbierto) document.getElementById('main-modal').focus();
}
function closeAllModals(){ document.getElementById('modal-bg').classList.remove('open'); document.getElementById('main-modal').classList.remove('modal-lg'); if (_focoPrevio && document.body.contains(_focoPrevio)) { try { _focoPrevio.focus(); } catch(e){} } _focoPrevio = null; }
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('modal-bg').classList.contains('open')) closeAllModals();
  else if (typeof MV !== 'undefined' && MV.id) cerrarModoVisita();
});
function demoPlegar(){ const p = document.getElementById('demo-panel'); p.classList.toggle('col'); document.getElementById('demo-toggle').setAttribute('aria-expanded', String(!p.classList.contains('col'))); }
function clienteDe(caso){ return DB.clientes.find(c => c.id === caso.clienteId) || {nombre:'(sin cliente)', email:'', tel:''}; }
function badgeEstado(estado){ return '<span class="badge b-' + estado + '">' + (ESTADO_LABEL[estado]||estado) + '</span>'; }
function prioChip(nivel){
  const cls = nivel === 'Atender hoy' ? 'hoy' : nivel === 'Pronto' ? 'pronto' : 'espera';
  return '<span class="prio-chip ' + cls + '">' + nivel + '</span>';
}
function scoreBar(score){
  const col = score >= 66 ? 'var(--ok)' : score >= 40 ? 'var(--accent)' : 'var(--muted)';
  return '<div class="score-bar"><div class="score-track"><div class="score-fill" style="width:' + score + '%;background:' + col + '"></div></div><span class="score-val">' + score + '</span></div>';
}
function etiqChips(etiquetas){ return (etiquetas||[]).map(e => '<span class="etiq-chip etiq-' + e.tono + '">' + escH(e.texto) + '</span>').join(''); }
function nombreTipoObra(t){ return ({reforma_integral:'Reforma integral', reforma_bano:'Reforma de baño', reforma_cocina:'Reforma de cocina', reforma_parcial:'Reforma parcial'}[t]) || t || 'Reforma'; }

// SECCIÓN 9: PRESUPUESTOS (bandeja · seguimiento · por estado · archivo)
// ═══════════════════════════════════════════════════════
let presuTab = 'bandeja';
let bandejaSort = 'prioridad';
let bandejaF = { estado:'', zona:'', tipo:'', soloFotos:false, q:'' };
const porqueAbierto = {};

function esperaConRespuesta(caso){
  if (caso.estado !== 'esperando_info') return false;
  const ultTrans = [...(caso.eventos||[])].reverse().find(e=>e.tipo==='transicion' && /esperando/i.test(e.texto||''));
  const desde = ultTrans?.fecha || caso.creadoAt;
  return (caso.eventos||[]).some(e => e.autor==='cliente' && new Date(e.fecha) >= new Date(desde));
}
function enBandeja(caso){ return ['recibida','en_triaje','en_visita'].includes(caso.estado) || esperaConRespuesta(caso); }
function enSeguimiento(caso){ return ['esperando_info','visita_propuesta','visita_confirmada','propuesta_enviada'].includes(caso.estado) && !esperaConRespuesta(caso); }
function enArchivo(caso){ return ['descartada','rechazada','caducada','en_pausa','archivada'].includes(caso.estado); }

RENDERERS.presupuestos = function(){
  const nBandeja = DB.casos.filter(enBandeja).length;
  const nSeg = DB.casos.filter(enSeguimiento).length;
  const nArch = DB.casos.filter(enArchivo).length;
  const tab = (k,l,n) => '<button class="tab ' + (presuTab===k?'active':'') + '" onclick="presuTab=\'' + k + '\';RENDERERS.presupuestos()">' + l + (n!=null?'<span class="tab-n">' + n + '</span>':'') + '</button>';
  let cuerpo = '';
  if (presuTab==='bandeja') cuerpo = cuerpoBandeja();
  else if (presuTab==='seguimiento') cuerpo = cuerpoSeguimiento();
  else if (presuTab==='estado') cuerpo = cuerpoPorEstado();
  else if (presuTab==='archivo') cuerpo = cuerpoArchivo();
  document.getElementById('pg-presupuestos').innerHTML =
    '<div class="page-hdr"><div><div class="page-title">Presupuestos</div><div class="page-sub">Gestión de pedidos y propuestas</div></div></div>' +
    '<div class="tabs">' + tab('bandeja','Bandeja',nBandeja) + tab('seguimiento','Seguimiento',nSeg) + tab('estado','Por estado') + tab('archivo','Archivo',nArch) + '</div>' +
    cuerpo;
};

function cuerpoBandeja(){
  let items = DB.casos.filter(enBandeja).map(c => ({ caso:c, prio:scorePrioridad(c,DB.cfg,hoy()), cal:scoreCalidad(c,DB.cfg) }));
  // filtros
  if (bandejaF.estado) items = items.filter(x=>x.caso.estado===bandejaF.estado);
  if (bandejaF.zona) items = items.filter(x=>zonaDeCp(x.caso.vivienda.cp,DB.cfg)===bandejaF.zona);
  if (bandejaF.tipo) items = items.filter(x=>x.caso.solicitud.tipoObra===bandejaF.tipo);
  if (bandejaF.soloFotos) items = items.filter(x=>(x.caso.solicitud.fotosCliente||[]).length>0);
  if (bandejaF.q){ const q=bandejaF.q.toLowerCase(); items = items.filter(x=>{ const cl=clienteDe(x.caso); return (cl.nombre+' '+cl.zona+' '+x.caso.id+' '+(x.caso.vivienda.direccion||'')).toLowerCase().includes(q); }); }
  // orden
  const sorters = { prioridad:(a,b)=>b.prio.total-a.prio.total, calidad:(a,b)=>b.cal.total-a.cal.total, espera:(a,b)=>b.prio.horasEspera-a.prio.horasEspera, importe:(a,b)=>(b.caso.versiones[0]?.totales?.total||0)-(a.caso.versiones[0]?.totales?.total||0) };
  items.sort(sorters[bandejaSort]||sorters.prioridad);
  const porRevisar = DB.casos.filter(c=>['recibida'].includes(c.estado)).length;

  const selSort = '<select onchange="bandejaSort=this.value;RENDERERS.presupuestos()">' + [['prioridad','Prioridad'],['calidad','Calidad'],['espera','Espera'],['importe','Importe']].map(o=>'<option value="'+o[0]+'"'+(bandejaSort===o[0]?' selected':'')+'>'+o[1]+'</option>').join('') + '</select>';
  const selEstado = '<select onchange="bandejaF.estado=this.value;RENDERERS.presupuestos()"><option value="">Todos los estados</option>' + ['recibida','en_triaje','esperando_info','en_visita'].map(e=>'<option value="'+e+'"'+(bandejaF.estado===e?' selected':'')+'>'+ESTADO_LABEL[e]+'</option>').join('') + '</select>';
  const selZona = '<select onchange="bandejaF.zona=this.value;RENDERERS.presupuestos()"><option value="">Toda zona</option>' + ['dentro','limite','fuera'].map(z=>'<option value="'+z+'"'+(bandejaF.zona===z?' selected':'')+'>'+z+'</option>').join('') + '</select>';
  const selTipo = '<select onchange="bandejaF.tipo=this.value;RENDERERS.presupuestos()"><option value="">Todo tipo</option>' + ['reforma_integral','reforma_bano','reforma_cocina','reforma_parcial'].map(t=>'<option value="'+t+'"'+(bandejaF.tipo===t?' selected':'')+'>'+nombreTipoObra(t)+'</option>').join('') + '</select>';

  return '<div class="ctrl-row">' +
      '<span class="ctrl-lbl">Ordenar</span>' + selSort + selEstado + selZona + selTipo +
      '<label class="ctrl-check"><input type="checkbox"' + (bandejaF.soloFotos?' checked':'') + ' onchange="bandejaF.soloFotos=this.checked;RENDERERS.presupuestos()"> Solo con fotos</label>' +
      '<input type="text" placeholder="Buscar…" value="' + escH(bandejaF.q) + '" oninput="bandejaF.q=this.value;clearTimeout(window._bq);window._bq=setTimeout(RENDERERS.presupuestos,250)">' +
      '<span class="bandeja-count">' + items.length + ' por revisar · ' + porRevisar + ' nuevos</span>' +
    '</div>' +
    (items.length ? items.map(x=>filaBandeja(x.caso, x.prio, x.cal)).join('') : '<div class="section-card" style="text-align:center;color:var(--muted)">Sin casos que coincidan.</div>');
}

function barra2(cal, prio){
  const plazo = DB.cfg.plazoRespuestaHoras;
  const esperaPct = clamp(prio.horasEspera/plazo*100, 0, 100);
  const colEsp = prio.horasEspera>=plazo?'var(--danger)':prio.horasEspera>=plazo*0.6?'var(--amber)':'var(--warm)';
  const colCal = cal.total>=66?'var(--ok)':cal.total>=40?'var(--accent)':'var(--muted)';
  return '<div class="bar2">' +
    '<div class="bar2-line"><span class="bar2-lbl">Calidad ' + cal.total + '</span><div class="bar2-track"><div class="bar2-fill" style="width:' + cal.total + '%;background:' + colCal + '"></div></div></div>' +
    '<div class="bar2-line"><span class="bar2-lbl">Espera ' + prio.horasEspera + 'h/' + plazo + 'h</span><div class="bar2-track"><div class="bar2-fill" style="width:' + esperaPct + '%;background:' + colEsp + '"></div></div></div>' +
  '</div>';
}
function porqueHtml(caso, cal, prio){
  const facs = cal.factores.map(f=>'<div class="pq-factor"><span class="pq-lbl">' + f.label + '</span><div class="pq-bar"><div style="width:' + (f.puntos/f.max*100) + '%"></div></div><span class="pq-pts">' + f.puntos + '/' + f.max + '</span></div>').join('');
  const comps = [['Espera',prio.espera,50],['Calidad (×0,3)',prio.calidad,30],['Actividad',prio.actividad,20]].map(c=>'<div class="pq-factor"><span class="pq-lbl">' + c[0] + '</span><div class="pq-bar"><div style="width:' + (c[1]/c[2]*100) + '%"></div></div><span class="pq-pts">' + c[1] + '/' + c[2] + '</span></div>').join('');
  return '<div class="porque"><div class="porque-grid">' +
    '<div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">Calidad · 7 factores</b>' + facs + '<div class="pq-total"><span>Total calidad</span><span>' + cal.total + '/100</span></div></div>' +
    '<div><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">Prioridad · 3 componentes</b>' + comps + '<div class="pq-total"><span>Total prioridad</span><span>' + prio.total + '/100</span></div></div>' +
  '</div></div>';
}
function botonesTriaje(caso){
  if (caso.estado==='en_visita') return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" onclick="event.stopPropagation()"><button class="abtn abtn-sm abtn-primary" onclick="abrirModoVisita(\''+caso.id+'\')">★ '+(caso.visita.estado==='realizada'?'Reabrir Modo visita':'Continuar Modo visita')+'</button><button class="abtn abtn-sm abtn-ghost" onclick="abrirCaso(\''+caso.id+'\');_fichaTab=\'presupuesto\';renderFicha()">Revisar borrador y enviar</button></div>';
  const ac = accionSugerida(caso, DB.cfg);
  const mapa = { proponer_visita:'proponer', pedir_info:'pedir', presupuesto_sin_visita:'presupuesto', revisar_descarte:'descartar' };
  const sug = mapa[ac.id] || 'proponer';
  const exits = [['proponer','Proponer visita','exitProponerVisita'],['pedir','Pedir info/fotos','exitPedirInfo'],['presupuesto','Presupuesto sin visita','exitPresupuestoSinVisita'],['descartar','Descartar','exitDescartar']];
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px" onclick="event.stopPropagation()">' +
    exits.map(e=>'<button class="abtn abtn-sm ' + (e[0]===sug?'abtn-primary':'abtn-ghost') + '" title="' + (e[0]===sug?escH(ac.motivo):'') + '" onclick="' + e[2] + '(\'' + caso.id + '\')">' + (e[0]===sug?'★ ':'') + e[1] + '</button>').join('') +
  '</div>';
}
function filaBandeja(caso, prio, cal){
  prio = prio||scorePrioridad(caso,DB.cfg,hoy()); cal = cal||scoreCalidad(caso,DB.cfg);
  const cli = clienteDe(caso); const v = caso.versiones[0];
  const resumen = nombreTipoObra(caso.solicitud.tipoObra) + ' · ' + (caso.solicitud.espacios||[]).reduce((s,e)=>s+(e.m2||0),0) + ' m²';
  const abierto = porqueAbierto[caso.id];
  return '<div class="caso-card">' +
    '<div class="caso-card-top" onclick="abrirCaso(\'' + caso.id + '\')" style="cursor:pointer">' +
      '<span class="caso-ref">' + caso.id + '</span>' + badgeEstado(caso.estado) +
      '<span class="caso-nombre">' + escH(cli.nombre) + '</span>' + prioChip(prio.nivel) +
      (DB.cfg.pantalla.colBandeja.importe ? '<span class="caso-importe" style="margin-left:auto">' : '<span style="display:none">') + (v ? fmtImporteVersion(v) : '—') + '</span>' +
    '</div>' +
    '<div class="caso-card-mid">' +
      '<span class="caso-tipo">' + resumen + ' · ' + escH(cli.zona||'') + '</span>' +
      (DB.cfg.pantalla.colBandeja.barras ? barra2(cal, prio) : '') +
      '<button class="abtn abtn-ghost abtn-sm" onclick="porqueAbierto[\'' + caso.id + '\']=!porqueAbierto[\'' + caso.id + '\'];RENDERERS.presupuestos()">' + (abierto?'Ocultar':'Por qué') + '</button>' +
    '</div>' +
    (cal.etiquetas.length && DB.cfg.pantalla.colBandeja.chips ?'<div style="margin-top:6px">' + etiqChips(cal.etiquetas.slice(0,5)) + '</div>':'') +
    (abierto?porqueHtml(caso,cal,prio):'') +
    (DB.cfg.pantalla.colBandeja.acciones ? botonesTriaje(caso) : '') +
  '</div>';
}

function cuerpoSeguimiento(){
  const items = DB.casos.filter(enSeguimiento).map(c=>({caso:c, relojes:evaluarRelojes(c,DB.cfg,hoy())}));
  if (!items.length) return '<div class="section-card" style="text-align:center;color:var(--muted)">Nada esperando al cliente.</div>';
  const rows = items.map(x=>{
    const c=x.caso, cli=clienteDe(c); const prio=scorePrioridad(c,DB.cfg,hoy());
    const debido = x.relojes.find(r=>['recordatorio','caducidad','pausa','aviso_caducidad','recordatorio_visita','visita_hoy'].includes(r.tipo));
    const accBtn = debido ? '<button class="abtn abtn-primary abtn-sm" onclick="event.stopPropagation();exitRecordatorio(\'' + c.id + '\')">Preparar recordatorio</button>' : '<span style="color:var(--muted);font-size:12px">—</span>';
    return '<tr onclick="abrirCaso(\'' + c.id + '\')" style="cursor:pointer"><td><b>' + escH(cli.nombre) + '</b><br><span style="font-size:11px;color:var(--muted)">' + c.id + '</span></td>' +
      '<td>' + badgeEstado(c.estado) + '</td>' +
      '<td>' + prio.horasEspera + ' h</td>' +
      '<td>' + (debido?'<span class="badge b-warn">' + debido.tipo.replace(/_/g,' ') + '</span>':'<span class="badge b-mute">al día</span>') + '</td>' +
      '<td onclick="event.stopPropagation()">' + accBtn + '</td></tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Estado</th><th>En espera</th><th>Reloj</th><th>Acción</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function cuerpoPorEstado(){
  const orden = ['recibida','en_triaje','esperando_info','visita_propuesta','visita_confirmada','en_visita','propuesta_enviada','aceptada'];
  const cols = orden.map(est=>{
    const cs = DB.casos.filter(c=>c.estado===est);
    const cards = cs.map(c=>{ const cli=clienteDe(c); return '<div class="kan-card" onclick="abrirCaso(\'' + c.id + '\')"><div class="kan-card-nombre">' + escH(cli.nombre) + '</div><div style="color:var(--muted)">' + nombreTipoObra(c.solicitud.tipoObra) + '</div><div style="color:var(--muted);font-size:11px">' + c.id + '</div></div>'; }).join('') || '<div style="font-size:11px;color:var(--muted)">—</div>';
    return '<div class="kan-col"><div class="kan-col-hdr">' + ESTADO_LABEL[est] + '<span>' + cs.length + '</span></div>' + cards + '</div>';
  }).join('');
  return '<div class="kanban">' + cols + '</div><div style="font-size:12px;color:var(--muted);margin-top:8px">El cambio de estado se hace con las acciones del caso, no arrastrando tarjetas.</div>';
}

function cuerpoArchivo(){
  const cs = DB.casos.filter(enArchivo);
  if (!cs.length) return '<div class="section-card" style="text-align:center;color:var(--muted)">Archivo vacío.</div>';
  const rows = cs.map(c=>{
    const cli=clienteDe(c);
    const motivo = c.interno?.motivoDescarte || (c.estado==='caducada'?'Propuesta vencida':c.estado==='en_pausa'?'En pausa a petición del cliente':c.estado==='rechazada'?'Rechazada por el cliente':'—');

  const relojes = evaluarRelojes(c,DB.cfg,hoy());
  const selV = (campo,val,opts) => '<select onchange="editCampo(\'' + campo + '\',this.value)">' + opts.map(o=>'<option value="' + o[0] + '"' + (String(val)===String(o[0])?' selected':'') + '>' + o[1] + '</option>').join('') + '</select>';
  const inp = (campo,val,tipo) => '<input type="' + (tipo||'text') + '" value="' + escH(val==null?'':val) + '" onchange="editCampo(\'' + campo + '\',this.value)">';
  let h = '';
  // Cliente
  h += '<div class="section-card"><div class="section-card-title">Cliente</div>' +
    '<div class="kv"><span class="k">Nombre</span>' + escH(cli.nombre) + '</div>' +
    '<div class="kv"><span class="k">Contacto</span>' + escH(cli.email) + ' · ' + escH(cli.tel) + '</div>' +
    '<div class="kv"><span class="k">Canal / consentimiento</span>' + escH(cli.canal) + ' · <span class="badge b-ok">RGPD aceptado</span></div></div>';
  // Vivienda (editable)
  h += '<div class="section-card"><div class="section-card-title">Vivienda (editable)</div>' +
    '<div class="inl-field"><label>Dirección (resumen)</label>' + inp('vivienda.direccion', c.vivienda.direccion||(cli.zona+' · '+cli.cp)) + '</div>' +
    '<div class="inl-field"><label>Código postal</label>' + inp('vivienda.cp', c.vivienda.cp) + '</div>' +
    '<div class="inl-field"><label>Zona (derivada)</label><span style="flex:1">' + zonaDeCp(c.vivienda.cp,DB.cfg) + '</span></div>' +
    '<div class="inl-field"><label>Tipo / m²</label>' + inp('vivienda.tipo', c.vivienda.tipo) + inp('vivienda.m2', c.vivienda.m2, 'number') + '</div>' +
    '<div class="inl-field"><label>Antigüedad</label>' + selV('vivienda.antiguedad', c.vivienda.antiguedad, [['<1980','<1980'],['1980-2000','1980-2000'],['>2000','>2000'],['desconocida','desconocida']]) + '</div>' +
    '<div class="inl-field"><label>Propietario</label>' + selV('vivienda.propietario', c.vivienda.propietario, [[true,'Sí'],[false,'No']]) + '</div>' +
    '<div class="inl-field"><label>Comunidad</label>' + selV('vivienda.comunidad', c.vivienda.comunidad, [['no_aplica','No aplica'],['resuelta','Resuelta'],['pendiente','Pendiente'],['no','No']]) + '</div>' +
    '<div class="inl-field"><label>Humedades</label>' + selV('vivienda.humedades', c.vivienda.humedades, [[true,'Sí'],[false,'No']]) + '</div>' +
    '<div class="inl-field"><label>Tope presupuesto</label>' + inp('vivienda.topePresupuesto', c.vivienda.topePresupuesto, 'number') + '</div>' +
    '<div class="inl-field"><label>Inicio deseado</label>' + inp('vivienda.fechaInicioDeseada', c.vivienda.fechaInicioDeseada, 'date') + '</div></div>';
  h += fichaVivienda(c) + fichaFacturacion(c);
  // Solicitud
  h += '<div class="section-card"><div class="section-card-title">Solicitud (editable)</div>' +
    '<div class="inl-field"><label>Tipo de obra</label>' + selV('solicitud.tipoObra', c.solicitud.tipoObra, [['reforma_integral','Reforma integral'],['reforma_bano','Reforma de baño'],['reforma_cocina','Reforma de cocina'],['reforma_parcial','Reforma parcial']]) + '</div>' +
    '<div class="inl-field"><label>Calidad</label>' + selV('solicitud.calidad', c.solicitud.calidad, [['basica','Básica'],['media','Media'],['premium','Premium']]) + '</div>' +
    '<div class="kv"><span class="k">Espacios</span>' + (c.solicitud.espacios||[]).map(e=>escH((e.nombre||e.tipo)+' '+e.m2+'m²')).join(' · ') + '</div>' +
    '<div class="kv"><span class="k">Fotos</span>' + ((c.solicitud.fotosCliente||[]).length||'sin') + ' fotos' + ((c.solicitud.fotosCliente||[]).some(i => Adj.meta(i)) ? '<div class="bub-adj">' + c.solicitud.fotosCliente.filter(i => Adj.meta(i)).map(i => adjChipHtml(i)).join('') + '</div>' : '') + '</div>' +
    (c.solicitud.notasCliente?'<div class="kv"><span class="k">Nota cliente</span><i>“' + escH(c.solicitud.notasCliente) + '”</i></div>':'') + '</div>';
  // Prioridad y calidad
  h += '<div class="section-card"><div class="section-card-title">Prioridad ' + prio.total + ' · Calidad ' + sc.total + ' · Incertidumbre ' + inc.nivel + '</div>' +
    porqueHtml(c, sc, prio) + '</div>';
  // Relojes / recordatorios
  h += '<div class="section-card"><div class="section-card-title">Relojes y recordatorios</div>' +
    (relojes.length?relojes.map(r=>'<div style="font-size:12px;padding:3px 0"><span class="etiq-chip etiq-warn">' + r.tipo.replace(/_/g,' ') + '</span> ' + escH(r.texto) + '</div>').join(''):'<div style="font-size:12px;color:var(--muted)">Sin avisos.</div>') +
    ((c.recordatorios||[]).length?'<div style="font-size:11px;color:var(--muted);margin-top:6px">' + c.recordatorios.length + ' recordatorio(s) enviados</div>':'') + '</div>';
  // Interno

    '<div class="kv"><span class="k">Etiquetas</span>' + (c.interno.etiquetas||[]).map(e=>'<span class="etiq-chip etiq-info">' + escH(e) + '</span>').join('') + '</div></div>';
  return h;
}
function editCampo(ruta, val){
  const c = DB.casos.find(x=>x.id===_fichaId); if(!c) return;
  const parts = ruta.split('.'); let o = c;
  for (let i=0;i<parts.length-1;i++) o = o[parts[i]] = o[parts[i]]||{};
  const key = parts[parts.length-1];
  if (val==='true') val=true; else if (val==='false') val=false;
  else if (val!=='' && !isNaN(val) && ['m2','topePresupuesto'].includes(key)) val=Number(val);
  o[key] = val===''?null:val;
  renderFicha();
}

function fichaHistorial(c){
  const evs = [...(c.eventos||[])].reverse();
  return '<div class="section-card"><div class="section-card-title">Línea de tiempo</div>' +
    (evs.length?evs.map(e=>'<div class="tl-item"><div class="tl-dot ' + (e.autor||'') + '"></div><div style="flex:1"><div>' + escH(e.texto) + '</div><div class="tl-autor">' + fmtFecha(e.fecha) + ' · ' + (e.autor||'') + '</div></div></div>').join(''):'<div style="color:var(--muted);font-size:12px">Sin eventos.</div>') + '</div>';
}

// ── Ficha: Presupuesto ──────────────────────────────────
function versionVigente(c){ return c.versiones.find(v=>v.estado==='vigente') || c.versiones.find(v=>v.estado==='aceptada') || c.versiones[c.versiones.length-1]; }
function asegurarBorrador(c){ if(!c.borrador){ const v=versionVigente(c); c.borrador={ lineas:clonarLineas(v.lineas||[]), ivaPct:v.ivaPct||DB.cfg.iva, basadoEn:v.id }; } return c.borrador; }
function totalesBorrador(c){ const b=c.borrador; return calcularTotales(b.lineas, b.ivaPct, DB.cfg.margen, DB.cfg.minimo); }

function fichaPresupuesto(c){
  const vig = versionVigente(c);
  let h = '';
  // Versiones + comparador
  h += '<div class="section-card"><div class="section-card-title">Versiones</div>';
  h += c.versiones.map(v=>{
    const cls = v.estado==='vigente'?'vigente':v.estado==='aceptada'?'aceptada':'';
    return '<span class="ver-chip ' + cls + '" title="' + escH(etiquetaVersion(v, c)) + '" onclick="_fichaDiff=\'' + v.id + '\';renderFicha()">' + v.id + ' · ' + (v.tipo||'') + ' · ' + fmtImporteVersion(v) + (v.estado==='vigente'?' ✓':'') + '</span>';
  }).join('');
  if (_fichaDiff){
    const vIdx = c.versiones.findIndex(v=>v.id===_fichaDiff);
    const vA = c.versiones[vIdx-1], vB = c.versiones[vIdx];
    if (vB){
      if (vA){ const d = diffVersiones(vA,vB);
        h += '<div class="porque" style="margin-top:10px"><b style="font-size:11px;text-transform:uppercase;color:var(--muted)">' + vB.id + ' vs ' + vA.id + '</b>' +
          d.anyadidas.map(l=>'<div class="diff-row diff-add">+ ' + escH(l.concepto) + ' (' + fmtEur(l.subtotal) + ')</div>').join('') +
          d.quitadas.map(l=>'<div class="diff-row diff-del">− ' + escH(l.concepto) + '</div>').join('') +
          d.cambiadas.map(x=>'<div class="diff-row diff-chg">~ ' + escH(x.a.concepto) + ': ' + fmtEur(x.de.subtotal) + ' → ' + fmtEur(x.a.subtotal) + '</div>').join('') +
          (d.anyadidas.length+d.quitadas.length+d.cambiadas.length===0?'<div class="diff-row" style="color:var(--muted)">Sin diferencias de líneas.</div>':'') + '</div>';
      } else h += '<div class="porque" style="margin-top:10px">' + vB.id + ' es la primera versión.</div>';
    }
  }
  h += '</div>';

  if (c.borrador){
    const b = c.borrador; const tot = totalesBorrador(c);
    h += '<div class="section-card" style="border-color:var(--accent)"><div class="section-card-title" style="color:var(--accent)">Borrador sin enviar (basado en ' + b.basadoEn + ')</div>';
    h += tablaLineas(c, b.lineas, true);
    h += '<div style="margin-top:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
      '<label style="font-size:12px;color:var(--muted)">IVA <select onchange="c_setIva(this.value)">' + [21,10,0].map(i=>'<option value="' + i + '"' + (b.ivaPct===i?' selected':'') + '>' + i + '%</option>').join('') + '</select></label>' +
      '<span style="font-size:11px;color:var(--amber)">Confirmar el criterio de IVA con el gestor</span>' +
      '<button class="abtn abtn-ghost abtn-sm" onclick="c_addLinea()">+ Añadir línea</button>' +
      '<button class="abtn abtn-ghost abtn-sm" onclick="c_recalcular()">Recalcular</button>' +
    '</div>';
    h += '<div class="totbar"><span>Subtotal <b>' + fmtEur(tot.subtotal) + '</b></span><span>Margen <b>' + fmtEur(tot.margen) + '</b></span><span>IVA <b>' + fmtEur(tot.iva) + '</b></span><span class="tot-final">' + fmtEur(tot.total) + '</span></div>';
    h += '<div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost abtn-sm" onclick="materialesClienteModal(\'' + c.id + '\')">Materiales del cliente</button><button class="abtn abtn-ghost abtn-sm" onclick="c_descartarBorrador()">Descartar borrador</button><button class="abtn abtn-primary abtn-sm" onclick="c_enviarVersion()">Enviar versión</button></div>';
    h += '</div>';
  } else {
    h += '<div class="section-card"><div class="section-card-title">Versión vigente · ' + (vig?.id||'—') + ' · IVA ' + (vig?.ivaPct||21) + '%</div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">' + escH(etiquetaVersion(vig, c)) + (vig && !rangoVersion(vig).exacto ? ' · ' + fmtImporteVersion(vig) + ' (IVA incl.)' : '') + '</div>';
    h += tablaLineas(c, vig?.lineas||[], false);
    const tot = vig?.totales||{};
    h += '<div class="totbar"><span>Subtotal <b>' + fmtEur(tot.subtotal||0) + '</b></span><span>Margen <b>' + fmtEur(tot.margen||0) + '</b></span><span>IVA <b>' + fmtEur(tot.iva||0) + '</b></span><span class="tot-final">' + fmtEur(tot.total||0) + '</span></div>';
    h += '<div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end"><button class="abtn abtn-ghost abtn-sm" onclick="materialesClienteModal(\'' + c.id + '\')">Materiales del cliente</button><button class="abtn abtn-ghost abtn-sm" onclick="c_editar()">Editar (crear borrador)</button>';
    if (c.estado==='propuesta_enviada') h += '<button class="abtn abtn-ghost abtn-sm" onclick="accionArchivo(\'' + c.id + '\',\'renovar\')">Renovar</button>';
    h += '</div></div>';
  }
  if (c.estado==='propuesta_enviada'){
    h += '<div class="section-card"><div class="section-card-title">Resultado del cliente</div><div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="abtn abtn-primary abtn-sm" onclick="accCliente(\'' + c.id + '\',\'aceptar\')">Simular: acepta</button>' +
      '<button class="abtn abtn-ghost abtn-sm" onclick="accCliente(\'' + c.id + '\',\'pedir_cambios\')">Simular: pide cambios</button>' +
      '<button class="abtn abtn-ghost abtn-sm" onclick="accCliente(\'' + c.id + '\',\'rechazar\')">Simular: rechaza</button></div></div>';
  }
  return h;
}
function tablaLineas(c, lineas, editable){
  if (!lineas.length) return '<div style="font-size:12px;color:var(--muted)">Sin líneas.</div>';
  const espNombre = eid => { const e=(c.solicitud.espacios||[]).find(x=>x.id===eid); return e?(e.nombre||e.tipo):'General'; };
  const grupos = {};
  lineas.forEach(l=>{ const g=espNombre(l.espacioId); (grupos[g]=grupos[g]||[]).push(l); });
  let rows = '';
  Object.entries(grupos).forEach(([g,ls])=>{
    rows += '<tr><td colspan="6" class="lin-grupo-td">' + escH(g) + '</td></tr>';
    rows += ls.map(l=>{
      if (editable) return '<tr>' +
        '<td><input value="' + escH(l.concepto) + '" onchange="c_editLinea(\'' + l.id + '\',\'concepto\',this.value)"></td>' +
        '<td style="width:70px"><input class="num" type="number" step="0.01" value="' + l.cantidad + '" onchange="c_editLinea(\'' + l.id + '\',\'cantidad\',this.value)"></td>' +
        '<td style="width:70px"><input class="num" type="number" step="0.01" value="' + l.precio + '" onchange="c_editLinea(\'' + l.id + '\',\'precio\',this.value)"></td>' +
        '<td style="width:70px;text-align:right">' + fmtEur0(l.subtotal) + '</td>' +
        '<td style="width:60px"><span class="lin-origen">' + (l.origen||'calc') + '</span></td>' +
        '<td style="width:44px;text-align:right"><span class="lin-cand ' + (l.bloqueada?'on':'') + '" title="Bloquear" onclick="c_candado(\'' + l.id + '\')">' + (l.bloqueada?'🔒':'🔓') + '</span> <span style="cursor:pointer;color:var(--danger)" onclick="c_delLinea(\'' + l.id + '\')">✕</span></td>' +
      '</tr>';
      return '<tr><td>' + escH(l.concepto) + '</td><td class="num">' + l.cantidad + '</td><td class="num">' + fmtEur0(l.precio) + '</td><td style="text-align:right">' + fmtEur0(l.subtotal) + '</td><td><span class="lin-origen">' + (l.origen||'calc') + '</span></td><td>' + (l.bloqueada?'🔒':'') + '</td></tr>';
    }).join('');
  });
  return '<table class="lineas-tbl"><thead><tr><th>Concepto</th><th>Cant.</th><th>Precio</th><th>Subtotal</th><th>Origen</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
}
function _fc(){ return DB.casos.find(x=>x.id===_fichaId); }
function c_editar(){ const c=_fc(); asegurarBorrador(c); renderFicha(); }
function c_editLinea(lid, campo, val){ const c=_fc(); const b=asegurarBorrador(c); const l=b.lineas.find(x=>x.id===lid); if(!l)return;
  if(campo==='cantidad'||campo==='precio'){ l[campo]=r(Number(val)||0); l.subtotal=r(l.cantidad*l.precio); } else l[campo]=val;
  l.bloqueada=true; l.origen='manual'; renderFicha(); }
function c_candado(lid){ const c=_fc(); const b=asegurarBorrador(c); const l=b.lineas.find(x=>x.id===lid); if(l){l.bloqueada=!l.bloqueada; renderFicha();} }
function c_delLinea(lid){ const c=_fc(); const b=asegurarBorrador(c); const l=b.lineas.find(x=>x.id===lid); confirmarAccion('Eliminar línea','¿Eliminar «' + (l?l.concepto:'línea') + '» del borrador?', () => { b.lineas=b.lineas.filter(x=>x.id!==lid); renderFicha(); }); }
function c_addLinea(){ const c=_fc(); const b=asegurarBorrador(c); const esp=(c.solicitud.espacios||[])[0];
  b.lineas.push({id:uid('L'),key:'manual',concepto:'Nueva partida',espacioId:esp?.id||null,unidad:'ud',base:'fijo',cantidad:1,precio:0,subtotal:0,tipo:'extra',origen:'manual',bloqueada:true}); renderFicha(); }
function c_setIva(val){ const c=_fc(); const b=asegurarBorrador(c); b.ivaPct=Number(val); renderFicha(); }
function c_recalcular(){ const c=_fc(); recalcularYGuardar(c); toast('Recalculado (líneas bloqueadas y manuales intactas)'); renderFicha(); }
function c_descartarBorrador(){ const c=_fc(); c.borrador=null; renderFicha(); }
function c_enviarVersion(){ const c=_fc(); const b=c.borrador; if(!b)return;
  const tot=totalesBorrador(c); const inc=calcularIncertidumbre(c); const hq=calcularHorquilla(tot.total,inc.nivel); tot.lo=hq.lo; tot.hi=hq.hi;
  const nv={ id:siguienteVersionId(c), tipo:'revisada', creadaAt:hoy(), enviadaAt:null, ivaPct:b.ivaPct, lineas:b.lineas, totales:tot, cambiosRespectoAnterior:null, estado:'borrador' };
  if (!exigir('enviar_version', c, { version:nv })) return; // A1
  enviarVersion(c, nv, 'WhatsApp'); c.borrador=null; _fichaDiff=nv.id;
  if (['en_triaje','en_visita'].includes(c.estado) && puedeTransitar(c,'propuesta_enviada')){ try{transitar(c,'propuesta_enviada',{autor:'reformista',texto:'Presupuesto enviado'});}catch(e){} }
  toast('Versión ' + nv.id + ' enviada'); renderFicha(); }

// ── Ficha: Visita ───────────────────────────────────────
function fichaVisita(c){
  const vis = c.visita||{};
  const cb = vis.cobro || {}; 
  if ((vis.estado==='pendiente' || !vis.estado) && !(vis.franjasOfrecidas||[]).length && !vis.elegida) return '<div class="section-card" style="color:var(--muted)">Aún no se ha propuesto visita. Usa «Proponer visita» desde la bandeja.</div>';
  let h = '<div class="section-card"><div class="section-card-title">Estado de la visita</div>' +
    '<div class="kv"><span class="k">Estado</span>' + escH(vis.estado) + '</div>';
  if ((vis.franjasOfrecidas||[]).length) h += '<div class="kv"><span class="k">Franjas ofrecidas</span>' + vis.franjasOfrecidas.map(f=>fmtFechaCorta(f.fecha)+' '+f.franja).join(' · ') + '</div>';
  if (vis.elegida){
    h += '<div class="kv"><span class="k">Elegida</span><b>' + fmtFecha(vis.elegida.fecha) + ' · ' + vis.elegida.franja + '</b>' + (vis.confirmadaCliente?' <span class="badge b-ok">confirmada por el cliente</span>':'') + '</div>';
    h += '<div class="kv"><span class="k">Dirección</span>' + escH(direccionDe(c)) + ' · <a href="' + mapaLink(c) + '" target="_blank" rel="noopener">mapa</a></div>';
  }
  h += '<div class="kv"><span class="k">Cobro de visita</span><span>' + cobroVisitaHtml(c) + '</span></div>';
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">';
  if (vis.estado==='confirmada' && vis.elegida){
    h += '<button class="abtn abtn-primary abtn-sm" onclick="abrirModoVisita(\'' + c.id + '\')">' + (c.estado==='en_visita'?'Continuar Modo visita':'Iniciar visita (Modo visita)') + '</button>' +
         '<button class="abtn abtn-ghost abtn-sm" onclick="reprogramarModal(\'' + c.id + '\')">Reprogramar</button><button class="abtn abtn-ghost abtn-sm" onclick="cancelarVisitaModal(\'' + c.id + '\')">Cancelar visita</button>';
  } else if (c.estado==='en_visita') h += '<button class="abtn abtn-ghost abtn-sm" onclick="abrirModoVisita(\'' + c.id + '\')">Reabrir Modo visita</button>';
  h += '</div></div>';

  const checks = vis.checks||{}; const items = generarChecklist(c);
  const respondidas = items.filter(it => checks[it.id] && checks[it.id].valor != null && checks[it.id].valor !== '');
  h += '<div class="section-card"><div class="section-card-title">Checklist (' + respondidas.length + '/' + items.length + ' respondidas)</div>' +
    items.map(it => { const ck = checks[it.id]; const v = ck && ck.valor; const txt = (v==null||v==='') ? '<span style="color:var(--muted)">—</span>' : (v===true?'Sí':v===false?'No':escH(String(v)));
      return '<div class="check-q" style="justify-content:space-between"><span>' + (v==null||v===''?'☐':'☑') + ' ' + escH(it.label) + (it.espacioNombre?' <span style="color:var(--muted)">· ' + escH(it.espacioNombre) + '</span>':'') + '</span><b>' + txt + '</b></div>'; }).join('') + '</div>';

  const med = Object.entries(vis.medidas||{});
  if (med.length) h += '<div class="section-card"><div class="section-card-title">Medidas</div>' + med.map(([eid,m]) => { const e=(c.solicitud.espacios||[]).find(x=>x.id===eid); const mm=calcularMedidas(m); return '<div class="kv"><span class="k">' + escH(e?(e.nombre||e.tipo):eid) + '</span>' + m.largo + '×' + m.ancho + '×' + m.alto + ' m → ' + mm.m2_suelo + ' m² suelo · ' + mm.m2_pared + ' m² pared · ' + mm.ml_rodapie + ' ml rodapié' + (m.aplicada?' <span class="badge b-ok">aplicado</span>':'') + '</div>'; }).join('') + '</div>';
  if ((vis.fotos||[]).length) h += '<div class="section-card"><div class="section-card-title">Fotos (' + vis.fotos.length + ')</div><div class="mv-thumbs">' + vis.fotos.map(f=>'<div class="mv-thumb">' + escH(f.etiqueta||'Foto') + (f.espacioNombre?' · ' + escH(f.espacioNombre):'') + '</div>').join('') + '</div></div>';
  if ((vis.notas||[]).length) h += '<div class="section-card"><div class="section-card-title">Notas</div>' + vis.notas.map(n=>'<div class="mv-nota"><div style="font-size:11px;color:var(--muted)">' + escH(n.espacioNombre||'General') + ' · ' + fmtFecha(n.fecha) + (n.audioUrl?' · 🎙':'') + '</div>' + (n.audioUrl?'<i>' + escH(n.transcripcion) + '</i>':escH(n.texto)) + '</div>').join('') + '</div>';
  if (c.fiscal && (c.fiscal.nif || c.fiscal.cif || c.fiscal.nombre)) h += '<div class="section-card"><div class="section-card-title">Datos de facturación ' + chipEstado(evaluarFiscal(c.fiscal, c).ok, 'completos', 'pendientes') + '</div><div class="kv"><span class="k">Nombre</span>' + escH(nombreFacturacion(c.fiscal)) + '</div><div class="kv"><span class="k">NIF / CIF</span>' + escH(c.fiscal.nif || c.fiscal.cif || '—') + '</div><div class="kv"><span class="k">Domicilio fiscal</span>' + escH(domicilioTexto(c.fiscal) || '—') + '</div></div>';

}

const PASOS_CLIENTE = [
  {k:'recibida', l:'Solicitud recibida', estados:['recibida','en_triaje','esperando_info']},
  {k:'visita', l:'Visita técnica', estados:['visita_propuesta','visita_confirmada','en_visita']},

];
const ORDEN_FLUJO = ['recibida','en_triaje','esperando_info','visita_propuesta','visita_confirmada','en_visita','propuesta_enviada','aceptada','en_obra','terminada','en_remates','cerrada'];
function vistaCliente(id){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const cli = clienteDe(c); const v = versionVigente(c); const tv = totalVigente(c);
  const idxActual = ORDEN_FLUJO.indexOf(c.estado);
  let pasos = PASOS_CLIENTE.map(p=>{
    const minIdx = Math.min(...p.estados.map(e=>ORDEN_FLUJO.indexOf(e)).filter(i=>i>=0));
    const esAhora = p.estados.includes(c.estado);
    const hecho = minIdx>=0 && idxActual>minIdx && !esAhora;
    return '<div class="cv-step"><div class="cv-step-dot ' + (esAhora?'now':hecho?'done':'') + '">' + (hecho?'✓':esAhora?'●':'○') + '</div>' + p.l + '</div>';
  }).join('');

  // Acción pedida al cliente
  let accionHtml = '';
  if (c.estado==='esperando_info') accionHtml = '<div class="cv-action"><b>Necesitamos algo más</b><p style="font-size:13px;color:var(--muted);margin:6px 0">Sube las fotos o datos que te hemos pedido.</p><button class="cv-btn" onclick="accCliente(\'' + id + '\',\'responder\')">Enviar información y fotos</button></div>';
  else if (c.estado==='visita_propuesta') accionHtml = '<div class="cv-action"><b>Elige el día de la visita</b>' + (c.visita.franjasOfrecidas||[]).map((f,i)=>'<button class="cv-btn ' + (i>0?'ghost':'') + '" onclick="accCliente(\'' + id + '\',\'elegir_franja\',' + i + ')">' + fmtFecha(f.fecha) + ' · ' + f.franja + '</button>').join('') + '</div>';
  else if (c.estado==='propuesta_enviada') accionHtml = '<div class="cv-action"><b>Tu presupuesto: ' + (v ? (rangoVersion(v).exacto ? fmtEur(v.totales.total) : fmtImporteVersion(v)) : fmtEur(0)) + '</b>' +
      (v?.clausulaAjuste?'<p style="font-size:11px;color:var(--amber);margin:6px 0">' + escH(DB.cfg.textos.clausulaAjuste) + '</p>':'') + '<p style="font-size:11px;color:var(--muted);margin:6px 0">' + escH(DB.cfg.textos.condiciones) + '</p>' +
      '<button class="cv-btn" onclick="accCliente(\'' + id + '\',\'aceptar\')">Aceptar presupuesto</button>' +
      '<button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'pedir_cambios\')">Pedir cambios</button>' +
      '<button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'rechazar\')">No me interesa</button></div>';
  else if (c.estado==='visita_confirmada' && c.visita.elegida){
    const pol = politicaReprogramar(c, DB.cfg, _hoyDate()); const alt = franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14, id).slice(0,3);
    accionHtml = '<div class="cv-action"><b>Visita confirmada</b><p style="font-size:14px;margin:6px 0">' + fmtFecha(c.visita.elegida.fecha) + ' · ' + c.visita.elegida.franja + '</p>' +
      (c.visita.confirmadaCliente ? '<div style="color:var(--ok);font-size:13px">✓ Has confirmado tu asistencia</div>' : '<button class="cv-btn" onclick="accCliente(\'' + id + '\',\'confirmar_visita\')">Confirmo que estaré</button>') +
      '<p style="font-size:12px;color:var(--muted);margin:10px 0 2px">' + (pol.gratis ? 'Puedes cambiar la hora sin coste hasta ' + pol.limite + ' h antes.' : '⚠ Faltan menos de ' + pol.limite + ' h: cambiarla tiene coste.') + '</p>' +
      alt.map((f,i)=>'<button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'reprogramar\',' + i + ')">Cambiar a ' + fmtFecha(f.fecha) + ' · ' + f.franja + '</button>').join('') + '</div>';
  }
  else if (c.estado==='en_pausa') accionHtml = '<div class="cv-action"><b>Caso en pausa</b><button class="cv-btn" onclick="accCliente(\'' + id + '\',\'reactivar\')">Reactivar mi solicitud</button></div>';
  else if (c.estado==='caducada') accionHtml = '<div class="cv-action"><b>Tu presupuesto ha caducado</b><button class="cv-btn" onclick="accCliente(\'' + id + '\',\'renovar\')">Pedir presupuesto actualizado</button></div>';
  else if (['en_obra','terminada','en_remates','cerrada'].includes(c.estado)) accionHtml = clienteObraHtml(c);

  const desglose = '<div class="section-card" style="background:#fff"><div class="section-card-title">Tu presupuesto</div>' +
    (v?'<div class="kv"><span class="k">Versión vigente</span>' + v.id + ' · ' + fmtFecha(v.enviadaAt||v.creadaAt) + '</div>':'') +
    (['aceptada','en_obra','en_remates','terminada','cerrada'].includes(c.estado)?
      '<div class="kv"><span class="k">Firmado</span>' + fmtEur(tv.firmado) + '</div>' + (tv.provisional?'<div class="kv"><span class="k">Provisional</span>' + fmtEur(tv.provisional) + '</div>':'') + '<div class="kv"><span class="k">Total vigente</span><b>' + fmtEur(tv.total) + '</b></div>'
      :'<div class="kv"><span class="k">' + (v && !rangoVersion(v).exacto ? 'Estimación' : 'Total') + '</span><b>' + (v && !rangoVersion(v).exacto ? fmtImporteVersion(v) : fmtEur(v?.totales?.total||0)) + '</b></div>') + '</div>';

  openModal('<div class="modal-title">Tu reforma con ' + escH(DB.cfg.empresa.nombre) + '</div>' +
    '<p style="font-size:12px;color:var(--muted);margin-bottom:10px">Esto es lo que vería ' + escH(cli.nombre.split(' ')[0]) + ' en su enlace privado.</p>' +
    '<div class="cliente-view">' + pasos + accionHtml + desglose + '</div>' +
    '<div style="margin-top:14px;text-align:right"><button class="abtn abtn-ghost abtn-sm" onclick="abrirCaso(\'' + id + '\')">← Volver a la ficha</button></div>', true);
}

  const porFirmar = (c.obra.adendas||[]).filter(a => a.estado === 'enviada');

    (c.obra.hitos?.length ? '<div class="prog-bar" style="margin:8px 0"><div class="prog-fill" style="width:' + (prog*100) + '%"></div></div><div style="font-size:12px;color:var(--muted);margin-bottom:6px">' + Math.round(prog*100) + ' % completado</div>' + hitos : '') +
    '<div style="font-size:13px;margin-top:8px">Firmado: <b>' + fmtEur(tv.firmado) + '</b>' + (tv.provisional ? ' · Provisional: <b>' + fmtEur(tv.provisional) + '</b>' : '') + ' · Total: <b>' + fmtEur(tv.total) + '</b></div>';

  if (porFirmar.length) h += porFirmar.map(a => '<div class="porque" style="margin-top:10px"><b>Adenda ' + a.id + ' por firmar</b> · ' + fmtEur(a.delta*(1+iva/100)) + ' c/IVA<button class="cv-btn" onclick="accCliente(\'' + id + '\',\'firmar_adenda\',\'' + a.id + '\')">Firmar adenda</button></div>').join('');
  if (c.estado === 'en_obra') h += '<input id="cv-texto" class="disp-inp" style="width:100%;margin-top:12px;padding:8px" placeholder="Describe el cambio que quieres pedir"><button class="cv-btn ghost" onclick="accCliente(\'' + id + '\',\'pedir_cambios\')">Pedir un cambio</button>';
  if (['terminada','en_remates'].includes(c.estado)){
    h += '<div style="margin-top:12px;font-size:13px"><b>Remates</b></div>' + ((c.obra.remates||[]).map(x => '<div style="font-size:13px">' + (x.estado==='resuelto'?'☑':'☐') + ' ' + escH(x.texto) + (x.foto?' 📷':'') + '</div>').join('') || '<div style="font-size:12px;color:var(--muted)">Aún no has indicado remates.</div>');

  return h + '</div>';
}
function accCliente(id, accion, franjaIdx){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  const datos = {};
  if (accion==='elegir_franja' && franjaIdx!=null) datos.franja = c.visita.franjasOfrecidas[franjaIdx];
  if (accion==='reprogramar' && franjaIdx!=null) datos.franja = franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14, id)[franjaIdx];
  if (accion==='pedir_cambios') datos.texto = (document.getElementById('cv-texto')||{}).value || 'Me gustaría revisar algún acabado';
  if (accion==='firmar_adenda') datos.id = franjaIdx;
  if (accion==='listar_remate') datos.texto = (document.getElementById('cv-remate')||{}).value || 'Pequeño detalle por revisar';
  if (accion==='rechazar') datos.motivo = 'Encontré otra oferta';
  // R-15: la simulación del cliente desde el admin respeta las mismas dependencias que su panel
  const reqDatos = { elegir_franja:{ franja:datos.franja }, reprogramar:{ franja:datos.franja, aceptaRetencion:true }, aceptar:{ condiciones:true, planRevisado:true, avisosLeidos:true, codigo:CODIGO_ACEPTACION }, pedir_cambios:{ texto:datos.texto }, rechazar:{ motivo:datos.motivo }, firmar_adenda:{ id:datos.id, acepto:true, nombre:nombreFacturacion(c.fiscal) }, listar_remate:{ texto:datos.texto } };
  if (reqDatos[accion] && !exigir(accion, c, { datos:reqDatos[accion] })) return;
  try{ aplicarAccionCliente(c, accion, datos); }catch(e){ toast(e.message,'err'); return; }
  toast('Acción del cliente aplicada');
  renderPaginaActual();
  vistaCliente(id);
}
function accClienteCambio(id, cambioId){
  const c = DB.casos.find(x=>x.id===id); if(!c) return;
  marcarDesacuerdo(c, cambioId);
  toast('Desacuerdo registrado · avisado el reformista'); renderPaginaActual(); vistaCliente(id);
}

let agendaTab = 'semana', agendaSemOff = 0, agendaRutaFecha = null;
const DIAS_LBL = {1:'Lunes',2:'Martes',3:'Miércoles',4:'Jueves',5:'Viernes',6:'Sábado',0:'Domingo'};
const DIAS_CORTO = {1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',0:'Dom'};
const ORDEN_DIAS = [1,2,3,4,5,6,0];

function direccionDe(c){ return c.vivienda.direccion || ((clienteDe(c).zona||'Madrid') + ', ' + c.vivienda.cp + ' Madrid'); }
function mapaLink(c){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(direccionDe(c)); }
function visitasConfirmadas(){ return DB.casos.filter(c => c.visita && c.visita.estado==='confirmada' && c.visita.elegida).sort((a,b)=> (a.visita.elegida.fecha+a.visita.elegida.franja).localeCompare(b.visita.elegida.fecha+b.visita.elegida.franja)); }
function visitasPropuestas(){ return DB.casos.filter(c => c.estado==='visita_propuesta' && (c.visita.franjasOfrecidas||[]).length); }

function eventosDelDia(ds){
  const ev = [];
  visitasConfirmadas().forEach(c => { if (c.visita.elegida.fecha===ds) ev.push({ tipo:visitaReservadaSinPago(c) ? 'reserva' : 'visita', hora:c.visita.elegida.franja, caso:c, texto:escH(clienteDe(c).nombre) + (visitaReservadaSinPago(c) ? ' (reservada, pendiente de pago)' : '') }); });
  visitasPropuestas().forEach(c => c.visita.franjasOfrecidas.forEach(f => { if (f.fecha===ds) ev.push({ tipo:'prop', hora:f.franja, caso:c, texto:escH(clienteDe(c).nombre) + ' (propuesta)' }); }));
  DB.casos.filter(c => ['en_obra','en_remates'].includes(c.estado)).forEach(c => {
    (c.obra.hitos||[]).filter(h => h.estado!=='hecho' && h.fechaInicioPrevista<=ds && ds<=h.fechaFinPrevista).forEach(h => ev.push({ tipo:'hito', hora:'', caso:c, texto:'🏗 ' + escH(h.nombre) + ' · ' + escH(clienteDe(c).nombre) }));
    if (ds===hoy() && saludObra(c, DB.cfg, hoy())==='bloqueada') ev.push({ tipo:'alerta', hora:'', caso:c, texto:'⛔ Obra bloqueada · ' + escH(clienteDe(c).nombre) });
  });
  return ev.sort((a,b)=> String(a.hora).localeCompare(String(b.hora)));
}

RENDERERS.agenda = function(){
  const nConf = visitasConfirmadas().length, nProp = visitasPropuestas().length;
  const tab = (k,l,n) => '<button class="tab ' + (agendaTab===k?'active':'') + '" onclick="agendaTab=\'' + k + '\';RENDERERS.agenda()">' + l + (n!=null?'<span class="tab-n">' + n + '</span>':'') + '</button>';
  let cuerpo = '';
  if (agendaTab==='semana') cuerpo = agSemana();
  else if (agendaTab==='lista') cuerpo = agLista();
  else if (agendaTab==='ruta') cuerpo = agRuta();
  else cuerpo = agDisponibilidad();
  document.getElementById('pg-agenda').innerHTML =
    '<div class="page-hdr"><div><div class="page-title">Agenda</div><div class="page-sub">' + nConf + ' visita' + (nConf!==1?'s':'') + ' confirmada' + (nConf!==1?'s':'') + ' · ' + nProp + ' pendiente' + (nProp!==1?'s':'') + ' de elegir franja</div></div></div>' +
    '<div class="tabs">' + tab('semana','Semana') + tab('lista','Lista',nConf+nProp) + tab('ruta','Ruta del día') + tab('disp','Disponibilidad') + '</div>' + cuerpo;
};

function agSemana(){
  const dow = diaSemana(hoy());
  const lunes = fechaMasDias(hoy(), -((dow+6)%7) + 7*agendaSemOff);
  let cols = '';
  for (let i=0;i<7;i++){
    const ds = fechaMasDias(lunes, i), d = diaSemana(ds);
    const bq = diaBloqueado(ds, DB.cfg), cerrado = !(DB.cfg.agenda.semana[d]||[]).length;
    const evs = eventosDelDia(ds).map(e => '<div class="ag-ev ' + e.tipo + '" onclick="abrirCaso(\'' + e.caso.id + '\')">' + (e.hora?'<b>' + e.hora.split('-')[0] + '</b> ':'') + e.texto + '</div>').join('');
    cols += '<div class="ag-day ' + (ds===hoy()?'hoy ':'') + (bq?'bloq ':'') + (cerrado&&!bq?'cerrado':'') + '"><div class="ag-day-h"><span>' + DIAS_CORTO[d] + ' ' + ds.slice(8) + '/' + ds.slice(5,7) + '</span>' + (bq?'<span title="' + escH(bq.motivo||'') + '">🚫</span>':'') + '</div>' +
      (bq?'<div style="font-size:11px;color:var(--muted)">' + escH(bq.motivo||'Bloqueado') + '</div>':'') + (evs || (bq||cerrado?'':'<div style="font-size:11px;color:var(--muted)">Libre</div>')) + '</div>';
  }
  return '<div class="ag-nav"><button class="abtn abtn-ghost abtn-sm" onclick="agendaSemOff--;RENDERERS.agenda()">←</button><b style="font-size:13px">Semana del ' + fmtFecha(lunes) + '</b><button class="abtn abtn-ghost abtn-sm" onclick="agendaSemOff++;RENDERERS.agenda()">→</button><button class="abtn abtn-ghost abtn-sm" onclick="agendaSemOff=0;RENDERERS.agenda()">Hoy</button></div>' +
    '<div class="ag-week">' + cols + '</div>' +
    '<div class="ag-leyenda"><span><span class="etiq-chip etiq-warn">■</span> Visita confirmada y pagada</span><span><span class="etiq-chip" style="background:#fff8e1;color:#8a5a00">■</span> Reservada, pendiente de pago</span><span>┄ Franja propuesta</span><span><span class="etiq-chip" style="background:#f3e5f5;color:#7b1fa2">■</span> Hito de obra</span><span><span class="etiq-chip etiq-bad">■</span> Bloqueo</span></div>';
}

function cobroVisitaHtml(c){
  const cb = c.visita.cobro || {estado:'no_aplica'};
  const imp = cb.importe != null ? cb.importe : importeVisita(c, DB.cfg);
  if (!DB.cfg.visita.cobra) return '<span class="badge b-mute">sin cobro</span>';
  if (cb.estado === 'pendiente_pago'){ const rs = estadoReserva(c, ahoraMs()); return '<span class="badge b-warn">' + fmtEur0(imp) + ' · reservada, pendiente de pago</span> <span style="font-size:11px;color:var(--muted)">' + (rs.activa && !rs.vencida ? 'quedan ' + Math.round(rs.restanteHoras) + ' h' : 'reserva vencida') + '</span>'; }
  if (cb.estado === 'justificante_enviado'){ const a = (DB.avisosPago||[]).find(x => x.id === cb.avisoPagoId); return '<span class="badge b-info">' + fmtEur0(imp) + ' · justificante por confirmar</span>' + (a ? ' <button class="abtn abtn-primary abtn-sm" onclick="event.stopPropagation();avisoConfirmarModal(\'' + a.id + '\')">Confirmar cobro</button>' : ''); }
  const badge = cb.estado==='cobrada'?'b-ok':cb.estado==='eximida'?'b-info':'b-warn';
  const lbl = cb.estado==='cobrada'?'cobrada':cb.estado==='eximida'?'eximida':'pendiente';
  const btns = cb.estado==='pendiente' ? ' <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();registrarCobroVisita(\'' + c.id + '\')">Registrar cobro</button> <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();eximirVisitaModal(\'' + c.id + '\')">Eximir</button>' : '';
  return '<span class="badge ' + badge + '">' + fmtEur0(imp) + ' · ' + lbl + '</span>' + btns;
}

function agLista(){
  const filas = [];
  visitasConfirmadas().forEach(c => filas.push({ c, tipo:'conf', fecha:c.visita.elegida.fecha, franja:c.visita.elegida.franja }));
  visitasPropuestas().forEach(c => filas.push({ c, tipo:'prop', fecha:c.visita.franjasOfrecidas[0].fecha, franja:c.visita.franjasOfrecidas.map(f=>fmtFechaCorta(f.fecha)+' '+f.franja.split('-')[0]).join(' · ') }));
  if (!filas.length) return '<div class="section-card" style="text-align:center;color:var(--muted)">No hay visitas en agenda.</div>';

    let rec = '<span style="color:var(--muted);font-size:12px">—</span>', acc = '';

      acc = '<button class="abtn abtn-primary abtn-sm" onclick="event.stopPropagation();abrirModoVisita(\'' + c.id + '\')">Iniciar visita</button> <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();reprogramarModal(\'' + c.id + '\')">Reprogramar</button> <button class="abtn abtn-ghost abtn-sm" onclick="event.stopPropagation();cancelarVisitaModal(\'' + c.id + '\')">Cancelar</button>';
    } else acc = '<span style="font-size:12px;color:var(--muted)">Esperando que el cliente elija</span>';
    return '<tr onclick="abrirCaso(\'' + c.id + '\')" style="cursor:pointer"><td><b>' + (f.tipo==='conf'?fmtFecha(f.fecha) + '<br>' + f.franja:escH(f.franja)) + '</b>' + (f.tipo==='prop'?'<br><span class="badge b-info">propuesta</span>':'') + '</td>' +
      '<td><b>' + escH(cli.nombre) + '</b><br><span style="font-size:11px;color:var(--muted)">' + c.id + '</span></td><td style="font-size:12px">' + escH(direccionDe(c)) + '</td><td onclick="event.stopPropagation()">' + cobroVisitaHtml(c) + '</td><td onclick="event.stopPropagation()">' + rec + '</td><td onclick="event.stopPropagation()">' + acc + '</td></tr>';
  }).join('');

  let h = '<div class="ctrl-row"><span class="ctrl-lbl">Día</span><input type="date" value="' + ds + '" onchange="agendaRutaFecha=this.value;RENDERERS.agenda()" class="disp-inp"><button class="abtn abtn-ghost abtn-sm" onclick="agendaRutaFecha=null;RENDERERS.agenda()">Hoy</button></div>';
  if (!vis.length) return h + '<div class="section-card" style="text-align:center;color:var(--muted)">Sin visitas confirmadas el ' + fmtFecha(ds) + '.</div>';

    const cli = clienteDe(c), el = c.visita.elegida;

function agDisponibilidad(){

  const dias = ORDEN_DIAS.map(d => {
    const frs = (sem[d]||[]).map((f,i) => '<div class="disp-fr"><input type="time" value="' + f[0] + '" onchange="dispFranja(' + d + ',' + i + ',0,this.value)"> – <input type="time" value="' + f[1] + '" onchange="dispFranja(' + d + ',' + i + ',1,this.value)"><span style="cursor:pointer;color:var(--danger)" onclick="dispDelFranja(' + d + ',' + i + ')">✕</span></div>').join('');

  }).join('');
  const bloqs = (DB.cfg.agenda.bloqueos||[]).map((b,i) => '<div class="disp-fr">🚫 ' + fmtFecha(b.desde) + (b.hasta&&b.hasta!==b.desde?' → ' + fmtFecha(b.hasta):'') + ' · ' + escH(b.motivo||'') + ' <span style="cursor:pointer;color:var(--danger)" onclick="dispDelBloqueo(' + i + ')">✕</span></div>').join('') || '<div style="font-size:12px;color:var(--muted)">Sin bloqueos.</div>';
  const libres = franjasLibres(DB.cfg, DB.casos, fechaMasDias(hoy(),1), 14);
  const porDia = {}; libres.forEach(f => porDia[f.fecha] = (porDia[f.fecha]||0)+1);
  const prev = Object.keys(porDia).slice(0,10).map(ds => '<span class="etiq-chip etiq-info">' + DIAS_CORTO[diaSemana(ds)] + ' ' + ds.slice(8) + ': ' + porDia[ds] + '</span>').join('');
  return '<div class="section-card"><div class="section-card-title">Disponibilidad semanal (fuente de las franjas ofrecidas)</div>' + dias + '</div>' +
    '<div class="section-card"><div class="section-card-title">Bloqueos (vacaciones, festivos)</div>' + bloqs +
      '<div class="disp-fr" style="margin-top:8px"><input id="bq-desde" type="date" class="disp-inp"> → <input id="bq-hasta" type="date" class="disp-inp"> <input id="bq-motivo" class="disp-inp" placeholder="Motivo" style="flex:1"><button class="abtn abtn-primary abtn-sm" onclick="dispAddBloqueo()">Añadir</button></div></div>' +
    '<div class="section-card"><div class="section-card-title">Visita y política</div>' +
      '<div class="inl-field"><label>Duración de la visita (min)</label><input type="number" min="15" step="15" value="' + v.duracionMin + '" onchange="dispVisita(\'duracionMin\',this.value)"></div>' +
      '<div class="inl-field"><label>Margen de traslado (min)</label><input type="number" min="0" step="5" value="' + v.trasladoMin + '" onchange="dispVisita(\'trasladoMin\',this.value)"></div>' +
      '<div class="inl-field"><label>Reprogramar gratis hasta (h antes)</label><input type="number" min="0" value="' + v.politica.reprogramarGratisHoras + '" onchange="dispVisita(\'reprogramarGratisHoras\',this.value)"></div>' +
      '<div class="inl-field"><label>Reprogramación tardía</label><select onchange="dispVisita(\'tardia\',this.value)"><option value="retiene"' + (v.politica.tardia==='retiene'?' selected':'') + '>Retener cobro y cobrar de nuevo</option><option value="sin_cargo"' + (v.politica.tardia==='sin_cargo'?' selected':'') + '>Sin cargo adicional</option></select></div></div>' +
    '<div class="section-card"><div class="section-card-title">Franjas libres · próximos 14 días (' + libres.length + ')</div>' + (prev || '<span style="color:var(--muted);font-size:12px">Sin huecos: revisa la disponibilidad.</span>') + '</div>';
}
function dispFranja(d,i,w,val){ const f = DB.cfg.agenda.semana[d][i]; const nf = f.slice(); nf[w]=val; if (minDeHora(nf[1]) <= minDeHora(nf[0])){ toast('La hora de fin debe ser posterior al inicio','err'); } else f[w]=val; RENDERERS.agenda(); }
function dispAddFranja(d){ DB.cfg.agenda.semana[d] = DB.cfg.agenda.semana[d]||[]; DB.cfg.agenda.semana[d].push(['09:00','13:00']); RENDERERS.agenda(); }
function dispDelFranja(d,i){ DB.cfg.agenda.semana[d].splice(i,1); RENDERERS.agenda(); }
function dispAddBloqueo(){ const d=document.getElementById('bq-desde').value, h=document.getElementById('bq-hasta').value||d, m=document.getElementById('bq-motivo').value; if(!d){ toast('Indica la fecha de inicio','err'); return; } if(h<d){ toast('La fecha final es anterior','err'); return; } DB.cfg.agenda.bloqueos.push({desde:d,hasta:h,motivo:m||'Bloqueo'}); RENDERERS.agenda(); }
function dispDelBloqueo(i){ DB.cfg.agenda.bloqueos.splice(i,1); RENDERERS.agenda(); }
function dispVisita(k,val){ if (k==='tardia') DB.cfg.visita.politica.tardia=val; else if (k==='reprogramarGratisHoras') DB.cfg.visita.politica.reprogramarGratisHoras=Number(val)||0; else DB.cfg.visita[k]=Math.max(0,Number(val)||0); RENDERERS.agenda(); }

function refrescar(){ renderPaginaActual(); }

  c.visita.cobro = Object.assign({}, c.visita.cobro, { importe:imp, estado:'cobrada', fecha:hoy() });
  DB.cobros.push({ id:uid('cob'), casoId:c.id, importe:imp, concepto:'Visita técnica', fecha:hoy(), estado:'cobrado', metodo:'efectivo', tipo:'visita', descontable:visitaDescuento(DB.cfg).descontable, descontablePct:visitaDescuento(DB.cfg).pct });
  c.eventos.push({ fecha:hoy(), tipo:'cobro', texto:'Cobrada la visita técnica (' + fmtEur(imp) + ')', autor:'reformista' });
  toast('Cobro de visita registrado · ' + fmtEur(imp)); refrescar(); if (_fichaId===id && document.getElementById('modal-bg').classList.contains('open')) renderFicha();
}
function eximirVisitaModal(id){

function eximirVisita(id){
