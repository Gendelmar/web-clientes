<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18100a">
<title>Mi reforma — Panel del cliente v1</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4efe6;--stone:#e5ddd0;--warm:#c4b49a;--terra:#8a5c38;--deep:#18100a;--ink:#1c140d;--accent:#c96f28;--accent-d:#a9561a;--light:#faf7f2;--muted:#6f6150;--ok:#2f6b45;--danger:#a03030;--amber:#8a5a00;--border:#ddd5c5;--r:16px;--nav:68px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:16px;line-height:1.4;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;color:var(--terra)}
h2{font-size:26px;margin-bottom:8px}h3{font-size:21px;margin-bottom:6px}
.muted{color:var(--muted);font-size:14px}.sp{flex:1;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.btn{min-height:48px;padding:0 20px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--border);background:#fff;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent-d);border-color:var(--accent-d);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.dng{color:var(--danger);border-color:#e3b4b4}.btn.blk{width:100%}.btn.sm{min-height:44px;padding:0 14px;font-size:14px}.btn[disabled]{opacity:.45}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--stone);color:var(--muted)}
.pill.ok{background:#dff1e5;color:var(--ok)}.pill.wip{background:#fff1d6;color:var(--amber)}.pill.bad{background:#f8e0e0;color:var(--danger)}.pill.new{background:#e6edf8;color:#1d4b8a}
.field{display:block;margin-bottom:12px}.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input:where(:not([type=checkbox]):not([type=radio]):not([type=file])),select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fff}
textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:6px 0;font-size:15px}.chk input{width:26px;height:26px;margin-top:2px;flex-shrink:0;accent-color:var(--ok)}
.progress{height:10px;background:var(--stone);border-radius:8px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--ok);transition:width .3s}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.big{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:600;line-height:1.05;color:var(--ink)}
.info{background:#e9f0fa;border:1.5px solid #b8cdea;color:#1d3f70;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.warn{background:#fff6e0;border:1.5px solid #e6c16b;color:#6a4a00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.good{background:#e6f4ea;border:1.5px solid #9fd0b0;color:#1f5a38;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}

/* Estructura */
.top{position:sticky;top:0;z-index:30;background:var(--deep);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
.top .logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--accent)}
.top small{display:block;font-size:12px;color:var(--warm)}
.shell{max-width:1120px;margin:0 auto;display:block}
main{padding:14px 14px calc(var(--nav) + 90px);min-width:0}
.side{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--deep);display:flex;justify-content:space-around;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.tab{position:relative;flex:1;min-height:56px;color:rgba(255,255,255,.65);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:10px}
.tab i{font-style:normal;font-size:21px}.tab.on{color:#fff;background:rgba(201,111,40,.28)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);background:var(--accent);color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:230px 1fr;gap:20px;padding:0 14px}
  .side{display:block;position:sticky;top:70px;align-self:start;padding-top:16px}
  .side .tab{flex-direction:row;justify-content:flex-start;gap:10px;color:var(--ink);font-size:15px;padding:0 12px;width:100%;margin-bottom:4px;min-height:48px}
  .side .tab.on{background:#fff;border:1px solid var(--border);color:var(--terra)}.side .badge{position:static;margin-left:auto}
  .tabbar{display:none}main{padding-bottom:110px}
}

/* Fases */
.stepper{display:flex;gap:0;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.step{flex:1 0 74px;text-align:center;font-size:12px;color:var(--muted);position:relative;padding:0 4px}
.step b{display:flex;margin:0 auto 6px;width:34px;height:34px;border-radius:50%;background:var(--stone);align-items:center;justify-content:center;font-size:15px;position:relative;z-index:1}
.step::before{content:'';position:absolute;top:16px;left:-50%;width:100%;height:3px;background:var(--stone)}
.step:first-child::before{display:none}
.step.done b{background:var(--ok);color:#fff}.step.done::before,.step.now::before{background:var(--ok)}
.step.now b{background:var(--accent-d);color:#fff;box-shadow:0 0 0 4px rgba(201,111,40,.25)}.step.now{color:var(--ink);font-weight:600}
.hero{background:linear-gradient(150deg,#2a1c10,#18100a);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px}
.hero h1{color:#fff;font-size:28px;line-height:1.1;margin-bottom:6px}.hero p{color:#e6d8c3;font-size:15px}
.todo{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:64px;background:#fff;border:2px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.todo .ic{font-size:26px}.todo b{display:block}.todo span{font-size:13px;color:var(--muted)}.todo .go{color:var(--accent-d);font-size:26px}
.room-acc{border:1.5px solid var(--border);border-radius:14px;margin-bottom:10px;background:#fff;overflow:hidden}
.room-acc summary{list-style:none;min-height:56px;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.room-acc summary::-webkit-details-marker{display:none}
.room-acc summary::after{content:'▾';color:var(--muted)}.room-acc[open] summary::after{content:'▴'}
.ln{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ln .sp{display:block}
.ln>b{white-space:nowrap}
.ln>.tag{margin:0;flex-shrink:0;align-self:flex-start;min-width:84px;text-align:center}
.room-acc .ln{padding:9px 14px;border-top:1px dashed var(--border)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:8px;padding:2px 7px;margin-left:4px}
.tag.add{background:#dfeaf8;color:#1d4b8a}.tag.del{background:#f8e0e0;color:var(--danger)}.tag.mod{background:#fff1d6;color:var(--amber)}
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--stone)}
.tl .it{position:relative;margin-bottom:14px}
.tl .it::before{content:'';position:absolute;left:-24px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--warm);border:3px solid var(--cream)}
.tl .it.done::before{background:var(--ok)}.tl .it.now::before{background:var(--accent-d);box-shadow:0 0 0 4px rgba(201,111,40,.25)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:1px solid var(--border);padding:0;background:var(--stone)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-style:normal;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:44px;padding:0 16px;border:1.5px solid var(--border);border-radius:22px;background:#fff;font-size:14px;font-weight:500}.chip.on{border-color:var(--accent);background:#fff1e3;font-weight:600}
.slot{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;border:2px solid var(--border);border-radius:14px;background:#fff;padding:10px 14px;margin-bottom:10px}
.slot.on{border-color:var(--accent);background:#fff1e3}
.sig{width:100%;height:170px;border:2px dashed var(--warm);border-radius:14px;background:#fff;touch-action:none;display:block}
.stars button{font-size:36px;min-width:52px;min-height:52px;color:var(--warm)}.stars button.on{color:#e6a100}
.bubble{max-width:86%;padding:10px 14px;border-radius:16px;margin-bottom:8px;font-size:15px;white-space:pre-wrap}
.bubble.yo{margin-left:auto;background:var(--accent-d);color:#fff;border-bottom-right-radius:4px}.bubble.el{background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble small{display:block;font-size:11px;opacity:.7;margin-top:2px}

/* Correo y WhatsApp simulados */
.mail{background:#fff;border:1px solid #cfc6b6;border-radius:12px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.08);margin-bottom:14px}
.mail .mh{background:#f1ede5;padding:10px 14px;font-size:13px;color:#555;border-bottom:1px solid #ddd}.mail .mh b{color:#111}
.mail .mb{padding:16px;font-size:15px}.mail .mb p{margin-bottom:10px}
.mail .brand{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--terra);font-weight:600;margin-bottom:8px}
.mail table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.mail td{padding:5px 0;border-bottom:1px dashed #ddd}.mail td:last-child{text-align:right;font-weight:600}
.wa{background:#e5ddd5;border-radius:14px;padding:14px;margin-bottom:14px}
.wa .b{background:#dcf8c6;border-radius:12px 12px 12px 2px;padding:10px 12px;font-size:14px;white-space:pre-wrap;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.wa small{display:block;text-align:right;color:#667;font-size:11px}
.cta{display:flex;min-height:52px;align-items:center;justify-content:center;background:var(--accent-d);color:#fff;border-radius:12px;font-weight:600;text-decoration:none;padding:0 18px;margin:12px 0;text-align:center}

/* Hojas, avisos, simulador */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,6,2,.55);display:none}.ov.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
@media(min-width:760px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;max-height:88vh}}
.grab{width:44px;height:5px;background:var(--warm);border-radius:4px;margin:0 auto 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px);z-index:70;background:var(--deep);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;max-width:92vw}.toast.on{display:block}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}.viewer.on{display:flex}.viewer img{flex:1;min-height:0;width:100%;object-fit:contain}.viewer .vb{padding:12px;background:#111;display:flex;gap:10px;align-items:center;color:#fff}
.simbtn{background:#2d6a4f;color:#fff;border-radius:12px;min-width:48px;min-height:48px;font-size:22px;line-height:1}
@media(min-width:900px){.toast{bottom:20px}}
.simbox button.btn{margin:0 6px 8px 0}
.demo-home{max-width:760px;margin:0 auto;padding:20px 14px 60px}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important;padding:16mm;color:#000;background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a href="#main" class="sr">Saltar al contenido</a>
<div id="app"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Ventana"><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Foto"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="print-area"></div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════
// 1. UTILIDADES
// ═══════════════════════════════════════════════════════
const LS = 'panelClienteV1';
const $ = s => document.querySelector(s);
const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = p => (p || 'id') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const NF2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 });
const NF0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits:0 });
const eur = v => NF2.format(r2(v)) + ' €';
const eur0 = v => NF0.format(Math.round(v)) + ' €';
const fnum = v => String(Math.round(v * 100) / 100).replace('.', ',');
const num = v => { const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const D_MS = 86400000;
const fdia = t => new Date(t).toLocaleDateString('es-ES', { day:'numeric', month:'short' });
const ffecha = t => new Date(t).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
const fhora = t => new Date(t).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
const fsemana = t => new Date(t).toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
const MARGEN = 22, IVA = 21, K = (1 + MARGEN / 100) * (1 + IVA / 100);
const fin = sub => r2(sub * K);
const conIva = v => r2(v * (1 + IVA / 100));

// ═══════════════════════════════════════════════════════
// 2. CATÁLOGO RESUMIDO Y CASO DE EJEMPLO (reforma integral estándar)
// ═══════════════════════════════════════════════════════
const C = {
  demolicion:['Demolición y retirada de escombros','m²','m2',28], solado:['Suelo cerámico / porcelánico','m²','m2',52], tarima:['Tarima flotante','m²','m2',38],
  alicatado:['Alicatado de paredes','m²','pared',46], gotele:['Quitar gotelé y alisar paredes','m²','pared',14], pint_pared:['Pintura de paredes','m²','pared',8.7], pint_techo:['Pintura de techo','m²','m2',9.2],
  rodapie:['Rodapié','ml','ml',10.5], falso_techo:['Falso techo de pladur','m²','m2',30],
  electricidad:['Instalación eléctrica de la estancia','ud','fijo',{ salon:720, cocina:980, bano:560, habitacion:420, pasillo:320 }],
  font_bano:['Fontanería de baño','ud','fijo',1420], font_cocina:['Fontanería de cocina','ud','fijo',480], sanitarios:['Inodoro, lavabo y grifería','ud','fijo',500], ducha:['Plato de ducha y mampara','ud','fijo',650],
  mueble_bano:['Mueble de baño con espejo','ud','fijo',480], muebles_coc:['Muebles y encimera de cocina','ml','mlm',480], puerta:['Puerta interior','ud','ud',330], radiador:['Radiador','ud','ud',190],
  humedades:['Tratamiento de humedades','ud','fijo',380], tuberias:['Sustitución de tuberías y bajantes','ud','fijo',650], punto_luz:['Punto de luz adicional','ud','fijo',120],
};
function qtyBase(b, m2) { if (b === 'm2') return r2(m2); if (b === 'pared') return r2(Math.sqrt(m2) * 4 * 2.4); if (b === 'ml') return r2(Math.sqrt(m2) * 4 * 0.9); if (b === 'mlm') return Math.max(3, Math.round(m2 * 0.5)); return 1; }
function linea(k, tipo, m2, cant, nota) { const c = C[k]; return { k, l:c[0], u:c[1], cant:cant != null ? cant : qtyBase(c[2], m2), precio:typeof c[3] === 'object' ? (c[3][tipo] != null ? c[3][tipo] : 400) : c[3], nota:nota || '' }; }
const PEDIDO = {
  pasillo:['tarima', 'pint_pared', 'pint_techo', 'rodapie', 'puerta'],
  salon:['tarima', 'gotele', 'pint_pared', 'pint_techo', 'rodapie', 'electricidad', 'radiador', 'falso_techo'],
  cocina:['demolicion', 'solado', 'alicatado', 'muebles_coc', 'font_cocina', 'electricidad', 'pint_techo'],
  bano:['demolicion', 'solado', 'alicatado', 'font_bano', 'sanitarios', 'ducha', 'mueble_bano', 'electricidad', 'pint_techo'],
  habitacion:['tarima', 'pint_pared', 'pint_techo', 'rodapie', 'electricidad', 'puerta', 'radiador'],
};
const ESTANCIAS = [['pasillo', 'Pasillo y entrada', 9], ['salon', 'Salón-comedor', 26], ['cocina', 'Cocina', 11], ['bano', 'Baño principal', 6.5], ['bano', 'Baño secundario', 4.5], ['habitacion', 'Dormitorio principal', 14], ['habitacion', 'Dormitorio 2', 10.5], ['habitacion', 'Dormitorio 3', 8]];
const HITOS = [['Demolición y preparación', 3], ['Instalaciones (fontanería y electricidad)', 4], ['Albañilería y tabiquería', 6], ['Alicatado', 4], ['Suelos', 4], ['Carpintería y puertas', 3], ['Pintura', 3], ['Limpieza y remates', 2]];
const FASES = [['recibida', 'Solicitud'], ['visita', 'Visita'], ['propuesta', 'Presupuesto'], ['aceptada', 'Aceptación'], ['obra', 'Obra'], ['remates', 'Entrega'], ['cerrada', 'Cerrada']];
function stepIdx(f) { return { recibida:0, visita_propuesta:1, visita_confirmada:1, propuesta:2, aceptada:3, obra:4, remates:5, cerrada:6 }[f]; }

function nuevoCaso() {
  const est = ESTANCIAS.map(([t, n, m]) => ({ id:uid('e'), tipo:t, nombre:n, m2:m, lineas:PEDIDO[t].map(k => linea(k, t, m)) }));
  const tok = Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 8);
  const t0 = Date.now();
  return {
    ver:1, token:tok, ref:'REF-' + (3000 + Math.floor(Math.random() * 900)), creado:t0, dias:0,
    cliente:{ nombre:'Laura Martín', email:'laura.martin@ejemplo.es', tel:'612 345 678', direccion:'C/ Alcalá 245, 4.º B · 28027 Madrid' },
    reformista:{ empresa:'Anatoliy Reformas', contacto:'Anatoliy', tel:'600 000 000', email:'hola@anatoliyreformas.es', iban:'ES00 0000 0000 0000 0000 0000' },
    fase:'recibida',
    datos:[
      { id:'nif', label:'NIF / NIE (para el contrato)', tipo:'text', valor:'', ph:'12345678Z' },
      { id:'inicio', label:'¿Cuándo te gustaría empezar la obra?', tipo:'date', valor:'' },
      { id:'acceso', label:'Acceso al edificio', tipo:'select', opts:['Ascensor', 'Solo escaleras', 'Planta baja'], valor:'' },
      { id:'habitada', label:'¿Vivirás en la casa durante la obra?', tipo:'select', opts:['Sí', 'No'], valor:'' },
      { id:'fotos', label:'Fotos del estado actual de la vivienda', tipo:'fotos', valor:[] },
    ],
    versiones:[{ id:'V1', tipo:'estimacion', fecha:t0, estado:'vigente', est }],
    visita:{ estado:'no', franjas:[], elegida:null, importe:60 },
    aceptacion:null,
    obra:{ inicio:null, hitos:[], fotos:[], cambios:[], adendas:[], solicitudes:[], remates:[], cierre:null },
    plan:[{ label:'Señal al aceptar', pct:30, cuando:'aceptacion' }, { label:'Al completar instalaciones', pct:30, cuando:'hito2' }, { label:'A la entrega', pct:40, cuando:'entrega' }],
    cobros:[], eventos:[], avisos:[], chat:[], valoracion:null,
  };
}

// ═══════════════════════════════════════════════════════
// 3. LÓGICA (funciones puras)
// ═══════════════════════════════════════════════════════
const subL = l => r2(l.cant * l.precio);
const subEst = e => r2(e.lineas.reduce((s, l) => s + subL(l), 0));

        avisar('inicio', 'Tu obra comienza el ' + fdia(ob.inicio) + ' · ' + N.ref, ['¡Empezamos! Tu obra comienza el ' + ffecha(ob.inicio) + '.', 'Cada hito completado aparecerá en tu panel con sus fotos.'], 'Tu obra empieza el ' + fdia(ob.inicio) + ' 🏗️ Sigue el avance en tu panel:', { sec: 'obra' });
      }
      ob.hitos.forEach((h, i) => { if (h.estado === 'hecho' && !o.hitos.includes(h.id + ':hecho')) {
        ev('Hito completado: ' + h.nombre, 'reformista');
        avisar('hito', 'Hito completado: ' + h.nombre, ['Hemos completado «' + h.nombre + '». Ya puedes ver las fotos en tu panel. Avance de la obra: ' + progresoObra(N) + ' %.'], 'Hito completado ✅ ' + h.nombre + ' (' + progresoObra(N) + ' % de la obra). Fotos en tu panel:', { sec: 'obra' });
        if (i === 1) { const d = planPagos(N).find(t => t.estado === 'debido'); if (d) avisar('pago', 'Toca el pago: ' + d.label, ['Hemos completado las instalaciones, así que corresponde el pago del ' + d.pct + ' % (' + eur(d.falta) + ').', 'Tienes los datos para pagar en la sección Pagos.'], 'Pago del hito «' + d.label + '»: ' + eur0(d.falta) + '. Datos en tu panel:', { sec: 'pagos' }); }
      } });
      ob.cambios.filter(c => !o.camb.includes(c.id)).forEach(c => {
        ev('Tu reformista te propone un cambio: ' + c.concepto, 'reformista');
        avisar('cambio', 'Cambio pendiente de tu respuesta · ' + N.ref, ['Tu reformista ha registrado un cambio: «' + c.concepto + '» (' + eur(conIva(c.importe)) + ' IVA incl.). Motivo: ' + c.motivo + '.', 'Necesitamos que lo aceptes o nos cuentes tus dudas. No se hará nada sin tu visto bueno.'], 'Cambio pendiente: «' + c.concepto + '» (' + eur0(conIva(c.importe)) + '). Respóndelo en tu panel:', { sec: 'cambios' });
      });
      ob.adendas.filter(a => !o.ad.includes(a.id)).forEach(a => {
        ev('Tu reformista ha preparado la adenda ' + a.id + ' para firmar', 'reformista');
        avisar('adenda', 'Adenda ' + a.id + ' para firmar · ' + N.ref, ['Hemos agrupado los cambios en la adenda ' + a.id + ' por ' + eur(conIva(a.delta)) + '.', 'Puedes revisarla y firmarla desde tu panel.'], 'Adenda ' + a.id + ' lista para firmar (' + eur0(conIva(a.delta)) + '). Revísala en tu panel:', { sec: 'cambios' });
      });
      ob.solicitudes.forEach(s => { if (s.estado !== 'abierta' && o.sol.includes(s.id + ':abierta')) ev('Tu reformista ha valorado tu petición', 'reformista'); });
      ob.remates.forEach(r => { if (r.estado === 'resuelto' && o.rem.includes(r.id + ':abierto')) ev('Tu reformista ha resuelto un remate: ' + r.texto, 'reformista'); });
      if (o.fase !== 'remates' && N.fase === 'remates') {
        ev('Tu obra está terminada: revisión final', 'reformista');
        avisar('terminada', 'Tu obra está terminada · revisión final · ' + N.ref, ['¡Hemos terminado! Recorre tu vivienda con calma y revisa cada estancia desde tu panel.', 'Indica los remates que veas y, cuando todo esté bien, firma tu conformidad: así damos la obra por cerrada.'], 'Tu obra está terminada 🎉 Haz la revisión final y firma tu conformidad en tu panel:', { sec: 'entrega' });
      }
      if (N.cobros.length > o.cob) N.cobros.slice(o.cob).forEach(c => ev('Pago recibido: ' + c.concepto + ' (' + eur0(c.importe) + ')', 'reformista'));
      if (o.fase !== 'cerrada' && N.fase === 'cerrada' && !(ob.cierre && ob.cierre.conformidad && ob.cierre.conformidad.firma !== SIG_DEMO)) {
        avisar('cerrada', 'Obra cerrada · acta y garantía · ' + N.ref, ['Tu obra ha quedado cerrada.', 'Ya tienes disponible el acta de entrega y la información de la garantía en tu panel.'], 'Obra cerrada ✔ Gracias por confiar en nosotros. Tu acta y garantía están en tu panel:', { sec: 'entrega' });
      }
    }
    guardar();
    if (nuevo) { location.hash = '#/correo'; }
    try { render(); } catch (e) { console.error('render cliente', e); }
    return true;
  };

  // Enlace de demostración legible
  try { linkPanel = (s, sec) => 'https://panel.anatoliyreformas.es/c/' + s.token + (sec ? '/' + sec : ''); } catch (e) {}
  // Los enlaces de los avisos abren el panel dentro del prototipo
  document.addEventListener('click', (e) => { const a = e.target.closest && e.target.closest('a.cta'); if (a) { e.preventDefault(); if (S) { location.hash = '#/c/' + S.token + '/inicio'; } } });
  try { render(); } catch (e) {}
})();

</script>
</body>
</html>
