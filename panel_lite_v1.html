<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18100a">
<title>Panel Lite v1 — Revisión en visita técnica</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#f4efe6;--stone:#e5ddd0;--warm:#c4b49a;--terra:#8a5c38;--deep:#18100a;--ink:#1c140d;
  --accent:#c96f28;--accent-d:#a9561a;--light:#faf7f2;--muted:#6f6150;--ok:#2f6b45;--danger:#a03030;--amber:#8a5a00;
  --border:#ddd5c5;--r:14px;--bar:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;font-size:16px;line-height:1.35}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--accent-d);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Cabecera ── */
.top{position:sticky;top:0;z-index:30;background:var(--deep);color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top))}
.top .back{min-width:48px;min-height:48px;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:15px;padding:0 12px;display:inline-flex;align-items:center;gap:4px}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt small{display:block;font-size:12px;color:var(--warm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ver{background:var(--accent-d);color:#fff;border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.ver.env{background:var(--ok)}
.save{font-size:11px;color:#9ad1a8;white-space:nowrap;min-width:64px;text-align:right}
.save.err{color:#ffb3b3}

/* ── Estructura ── */
#app{max-width:1180px;margin:0 auto}
main{padding:14px 14px calc(var(--bar) + 26px)}
.cols{display:block}
.pane-list{display:block}.pane-room{display:block}
body[data-view=room] .pane-list{display:none}
body[data-view=hub] .pane-room{display:none}
@media(min-width:980px){
  .cols{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
  body[data-view=room] .pane-list,body[data-view=hub] .pane-list,body[data-view=room] .pane-room,body[data-view=hub] .pane-room{display:block}
  .pane-list{position:sticky;top:76px;max-height:calc(100vh - 170px);overflow-y:auto}
  .only-narrow{display:none!important}
}
@media(max-width:979px){.only-wide{display:none!important}}

/* ── Componentes ── */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3,.h{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--terra);margin-bottom:6px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-bottom:6px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--border);background:#fff}
.btn.pri{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.dng{color:var(--danger);border-color:#e3b4b4}
.btn.blk{width:100%}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--stone);color:var(--muted)}
.pill.ok{background:#dff1e5;color:var(--ok)}.pill.wip{background:#fff1d6;color:var(--amber)}.pill.env{background:#dff1e5;color:var(--ok)}.pill.new{background:#e6edf8;color:#1d4b8a}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font-size:14px;margin:0 6px 6px 0}
.progress{height:8px;background:var(--stone);border-radius:6px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ok);transition:width .25s}
.field{display:block;margin-bottom:10px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
input:where(:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=hidden])),select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}

/* ── Inicio ── */
.hero{text-align:center;padding:20px 8px 6px}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--terra)}
.hero p{color:var(--muted)}
.big-total{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:600;line-height:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:15px}

/* ── Estancias (lista) ── */
.room{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px;min-height:76px}
.room.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,111,40,.18)}
.room .ico{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--stone);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.room.done .ico{background:#dff1e5}
.room b{display:block;font-size:16px}
.room .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.room .amt{text-align:right;font-weight:600;white-space:nowrap}
.room .amt small{display:block;font-weight:400;font-size:11px}
.dlt-up{color:var(--danger)}.dlt-dn{color:var(--ok)}

/* ── Detalle de estancia ── */
.rhead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.rhead input{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;min-height:52px;border-color:transparent;background:transparent;padding:0 6px}
.rhead input:focus{background:#fff;border-color:var(--accent)}
.nav{min-width:48px;min-height:48px;border-radius:12px;background:#fff;border:1.5px solid var(--border);font-size:20px}
.stepper{display:inline-flex;align-items:stretch;border:1.5px solid var(--border);border-radius:12px;background:#fff;overflow:hidden}
.stepper button{min-width:48px;min-height:48px;font-size:22px;font-weight:600;color:var(--terra)}
.stepper input{width:72px;min-height:48px;border:none;border-radius:0;text-align:center;font-weight:600;padding:0 4px}
.stepper.sm button{min-width:44px;min-height:44px}.stepper.sm input{width:64px;min-height:44px}
.work{background:#fff;border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.work.ok{border-color:#9fd0b0;background:#f6fbf7}
.work-top{display:flex;gap:12px;align-items:flex-start;padding:12px}
.chk{width:48px;height:48px;border-radius:50%;border:2.5px solid var(--warm);background:#fff;font-size:24px;color:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.work.ok .chk{background:var(--ok);border-color:var(--ok)}
.work-t{flex:1;min-width:0}
.work-t b{display:block;font-size:16px;line-height:1.25}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:8px;padding:2px 7px;margin-right:4px;background:var(--stone);color:var(--muted)}
.tag.add{background:#dfeaf8;color:#1d4b8a}.tag.mod{background:#fff1d6;color:var(--amber)}
.work-sub{font-weight:600;white-space:nowrap;text-align:right;font-size:15px}
.work-sub small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.work-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 12px 12px}
.work-edit{padding:0 12px 12px;display:none}
.work.open .work-edit{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.sheet{overflow-x:hidden}
.cat-i b{min-width:0}
.quit{background:#faf0f0;border:1.5px dashed #e3b4b4;border-radius:var(--r);padding:10px;margin-bottom:10px}
.quit .q{display:flex;gap:10px;align-items:center;padding:6px 0;text-decoration:none}
.quit .q span{flex:1;text-decoration:line-through;color:var(--muted)}
.cm{background:var(--light);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:flex-start}
.cm p{flex:1;white-space:pre-wrap;word-break:break-word}
.cm small{display:block;color:var(--muted);font-size:11px}
.x{min-width:44px;min-height:44px;border-radius:10px;color:var(--danger);font-size:18px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:8px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--stone);border:1px solid var(--border);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-style:normal;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addph{display:inline-flex}
.addph input{position:absolute;width:1px;height:1px;opacity:0}

/* ── Barra inferior ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--deep);color:#fff;padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px}
.bar .tot{flex:1;min-width:0}
.bar small{display:block;font-size:11px;color:var(--warm)}
.bar b{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;line-height:1}
.bar .d{font-size:12px;margin-left:6px}
.bar .btn{min-height:50px}

/* ── Hojas, visor y avisos ── */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,6,2,.55);display:none}
.ov.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
@media(min-width:760px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px;max-height:86vh}}
.sheet .grab{width:44px;height:5px;background:var(--warm);border-radius:4px;margin:0 auto 10px}
.cat-i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;padding:8px 12px;border:1.5px solid var(--border);border-radius:12px;background:#fff;margin-bottom:8px}
.cat-i b{flex:1;font-weight:500}
.cat-i small{color:var(--muted);white-space:nowrap}
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column}
.viewer.on{display:flex}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vb{padding:12px;background:#111;display:flex;gap:10px;align-items:center}
.viewer .vb input{flex:1;background:#222;border-color:#444;color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bar) + 14px);z-index:70;background:var(--deep);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;align-items:center;gap:14px;max-width:92vw}
.toast.on{display:flex}
.toast button{color:#ffd9a8;font-weight:700;min-height:44px;padding:0 6px}
.warn{background:#fff6e0;border:1.5px solid #e6c16b;color:#6a4a00;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.info{background:#e9f0fa;border:1.5px solid #b8cdea;color:#1d3f70;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.diff{padding:6px 0;border-bottom:1px dashed var(--border);font-size:14px;display:flex;gap:8px}
.diff i{font-style:normal;font-weight:700;width:20px;text-align:center}
.diff .a{color:#1d4b8a}.diff .q{color:var(--danger)}.diff .m{color:var(--amber)}
.msgbox{width:100%;min-height:180px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-view="home">
<a href="#main" class="sr">Saltar al contenido</a>
<div id="app"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Ventana"><div class="sheet" id="sheet"></div></div>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Foto"></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-t"></span><button id="toast-u" type="button" hidden>Deshacer</button></div>
<script>
'use strict';
// ═══════════════════════════════════════════════════════
// 1. UTILIDADES
// ═══════════════════════════════════════════════════════
const LS_KEY = 'panelLiteV1';
const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const uid = p => (p || 'id') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const NF2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits:2, maximumFractionDigits:2 });
const NF0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits:0 });
const eur = v => NF2.format(r2(v)) + ' €';
const eur0 = v => NF0.format(Math.round(v)) + ' €';
const num = v => { const n = Number(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const fmtNum = v => String(Math.round(v * 100) / 100).replace('.', ',');
const hhmm = d => new Date(d).toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' });
const fecha = d => new Date(d).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' });

// ═══════════════════════════════════════════════════════
// 2. CATÁLOGO DE TRABAJOS (reforma integral estándar)
//    p = precio unitario sin IVA ni margen (mano de obra + material, calidad media)
//    b = base de la cantidad: m2 · pared · ml · mlm (muebles) · ud · fijo
// ═══════════════════════════════════════════════════════
const TIPOS = {
  pasillo:    { n:'Pasillo / entrada', i:'🚪' },
  salon:      { n:'Salón-comedor',     i:'🛋️' },
  cocina:     { n:'Cocina',            i:'🍳' },
  bano:       { n:'Baño',              i:'🚿' },
  habitacion: { n:'Dormitorio',        i:'🛏️' },
  otro:       { n:'Otra estancia',     i:'📐' },
};
const CAT = [
  { k:'demolicion',   l:'Demolición y retirada de escombros',  u:'m²', b:'m2',    p:28,  t:['cocina','bano','pasillo'] },
  { k:'solado',       l:'Suelo cerámico / porcelánico',        u:'m²', b:'m2',    p:52,  t:['cocina','bano','pasillo'] },
  { k:'tarima',       l:'Tarima flotante',                      u:'m²', b:'m2',    p:38,  t:['salon','habitacion','pasillo'] },
  { k:'alicatado',    l:'Alicatado de paredes',                 u:'m²', b:'pared', p:46,  t:['cocina','bano'] },
  { k:'gotele',       l:'Quitar gotelé y alisar paredes',       u:'m²', b:'pared', p:14,  t:['salon','habitacion','pasillo'] },
  { k:'pint_pared',   l:'Pintura de paredes',                   u:'m²', b:'pared', p:8.7, t:['salon','habitacion','pasillo','cocina'] },
  { k:'pint_techo',   l:'Pintura de techo',                     u:'m²', b:'m2',    p:9.2, t:['salon','habitacion','pasillo','cocina','bano'] },
  { k:'rodapie',      l:'Rodapié',                              u:'ml', b:'ml',    p:10.5,t:['salon','habitacion','pasillo'] },
  { k:'falso_techo',  l:'Falso techo de pladur',                u:'m²', b:'m2',    p:30,  t:['salon','pasillo','bano'] },
  { k:'tabique',      l:'Tabique de pladur',                    u:'m²', b:'pared', p:32,  t:[] },
  { k:'electricidad', l:'Instalación eléctrica de la estancia', u:'ud', b:'fijo',  p:{ salon:720, cocina:980, bano:560, habitacion:420, pasillo:320, otro:400 }, t:['salon','cocina','bano','habitacion','pasillo'] },
  { k:'font_bano',    l:'Fontanería de baño',                   u:'ud', b:'fijo',  p:1420,t:['bano'] },
  { k:'font_cocina',  l:'Fontanería de cocina',                 u:'ud', b:'fijo',  p:480, t:['cocina'] },
  { k:'impermeab',    l:'Impermeabilización',                   u:'ud', b:'fijo',  p:260, t:['bano'] },
  { k:'sanitarios',   l:'Inodoro, lavabo y grifería',           u:'ud', b:'fijo',  p:500, t:['bano'] },
  { k:'ducha',        l:'Plato de ducha y mampara',             u:'ud', b:'fijo',  p:650, t:['bano'] },
  { k:'mueble_bano',  l:'Mueble de baño con espejo',            u:'ud', b:'fijo',  p:480, t:['bano'] },
  { k:'muebles_coc',  l:'Muebles y encimera de cocina',         u:'ml', b:'mlm',   p:480, t:['cocina'] },
  { k:'puerta',       l:'Puerta interior',                      u:'ud', b:'ud',    p:330, t:['habitacion','salon','cocina','bano','pasillo'] },
  { k:'ventana',      l:'Ventana de PVC con rotura de puente',  u:'ud', b:'ud',    p:620, t:['salon','habitacion','cocina'] },
  { k:'armario',      l:'Armario empotrado',                    u:'ud', b:'ud',    p:380, t:['habitacion'] },
  { k:'radiador',     l:'Radiador',                             u:'ud', b:'ud',    p:190, t:['salon','habitacion','pasillo'] },
  { k:'humedades',    l:'Tratamiento de humedades',             u:'ud', b:'fijo',  p:380, t:[] },
  { k:'microcemento', l:'Microcemento',                         u:'m²', b:'pared', p:70,  t:[] },
  { k:'limpieza',     l:'Limpieza final de obra',               u:'ud', b:'fijo',  p:120, t:[] },
];
const CATK = Object.fromEntries(CAT.map(c => [c.k, c]));
const COMENT_RAPIDOS = ['Humedades visibles', 'Hay que picar el suelo', 'Posible muro de carga', 'Instalación antigua', 'El cliente duda del acabado', 'Acceso difícil para escombros'];

function precioBase(c, tipo) { return typeof c.p === 'object' ? (c.p[tipo] != null ? c.p[tipo] : (c.p.otro || 400)) : c.p; }
function qtyBase(b, m2) {
  m2 = Math.max(0, Number(m2) || 0);
  if (b === 'm2') return r2(m2);
  if (b === 'pared') return r2(Math.sqrt(m2) * 4 * 2.4);
  if (b === 'ml') return r2(Math.sqrt(m2) * 4 * 0.9);
  if (b === 'mlm') return Math.max(3, Math.round(m2 * 0.5));
  return 1;
}
function nuevoTrabajo(k, est, origen) {
  const c = CATK[k]; const cant = qtyBase(c.b, est.m2); const precio = precioBase(c, est.tipo);
  return { id:uid('t'), k, l:c.l, u:c.u, b:c.b, cant, precio, origen:origen || 'visita', confirmado:false, quitado:false, manual:false, nota:'', base: origen === 'cliente' ? { cant, precio } : null };
}

// ═══════════════════════════════════════════════════════
// 3. CASO DE EJEMPLO: reforma integral estándar (piso de 85 m²)
// ═══════════════════════════════════════════════════════
const PEDIDO_CLIENTE = {
  pasillo:    ['tarima', 'pint_pared', 'pint_techo', 'rodapie', 'puerta'],
  salon:      ['tarima', 'gotele', 'pint_pared', 'pint_techo', 'rodapie', 'electricidad', 'radiador', 'falso_techo'],
  cocina:     ['demolicion', 'solado', 'alicatado', 'muebles_coc', 'font_cocina', 'electricidad', 'pint_techo'],
  bano:       ['demolicion', 'solado', 'alicatado', 'font_bano', 'sanitarios', 'ducha', 'mueble_bano', 'electricidad', 'pint_techo'],
  habitacion: ['tarima', 'pint_pared', 'pint_techo', 'rodapie', 'electricidad', 'puerta', 'radiador'],
};
const ESTANCIAS_EJEMPLO = [
  ['pasillo', 'Pasillo y entrada', 9], ['salon', 'Salón-comedor', 26], ['cocina', 'Cocina', 11],
  ['bano', 'Baño principal', 6.5], ['bano', 'Baño secundario', 4.5],
  ['habitacion', 'Dormitorio principal', 14], ['habitacion', 'Dormitorio 2', 10.5], ['habitacion', 'Dormitorio 3', 8],
];
function estanciaDesde(tipo, nombre, m2, claves, origen) {
  const e = { id:uid('e'), tipo, nombre, m2, revisada:false, origenEst:origen || 'cliente', trabajos:[], comentarios:[], fotos:[] };
  (claves || []).forEach(k => e.trabajos.push(nuevoTrabajo(k, e, origen === 'visita' ? 'visita' : 'cliente')));
  return e;
}
function semilla() {
  const S = {
    ver:1, creado:Date.now(),
    caso:{ ref:'REF-2041', cliente:{ nombre:'Laura Martín', tel:'612 345 678', email:'laura.martin@ejemplo.es' }, direccion:'C/ Alcalá 245, 4.º B · 28027 Madrid', m2Total:85, tipo:'Reforma integral · piso de 85 m²' },

// ═══════════════════════════════════════════════════════
function subLinea(t) { return t.quitado ? 0 : r2((Number(t.cant) || 0) * (Number(t.precio) || 0)); }
function subEst(e) { return r2(e.trabajos.reduce((s, t) => s + subLinea(t), 0)); }
function totalesDe(est, aj) {
  const subtotal = r2(est.reduce((s, e) => s + subEst(e), 0));
  const margen = r2(subtotal * aj.margen / 100); const base = r2(subtotal + margen);
  const iva = r2(base * aj.iva / 100);
  return { subtotal, margen, base, iva, total:r2(base + iva) };
}
function finalDe(sub, aj) { return r2(sub * (1 + aj.margen / 100) * (1 + aj.iva / 100)); }
function recalcM2(e) { e.trabajos.forEach(t => { if (!t.manual && !t.quitado && ['m2', 'pared', 'ml', 'mlm'].includes(t.b)) t.cant = qtyBase(t.b, e.m2); }); }
function diffV3(S) {
  const o = { anadidos:[], quitados:[], modificados:[] };
  S.est.forEach(e => e.trabajos.forEach(t => {
    if (t.origen === 'visita') { if (!t.quitado) o.anadidos.push({ e, t }); }
    else if (t.quitado) o.quitados.push({ e, t });
    else if (t.base && (t.cant !== t.base.cant || t.precio !== t.base.precio)) o.modificados.push({ e, t });
  }));
  return o;
}
function estadoEst(e) {
  const vivos = e.trabajos.filter(t => !t.quitado); const ok = vivos.filter(t => t.confirmado).length;
  if (e.revisada) return 'revisada';
  return ok > 0 || e.comentarios.length || e.fotos.length ? 'curso' : 'pendiente';
}
function progreso(S) {
  const rev = S.est.filter(e => e.revisada).length;
  let tt = 0, tc = 0; S.est.forEach(e => e.trabajos.forEach(t => { if (!t.quitado) { tt++; if (t.confirmado) tc++; } }));
  return { revisadas:rev, total:S.est.length, trabajos:tt, confirmados:tc, pct:S.est.length ? Math.round(rev / S.est.length * 100) : 0 };
}
function mensajeCliente(S) {
  const tot = totalesDe(S.est, S.ajustes).total; const d = diffV3(S); const delta = r2(tot - S.v2.total);
  const lineas = [];
  d.anadidos.forEach(x => lineas.push('+ ' + x.e.nombre + ': ' + x.t.l));
  d.quitados.forEach(x => lineas.push('− ' + x.e.nombre + ': ' + x.t.l));
  d.modificados.forEach(x => lineas.push('~ ' + x.e.nombre + ': ' + x.t.l));
  const fotos = S.est.reduce((s, e) => s + e.fotos.length, 0);
  return 'Hola ' + S.caso.cliente.nombre.split(' ')[0] + ', tras la visita técnica a tu vivienda (' + S.caso.direccion.split('·')[0].trim() + ') te paso el presupuesto actualizado ' + S.v3.id + ' (' + S.caso.ref + '): ' + eur(tot) + ' (IVA incl.), ' + (delta >= 0 ? '+' : '−') + eur(Math.abs(delta)) + ' respecto a la ' + S.v2.id + (S.hist.length ? ' que te envié (' : ' que solicitaste (') + eur(S.v2.total) + ').' +
    (lineas.length ? '\n\nCambios tras la visita:\n' + lineas.slice(0, 8).join('\n') + (lineas.length > 8 ? '\n… y ' + (lineas.length - 8) + ' más' : '') : '\n\nSin cambios sobre lo que pediste.') +
    (fotos ? '\n\nHe adjuntado ' + fotos + ' foto(s) de la visita por estancias.' : '') +
    '\n\nPuedes verlo y aceptarlo aquí: [enlace al presupuesto — pendiente de conectar]';
}

function comprimir(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { const M = 1100; let w = img.naturalWidth, h = img.naturalHeight; const k = Math.min(1, M / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.65)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen no válida')); }; img.src = url;
  });
}

    '<div style="display:grid;gap:10px"><button class="btn pri blk" onclick="enviarWA()">💬 Abrir WhatsApp con el mensaje</button><div class="row"><button class="btn sp" onclick="copiarMsg()">📋 Copiar mensaje</button><button class="btn sp" onclick="correoSim()">✉ Simular correo</button></div>' +
    '<button class="btn ok blk" onclick="confirmarEnvio()">✓ Ya lo he enviado: marcar ' + S.v3.id + ' como enviada</button><button class="btn blk" onclick="cerrarSheet();guardarYSalir()">Mejor lo guardo y lo envío desde casa</button></div>');
}
function enviarWA() { const tel = S.caso.cliente.tel.replace(/\D/g, ''); window.open('https://wa.me/34' + tel + '?text=' + encodeURIComponent($('#msg').value), '_blank', 'noopener'); S.v3.canalIntento = 'WhatsApp'; }
function copiarMsg() {
  const t = $('#msg').value; const ok = () => toast('Mensaje copiado');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, () => { $('#msg').select(); document.execCommand('copy'); ok(); });
  else { $('#msg').select(); document.execCommand('copy'); ok(); }
}
function correoSim() { S.v3.canalIntento = 'Correo'; toast('Correo simulado: se enviaría a ' + S.caso.cliente.email); }
function confirmarEnvio() {
  const total = totalesDe(S.est, S.ajustes).total; S.v3.estado = 'enviada'; S.v3.enviadaAt = Date.now(); S.v3.canal = S.v3.canalIntento || 'WhatsApp'; S.v3.pendienteEnvio = false;
  S.hist.push({ id:S.v3.id, total, fecha:S.v3.enviadaAt, canal:S.v3.canal }); cerrarSheet(); S.ui.view = 'sent'; guardarYa(); render(); window.scrollTo(0, 0);
}
function crearNueva() {
  const id = nextId(); S.v3 = { id, estado:'borrador', pendienteEnvio:false, guardadaAt:null, enviadaAt:null, canal:null };
  S.v2 = { id:S.hist.length ? S.hist[S.hist.length - 1].id : S.v2.id, total:S.hist.length ? S.hist[S.hist.length - 1].total : S.v2.total, fecha:Date.now() };
  S.est.forEach(e => { e.revisada = false; e.trabajos.forEach(t => { t.confirmado = false; if (!t.quitado) t.base = { cant:t.cant, precio:t.precio }; t.origen = t.origen === 'visita' && !t.quitado ? 'cliente' : t.origen; }); e.trabajos = e.trabajos.filter(t => !t.quitado); });
  S.ui.view = 'hub'; guardarYa(); render(); toast('Nueva versión ' + id + ' en borrador (compara con la ' + S.v2.id + ' enviada)');
}

// ═══════════════════════════════════════════════════════
// 10. AJUSTES Y REINICIO
// ═══════════════════════════════════════════════════════
function abrirAjustes() {
  const bytes = (localStorage.getItem(LS_KEY) || '').length; const ro = !editable();
  sheet('<div class="row" style="margin-bottom:8px"><h3 class="sp" style="margin:0">Ajustes</h3><button class="btn" onclick="cerrarSheet()">Cerrar</button></div>' +
    '<label class="field"><span>Cliente</span><input type="text" id="aj-n" value="' + esc(S.caso.cliente.nombre) + '"></label><label class="field"><span>Teléfono (WhatsApp)</span><input type="tel" id="aj-t" value="' + esc(S.caso.cliente.tel) + '"></label><label class="field"><span>Dirección de la vivienda</span><input type="text" id="aj-d" value="' + esc(S.caso.direccion) + '"></label>' +
    '<div class="grid2"><label class="field"><span>Margen (%)</span><input id="aj-m" inputmode="decimal" value="' + S.ajustes.margen + '" ' + (ro ? 'disabled' : '') + '></label><label class="field"><span>IVA (%)</span><input id="aj-i" inputmode="decimal" value="' + S.ajustes.iva + '" ' + (ro ? 'disabled' : '') + '></label></div>' +
    '<p class="muted" style="margin-bottom:10px">Cambiar margen o IVA recalcula la ' + S.v3.id + '. La ' + S.v2.id + ' queda con el importe que vio el cliente.</p><button class="btn pri blk" onclick="guardarAjustes()">Guardar ajustes</button><p class="muted" style="margin-top:10px">Espacio usado en este dispositivo: ' + Math.round(bytes / 1024) + ' KB (límite aprox. 5.000 KB).</p>');
}
function guardarAjustes() {
  S.caso.cliente.nombre = $('#aj-n').value.trim() || S.caso.cliente.nombre; S.caso.cliente.tel = $('#aj-t').value.trim() || S.caso.cliente.tel; S.caso.direccion = $('#aj-d').value.trim() || S.caso.direccion;
  if (editable()) { S.ajustes.margen = Math.min(100, Math.max(0, num($('#aj-m').value))); S.ajustes.iva = Math.min(100, Math.max(0, num($('#aj-i').value))); }
  cerrarSheet(); guardarYa(); render(); toast('Ajustes guardados');
}
function confirmarReset() { sheet('<h3>Restablecer el ejemplo</h3><p class="muted" style="margin-bottom:12px">Se borrarán tus cambios, comentarios y fotos y volverá la reforma de ejemplo.</p><div class="row"><button class="btn sp" onclick="cerrarSheet()">Cancelar</button><button class="btn dng sp" onclick="resetOk()">Restablecer</button></div>'); }
function resetOk() { try { localStorage.removeItem(LS_KEY); } catch (e) {} S = semilla(); savedAt = null; UI.openW = null; cerrarSheet(); render(); toast('Ejemplo restablecido'); }

// ═══════════════════════════════════════════════════════
// 11. PRUEBAS INTERNAS  (consola: __tests())
// ═══════════════════════════════════════════════════════
window.__tests = function () {
  let ok = 0, tot = 0; const fails = []; const a = (d, c) => { tot++; if (c) ok++; else { fails.push(d); console.error('✗ ' + d); } };
  const T = semilla(); const aj = T.ajustes;
  a('cantidad por m²', qtyBase('m2', 12) === 12); a('cantidad de pared ≈ 4√m²×2,4', qtyBase('pared', 16) === 38.4);
  a('cantidad de rodapié ≈ 4√m²×0,9', qtyBase('ml', 16) === 14.4); a('muebles de cocina mínimo 3 ml', qtyBase('mlm', 2) === 3 && qtyBase('mlm', 12) === 6); a('ud/fijo = 1', qtyBase('ud', 50) === 1 && qtyBase('fijo', 50) === 1);
  a('precio de electricidad depende de la estancia', precioBase(CATK.electricidad, 'cocina') === 980 && precioBase(CATK.electricidad, 'habitacion') === 420);
  a('caso de ejemplo: 8 estancias (reforma integral estándar)', T.est.length === 8 && T.est.filter(e => e.tipo === 'bano').length === 2 && T.est.filter(e => e.tipo === 'habitacion').length === 3);
  const tt = totalesDe(T.est, aj);
  a('total = (subtotal + margen) × IVA', tt.base === r2(tt.subtotal + tt.margen) && tt.total === r2(tt.base + tt.iva) && tt.iva === r2(tt.base * 0.21));
  a('V2 del ejemplo coincide con el cálculo', T.v2.total === tt.total && tt.total > 20000 && tt.total < 60000);
  a('sin cambios: el diff está vacío', (() => { const d = diffV3(T); return !d.anadidos.length && !d.quitados.length && !d.modificados.length; })());
  const sal = T.est.find(e => e.tipo === 'salon'); const ft = sal.trabajos.find(t => t.k === 'falso_techo'); const t0 = totalesDe(T.est, aj).total;
  ft.quitado = true; const t1 = totalesDe(T.est, aj).total;
  a('quitar un trabajo baja el total y aparece en «quitados»', t1 < t0 && diffV3(T).quitados.length === 1);
  ft.quitado = false; const nt = nuevoTrabajo('humedades', sal, 'visita'); sal.trabajos.push(nt);
  a('añadir un trabajo sube el total y aparece en «añadidos»', totalesDe(T.est, aj).total > t0 && diffV3(T).anadidos.length === 1);
  a('un trabajo añadido en visita no tiene base del cliente', nt.base === null && nt.origen === 'visita');
  const tar = sal.trabajos.find(t => t.k === 'tarima'); tar.cant += 2;
  a('editar una cantidad se detecta como «modificado»', diffV3(T).modificados.some(x => x.t.id === tar.id));
  const total1 = totalesDe(T.est, aj).total; sal.trabajos.pop(); tar.cant -= 2;
  a('al deshacer los cambios vuelve el total de la V2', totalesDe(T.est, aj).total === T.v2.total && total1 > T.v2.total);
  const hab = T.est.find(e => e.tipo === 'habitacion'); const tarH = hab.trabajos.find(t => t.k === 'tarima'); const pH = hab.trabajos.find(t => t.k === 'pint_pared');
  pH.manual = true; pH.cant = 99; hab.m2 = 20; recalcM2(hab);
  a('al cambiar los m² se recalculan las partidas por m² no editadas', tarH.cant === 20 && pH.cant === 99);
  a('subtotal de estancia = suma de sus trabajos vivos', subEst(hab) === r2(hab.trabajos.reduce((s, t) => s + subLinea(t), 0)));
  hab.revisada = true; a('progreso cuenta las estancias revisadas', progreso(T).revisadas === 1 && progreso(T).total === 8);
  a('estado de la estancia: revisada / en curso / pendiente', estadoEst(hab) === 'revisada' && estadoEst(T.est[0]) === 'pendiente' && (T.est[0].trabajos[0].confirmado = true) && estadoEst(T.est[0]) === 'curso');
  a('pendientes = no revisadas', pendientes(T).length === 7);
  a('mensaje al cliente incluye total, V2 y cambios', (() => { const m = mensajeCliente(T); return m.includes('V3') && m.includes('V2') && /Cambios tras la visita/.test(m) && m.includes('[enlace'); })());
  a('finalDe aplica margen e IVA', finalDe(100, { margen:22, iva:21 }) === 147.62);
  a('formato de euros con miles', eur(1234.5) === '1.234,50 €' && eur0(12500) === '12.500 €');
  a('guardado: el estado sobrevive a JSON', (() => { const c = JSON.parse(JSON.stringify(T)); return totalesDe(c.est, c.ajustes).total === totalesDe(T.est, aj).total; })());
  a('el catálogo tiene trabajos para cada tipo habitual', ['salon', 'cocina', 'bano', 'habitacion', 'pasillo'].every(t => CAT.some(c => c.t.includes(t))));
  const msg = ok + '/' + tot + ' pruebas correctas'; console.log('%c' + msg + (fails.length ? ' · fallos: ' + fails.join(' | ') : ' ✓'), 'font-weight:bold'); return { ok, total:tot, fails };
};
